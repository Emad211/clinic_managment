# =============================================================================
# halqe — production / staging topology (step 55, cluster M)
# =============================================================================
# This compose file describes the PRODUCTION (and staging) deployment topology
# for the halqe platform on a single Iranian VPS. It is CONFIG ONLY — the actual
# VPS provisioning + TLS certs + backup cron are the OWNER's gate. Bringing this
# up live is a deliberate, owner-approved act (see docs/deploy_runbook.md).
#
# TOPOLOGY (same-origin: nginx fronts BOTH the web UI and the API)
#   internet ──443/80──▶ nginx ──(internal net)──▶ /        → web:3000 (Next.js)
#                                              └──▶ /api/v1 → app:8000 ──▶ postgres:5432
#                                                                   ▲          │
#                                       scheduler (profile, ticks ──┘    backup (cron/service)
#                                       generate_followups + run_engagement)
#
#   • app/web/scheduler/backup share the internal net; scheduler + backup are
#     PROFILE-GATED (a plain `up` starts only postgres/app/web/nginx). The
#     scheduler is the external engagement/follow-up ticker (halqe has no
#     in-process daemon) — see its block below + docs/runbook_engagement.md.
#
#   • Only nginx is published to the host (80 + 443). app:8000 and postgres:5432
#     stay on the INTERNAL docker network and are NEVER published to the host —
#     nginx is the single public ingress, and it is the REAL rate-limit boundary
#     (limit_req) + the thing that strips spoofed X-Forwarded-For.
#   • postgres data + backups live on NAMED VOLUMES (survive container recreate).
#
# CONN_MAX_AGE=0 INVARIANT (ADR-0008)
#   The app connects DIRECTLY to Postgres. There is intentionally NO connection
#   pooler (no PgBouncer transaction mode). Each request opens a fresh connection
#   so the per-connection tenant GUC (app.current_tenant) dies with the request
#   and cannot leak across tenants. DO NOT add a transaction-mode pooler here.
#
# SECRETS
#   Nothing sensitive is hardcoded. Everything comes from .env (git-ignored).
#   Copy .env.example → .env on the VPS and fill in real values. The compose
#   variables below interpolate from that .env (or the shell environment).
#
# USAGE (see docs/deploy_runbook.md for the full runbook)
#   docker compose config        # validate this file + .env interpolation
#   docker compose build         # build the app image from halqe/Dockerfile
#   docker compose up -d         # start postgres → app (entrypoint applies schema) → nginx
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Postgres — the single DB holding platform/accounting/clinical namespaces.
  # NOT published to the host: only the app (same internal network) reaches it.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    # POSTGRES_* come from .env. POSTGRES_DB must match PG_DB the app uses.
    environment:
      POSTGRES_USER: "${PG_USER}"
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
      POSTGRES_DB: "${PG_DB}"
      # Keep timestamps/logs in Tehran local time, consistent with the app.
      TZ: "Asia/Tehran"
      PGTZ: "Asia/Tehran"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    # OPTIONAL: bind to loopback only if you must reach PG from the host for ops
    # (psql/pg_dump from the host). Leave commented for the most-locked-down
    # posture — the backup service runs INSIDE the network and does not need it.
    # ports:
    #   - "127.0.0.1:55432:5432"
    healthcheck:
      # pg_isready against the real DB/user — the app's depends_on waits on this.
      test: ["CMD-SHELL", "pg_isready -U \"${PG_USER}\" -d \"${PG_DB}\" -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # app — the Django/gunicorn backend. Built from halqe/Dockerfile.
  # entrypoint.sh waits for Postgres, runs apply_schema + ensure_app_role, then
  # exec's gunicorn on 0.0.0.0:8000. 8000 is exposed ONLY on the internal
  # network (no `ports:` mapping) — nginx fronts it.
  # ---------------------------------------------------------------------------
  app:
    build:
      # Build context is the REPO ROOT (one level up) because the Dockerfile
      # COPYs halqe/ and halqe/db/schema/ from the repo root — see its header.
      context: ..
      dockerfile: halqe/Dockerfile
    restart: unless-stopped
    # All app env (PRODUCTION, SECRET_KEY, ALLOWED_HOSTS, PG_APP_*, SMS_*, …)
    # comes from .env. No secrets in this file.
    env_file:
      - .env
    # Compose-level overrides that are TOPOLOGY facts (not secrets): inside the
    # network Postgres is reachable as host `postgres` on its native port 5432.
    # These override whatever PG_HOST/PG_PORT happen to be in .env (which point
    # at the host-side dev port). entrypoint.sh reads PG_HOST/PG_PORT.
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    # NO `ports:` — 8000 is internal-only. nginx is the only public ingress.
    # The Dockerfile already EXPOSE 8000 (documentation/internal reachability).
    healthcheck:
      # /healthz is liveness-only (no DB) — see platform_core/health.py.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Bound the on-disk log footprint. gunicorn streams access+error logs to
    # stdout/stderr (entrypoint.sh: --access-logfile - / --error-logfile -) and
    # Django's structured logging goes to the console handler — all captured by
    # Docker's json-file driver, which is UNBOUNDED by default. On a single VPS
    # that can silently fill the disk. Cap it: keep 5 × 20 MB per container.
    # `docker compose logs app` / `docker logs <id>` still read these files.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # web — the Next.js patient/clinic UI. Built from halqe/web/Dockerfile
  # (next.config output:"standalone" → `node server.js` on :3000). Internal-only;
  # nginx fronts it at `/`, SAME-ORIGIN with /api/v1 — so the client calls the API
  # via a RELATIVE path (no CORS, no baked API host). See deploy_runbook.md §11.
  # The image build needs the npm registry (offline fallback in halqe/web/Dockerfile).
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    # No env needed for the pilot: the client uses a RELATIVE /api/v1 base
    # (same-origin behind nginx). NEXT_PUBLIC_* is build-time only and the relative
    # default in web/src/lib/api/_core.ts needs no override.
    networks:
      - internal
    # NO `ports:` — :3000 is internal-only; nginx is the only public ingress.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # nginx — the ONLY public ingress. Terminates TLS, redirects 80→443, proxies
  # /api/ + probes to app:8000, and is the REAL rate-limit boundary (limit_req)
  # for the public patient endpoints. Config + certs are mounted READ-ONLY.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The site config (read-only). nginx:alpine includes the bundled http {}
      # context that `include`s /etc/nginx/conf.d/*.conf. We mount OVER the stock
      # `default.conf` (the "Welcome to nginx!" page) — NOT alongside it. If both
      # existed, conf.d loads alphabetically (default < halqe) and the stock
      # default.conf, being the first `listen 80` block, becomes the implicit
      # default_server → it would answer any Host (e.g. halqehealth.ir) on :80 and
      # shadow our 80→443 redirect, serving the welcome page. Replacing it removes
      # that shadow so our server blocks are the only ones. (Our listen directives
      # are also marked `default_server` as belt-and-suspenders.)
      - ./deploy/nginx/halqe.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS material — provide certs on the host under ./deploy/nginx/certs/
      # (git-ignored). Let's Encrypt or owner-provided. See the runbook.
      - certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - web
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # backup — periodic pg_dump via scripts/backup.sh (step 54). Optional service:
  # the simpler/recommended path is a HOST cron calling scripts/backup.sh (see
  # the runbook). This container is provided for hosts where a host cron is not
  # convenient. It runs ON THE INTERNAL NETWORK so it reaches `postgres` and
  # writes dumps to the shared `backups` named volume.
  #
  # Enabled only via the "backup" profile so a plain `up` does not start it:
  #   docker compose --profile backup up -d backup
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:16   # has pg_dump/pg_isready matching the server major
    restart: unless-stopped
    profiles: ["backup"]
    environment:
      # backup.sh / _pg_env.sh resolve PG* from these. Reads PG_DB; dumps as the
      # superuser role so the full DB (all namespaces) is captured.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: "${PG_USER}"
      PGPASSWORD: "${PG_PASSWORD}"
      PGDATABASE: "${PG_DB}"
      BACKUP_DIR: /backups
      BACKUP_KEEP: "${BACKUP_KEEP:-14}"
      TZ: "Asia/Tehran"
    volumes:
      # The backup scripts (read-only) + the shared backups volume (read-write).
      - ./scripts:/opt/halqe/scripts:ro
      - backups:/backups
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    # Simple in-container loop: dump on start, then every BACKUP_EVERY seconds
    # (default 24h). For finer scheduling prefer the host-cron path in the runbook.
    # NOTE: the postgres:16 image (debian-bookworm) ALREADY ships /bin/bash, so we
    # do NOT apt-get install anything — on Iran's national uplink deb.debian.org is
    # unreachable and an apt-get here would stall each cycle by the connect timeout
    # (confirmed on the Arvan box, 2026-07). The scripts run directly.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          bash /opt/halqe/scripts/backup.sh "$$PGDATABASE" || echo "backup failed";
          sleep "$${BACKUP_EVERY:-86400}";
        done

  # ---------------------------------------------------------------------------
  # scheduler — the EXTERNAL engagement/follow-up tick (step 80 / T2).
  #
  # WHY THIS EXISTS: halqe is a cloud Django app with NO in-process daemon thread
  # (unlike the Flask desktop apps). Without an external ticker the follow-up→
  # engagement half of the care loop is INERT in production. This service is that
  # ticker — it runs the SAME backend image as `app`, but instead of gunicorn it
  # runs a tiny shell loop that calls two management commands every N seconds.
  #
  # WHAT IT RUNS EACH TICK (generate_followups FIRST, then run_engagement):
  #   • generate_followups  — clinical follow-up worklist. ALWAYS runs (even in
  #     worklist-only mode): "care/red-flags are never withheld". Idempotent.
  #   • run_engagement [--worklist-only] — routes due events to channels. It is
  #     advisory-locked (no concurrent run; exits 0 on skip) and NEVER sends SMS
  #     (it only enqueues physician approvals). See docs/runbook_engagement.md.
  #
  # THE HOLDOUT GATE (SCHEDULER_WORKLIST_ONLY, default "1" = SAFE):
  #   Outreach (the SMS/approval channel of run_engagement) stays OFF until the
  #   owner (a) runs assign_engagement_holdout to FREEZE the control cohort, (b)
  #   records baseline, then (c) flips SCHEDULER_WORKLIST_ONLY=0. Defaulting to
  #   worklist-only is fail-safe: if someone forgets to freeze the holdout, no
  #   outreach is queued and the causal control group is not polluted. (SMS is
  #   ALSO blocked by KYC 430 + per-patient sms_consent — this is a third layer.)
  #
  # NOT entrypoint.sh: the `app` service's entrypoint already applies the schema
  # (apply_schema + ensure_app_role). The scheduler MUST NOT re-apply it — so we
  # override the entrypoint to a plain `sh -c` loop that only calls manage.py.
  #
  # Profile-gated like `backup`: a plain `up` does NOT start it. Bring it up only
  # as a deliberate go-live act (and it IS part of the go-live checklist — without
  # it the clinical worklist is never generated):
  #   docker compose --profile scheduler up -d scheduler
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      # Same image as `app` (build context = repo root; see app + Dockerfile header).
      context: ..
      dockerfile: halqe/Dockerfile
    restart: unless-stopped
    profiles: ["scheduler"]
    env_file:
      - .env
    environment:
      # Topology facts (override .env's host-side dev values), same as `app`.
      PG_HOST: postgres
      PG_PORT: "5432"
      # Tehran local time so heartbeat/log timestamps match the project's Iran-time rule.
      TZ: "Asia/Tehran"
      # SAFE DEFAULT: worklist-only until the owner freezes the holdout + enables
      # outreach (set to "0" in .env). See the holdout-gate note above.
      SCHEDULER_WORKLIST_ONLY: "${SCHEDULER_WORKLIST_ONLY:-1}"
      # Tick interval (seconds) and warmup before the first tick.
      SCHEDULER_EVERY: "${SCHEDULER_EVERY:-300}"
      SCHEDULER_WARMUP: "${SCHEDULER_WARMUP:-30}"
    depends_on:
      postgres:
        condition: service_healthy
      # Wait for `app` to START so its entrypoint has applied the schema before
      # the first tick touches clinical tables (service_started is enough — we do
      # not need it healthy, just past its schema-apply step).
      app:
        condition: service_started
    networks:
      - internal
    # NO `ports:` — internal-only; this service has no listening socket anyway.
    # Override entrypoint → tiny shell loop (NOT the app's gunicorn entrypoint).
    # Compose interpolates single-$ ${...}; runtime shell vars are escaped $$.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "scheduler: warmup $${SCHEDULER_WARMUP:-30}s before first tick";
        sleep "$${SCHEDULER_WARMUP:-30}";
        WL="";
        if [ "$${SCHEDULER_WORKLIST_ONLY:-1}" = "1" ]; then WL="--worklist-only"; fi;
        echo "scheduler: loop every $${SCHEDULER_EVERY:-300}s worklist_only=$${SCHEDULER_WORKLIST_ONLY:-1}";
        while true; do
          python manage.py generate_followups || echo "scheduler: generate_followups failed (continuing)";
          python manage.py run_engagement $$WL || echo "scheduler: run_engagement failed (continuing)";
          date -u +%FT%TZ > /tmp/scheduler.heartbeat;
          echo "scheduler_tick done ts=$$(date -u +%FT%TZ) worklist_only=$${SCHEDULER_WORKLIST_ONLY:-1}";
          sleep "$${SCHEDULER_EVERY:-300}";
        done
    # Heartbeat healthcheck: the loop writes /tmp/scheduler.heartbeat after EVERY
    # tick (written to /tmp, not a volume, because the container runs as non-root
    # `halqe` and a root-owned named volume would not be writable). "unhealthy"
    # means the loop is stuck (e.g. a wedged run holding the advisory lock) even
    # though the container is still "up". stat+date are coreutils (always present
    # in python:3.13-slim); staleness window = 3× the tick interval.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/scheduler.heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/scheduler.heartbeat) )) -lt $$(( $${SCHEDULER_EVERY:-300} * 3 ))"]
      interval: 60s
      timeout: 5s
      retries: 3
      # Generous: must exceed warmup + the first (cold) generate+engagement tick.
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

# -----------------------------------------------------------------------------
# Named volumes — persist across `docker compose down`/recreate.
#   pgdata  : Postgres data dir (the database itself).
#   backups : pg_dump output (step 54). PHI — keep off-box copies too (runbook).
#   certs   : TLS certs/keys mounted into nginx (provision on host; git-ignored).
# -----------------------------------------------------------------------------
volumes:
  pgdata:
  backups:
  certs:

# -----------------------------------------------------------------------------
# Networks — a single INTERNAL bridge. Only nginx publishes host ports; app and
# postgres are reachable solely from inside this network.
# -----------------------------------------------------------------------------
networks:
  internal:
    driver: bridge
