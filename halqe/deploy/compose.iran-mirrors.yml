# =============================================================================
# halqe — Iran national-uplink build overlay (deploy/compose.iran-mirrors.yml)
# =============================================================================
# A SMALL overlay layered ON TOP of docker-compose.yml. It ONLY injects
# build.args that repoint pip / npm at IN-COUNTRY mirrors, for the ArvanCloud
# "Abrak" staging box whose network can reach Iranian hosts ONLY (pypi.org /
# registry.npmjs.org / github.com all time out; docker.arvancloud.ir and
# Iranian PyPI/npm mirrors respond).
#
# Nothing here changes the base topology, ports, volumes, env, or the OFFICIAL
# defaults baked into the Dockerfiles — those defaults still apply for every
# normal build/CI. This overlay is opt-in via `-f`:
#
#   docker compose -f docker-compose.yml -f deploy/compose.iran-mirrors.yml build app
#   docker compose -f docker-compose.yml -f deploy/compose.iran-mirrors.yml build web
#   # (and pass the SAME -f pair to `up` so services resolve identically)
#
# ⚠️ MIRROR URLs BELOW ARE CANDIDATES. The DEFINITIVE mirror is decided by the
# on-server probe (which in-country mirror actually answers) — override via the
# PIP_INDEX_URL_IRAN / NPM_REGISTRY_IRAN env vars if the probe picks another.
# =============================================================================

services:
  # Backend (Django/gunicorn) — pip index → Iranian PyPI mirror.
  app:
    build:
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL_IRAN:-https://mirror-pypi.runflare.com/simple}"

  # scheduler shares the SAME build context/image as `app` (build context = repo
  # root, halqe/Dockerfile). It must get the SAME pip mirror so its image builds.
  scheduler:
    build:
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL_IRAN:-https://mirror-pypi.runflare.com/simple}"

  # Web (Next.js) — npm registry → Iranian npm mirror.
  web:
    build:
      args:
        NPM_REGISTRY: "${NPM_REGISTRY_IRAN:-https://mirror-npm.runflare.com}"
