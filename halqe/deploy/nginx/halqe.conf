# =============================================================================
# halqe — nginx reverse proxy + TLS + rate-limit (step 55 / step 66)
# =============================================================================
# Mounted read-only into the nginx:alpine container at
#   /etc/nginx/conf.d/halqe.conf
# The base nginx.conf's http {} block already `include`s conf.d/*.conf, so the
# directives below live in the http context (limit_req_zone, upstream) and a
# server context (the two server {} blocks).
#
# WHAT THIS FILE IS RESPONSIBLE FOR (the security boundary):
#   1. TLS termination (443) + a hard 80→443 redirect.
#   2. The REAL per-IP rate limit (limit_req) for the PUBLIC patient endpoints —
#      /api/v1/card/ and /api/v1/patient-report/. The app's in-process limiter
#      is best-effort/per-worker only (see clinical/api/patient_card.py); THIS
#      is the boundary that actually caps a single IP.
#   3. real_ip handling that OVERWRITES any client-supplied X-Forwarded-For /
#      X-Real-IP so the app never trusts a spoofed value.
#
# The Next.js web app is a SEPARATE deployment (see the runbook §"Serving the
# web"). This config focuses on the API; an optional web upstream is sketched
# at the bottom (commented) if you choose to colocate it later.
# =============================================================================

# -----------------------------------------------------------------------------
# Upstream — the gunicorn app on the internal docker network.
# `app` resolves via docker DNS to the app service; 8000 is its internal port.
# -----------------------------------------------------------------------------
upstream halqe_app {
    server app:8000;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# Rate-limit zones (step 66 — THE real boundary). Keyed by $binary_remote_addr,
# i.e. the REAL client IP after real_ip resolution (see set_real_ip_from below).
#
#   card_zone   : the public card READ surface  GET /api/v1/card/{token}
#   report_zone : the public self-report SUBMIT POST /api/v1/patient-report/{token}
#
# Rates are intentionally modest — these are patient-facing one-shot pages, not
# high-frequency APIs. 10m of shared memory holds ~160k distinct IP states.
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=card_zone:10m   rate=30r/m;
limit_req_zone $binary_remote_addr zone=report_zone:10m rate=12r/m;

# 429 (not the default 503) so the response matches the app's ErrorSchema 429
# contract (clinical/api/patient_card.py returns 429 on its own limiter).
limit_req_status 429;

# Send a small connection-level cap too: one IP cannot hold many concurrent
# slow connections to the public surface.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# -----------------------------------------------------------------------------
# real_ip — trust ONLY the proxy chain, never the client.
#
# nginx is the edge. The client connects to nginx directly, so for the public
# internet the only trustworthy client identity is the TCP peer ($remote_addr).
# We must NOT let a client inject its own X-Forwarded-For to dodge limit_req.
#
#   • set_real_ip_from <trusted ranges>  — only these sources may set XFF.
#     Here: the docker bridge / private ranges + loopback (adjust to the actual
#     bridge subnet in production; private ranges are a safe superset).
#   • real_ip_header X-Forwarded-For     — read the real IP from XFF *only* when
#     the immediate peer is in a trusted range; otherwise $remote_addr is used.
#   • real_ip_recursive on               — walk the XFF chain skipping trusted
#     hops to find the left-most untrusted address (the real client).
#
# CRITICAL: in every `location` we EXPLICITLY set the upstream headers from
# nginx's own computed values ($remote_addr / $proxy_add_x_forwarded_for), which
# OVERWRITES whatever the client sent. A client-supplied X-Forwarded-For never
# reaches the app verbatim — the app only ever sees nginx's value.
# -----------------------------------------------------------------------------
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;   # docker default bridge networks live here
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Hide the upstream server token; cap request body (patient self-report is tiny).
server_tokens off;
client_max_body_size 1m;

# -----------------------------------------------------------------------------
# HTTP :80 — redirect everything to HTTPS (single hard redirect).
# Exception: leave room for an ACME http-01 challenge if you use certbot's
# webroot mode (uncomment the /.well-known block).
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME http-01 challenge (Let's Encrypt webroot). Uncomment + mount a
    # webroot volume if provisioning certs this way (see the runbook).
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS :443 — TLS termination + reverse proxy to the app.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;   # replace with api.halqe.ir (must match ALLOWED_HOSTS)

    # ── TLS material (mounted from the `certs` volume, read-only) ────────────
    # Placeholders — provision real certs on the VPS (Let's Encrypt / owner-
    # provided). The runbook documents both paths. Filenames are conventions;
    # adjust to whatever you mount into /etc/nginx/certs.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ── TLS hardening (TLS1.2+ only, modern ciphers) ─────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — only enable once you are confident HTTPS is permanent for this host.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Connection cap (defence in depth alongside limit_req).
    limit_conn conn_per_ip 20;

    # ── Standard proxy header set (reused by every proxy location) ───────────
    # These OVERWRITE any client-supplied values: $proxy_add_x_forwarded_for is
    # built by nginx (real client + existing trusted chain), and $remote_addr is
    # nginx's computed real client IP. The app therefore never sees a spoofed
    # X-Forwarded-For / X-Real-IP.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;   # matches gunicorn --timeout 120
    proxy_send_timeout    120s;

    # ── Observability probes (no rate limit; load-balancer / uptime checks) ──
    location = /healthz {
        proxy_pass http://halqe_app;
        access_log off;
    }
    location = /readyz {
        proxy_pass http://halqe_app;
        access_log off;
    }

    # ── PUBLIC patient card READ — the rate-limit boundary (step 66) ─────────
    # GET /api/v1/card/{token}. burst=5 absorbs a short legitimate spike (a
    # patient refreshing / a tablet re-loading); nodelay serves the burst
    # immediately, excess → 429. This is the HARD per-IP cap; the app's
    # per-token in-process limiter is only a cheap second layer.
    location /api/v1/card/ {
        limit_req zone=card_zone burst=5 nodelay;
        proxy_pass http://halqe_app;
    }

    # ── PUBLIC self-report SUBMIT — the rate-limit boundary (step 66) ────────
    # POST /api/v1/patient-report/{token}. Tighter than card (writes a row,
    # one-time token). burst=3 nodelay; excess → 429.
    location /api/v1/patient-report/ {
        limit_req zone=report_zone burst=3 nodelay;
        proxy_pass http://halqe_app;
    }

    # ── All other API traffic (JWT-authenticated staff endpoints) ────────────
    # No per-IP limit_req here: these are authenticated and low-volume; the
    # public unauthenticated surface above is the part that needs the hard cap.
    location /api/v1/ {
        proxy_pass http://halqe_app;
    }

    # ── Default: nothing else is served by the API host. ─────────────────────
    location / {
        return 404;
    }

    # -------------------------------------------------------------------------
    # OPTIONAL — colocating the Next.js web app behind the same nginx.
    # The web is a SEPARATE Next.js deployment (halqe/web/). The recommended
    # model keeps it separate (its own host / static export / `next start`),
    # with NEXT_PUBLIC_API_BASE pointed at https://<this-host>/api/v1. If you
    # later want to front the web here too, add a `web` upstream + a server
    # block for the web hostname (e.g. app.halqe.ir) — DO NOT mix it into this
    # api.halqe.ir server. See the runbook §"Serving the web".
    # -------------------------------------------------------------------------
}
