# Local/staging stack. In production use managed Postgres (Arvan/Liara) and set
# DATABASE_URL to the clinic_app (NOBYPASSRLS) role, ADMIN_DATABASE_URL to a
# privileged role for migrations/seeding.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: clinic_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init.sql:/docker-entrypoint-initdb.d/10-db-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      # migrations/seed run as the privileged role; the app runs as clinic_app
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/clinic_platform
      DATABASE_URL: postgres://clinic_app:clinic_app_pw@db:5432/clinic_platform
      SEED_ON_START: "1"
    ports:
      - "8000:8000"

volumes:
  pgdata:
