<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}پلتفرم کلینیک{% endblock %}</title>
  <style>
    :root{
      --bg:#0f1419; --panel:#1a2129; --panel2:#222c36; --line:#2c3742;
      --txt:#e6edf3; --muted:#9bb0c0; --accent:#3fb6a8; --accent2:#5aa9e6;
      --warn:#e0a64a; --danger:#e0574a; --info:#5aa9e6;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);
      font-family:Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7}
    a{color:var(--accent2);text-decoration:none}
    header{background:var(--panel);border-bottom:1px solid var(--line);
      padding:.7rem 1.2rem;display:flex;justify-content:space-between;align-items:center}
    header .brand{font-weight:bold;color:var(--accent)}
    header nav a{margin-inline-start:1rem;color:var(--muted)}
    main{max-width:1000px;margin:1.5rem auto;padding:0 1rem}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
      padding:1.2rem;margin-bottom:1.2rem}
    .card h2,.card h3{margin-top:0}
    input,button{font-family:inherit;font-size:1rem}
    input[type=text],input[type=password]{width:100%;padding:.6rem .8rem;margin:.3rem 0 1rem;
      background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt)}
    button{background:var(--accent);color:#06231f;border:0;border-radius:8px;
      padding:.6rem 1.2rem;font-weight:bold;cursor:pointer}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:right;padding:.55rem .6rem;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-weight:600}
    .chip{display:inline-block;padding:.15rem .6rem;border-radius:999px;font-size:.8rem;
      background:var(--panel2);border:1px solid var(--line);margin:.1rem}
    .sev-urgent{color:var(--danger)} .sev-warn{color:var(--warn)} .sev-info{color:var(--info)}
    .error{background:#3a1f1f;border:1px solid var(--danger);color:#f2c0bb;
      padding:.6rem 1rem;border-radius:8px;margin-bottom:1rem}
    .disclaimer{color:var(--warn);font-size:.9rem;margin:.3rem 0 1rem}
    .muted{color:var(--muted)} .big{font-size:1.4rem;font-weight:bold}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.8rem}
    .metric{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.8rem}
    .sugg{border-inline-start:3px solid var(--accent);padding:.5rem .8rem;margin:.5rem 0;
      background:var(--panel2);border-radius:0 8px 8px 0}
  </style>
</head>
<body>
  <header>
    <span class="brand">🩺 پلتفرم کلینیک</span>
    <nav>
      {% if request.session.user_id %}
        <a href="{% url 'web:patients' %}">بیماران</a>
        <a href="{% url 'web:worklist' %}">کارتابل پیگیری</a>
        <a href="{% url 'web:billing' %}">اشتراک</a>
        <a href="{% url 'web:logout' %}">خروج</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
