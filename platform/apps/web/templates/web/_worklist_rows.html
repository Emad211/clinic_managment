{% if rows %}
<table>
  <thead><tr><th>بیمار</th><th>پیگیری</th><th>سررسید</th><th></th></tr></thead>
  <tbody>
    {% for t in rows %}
      <tr>
        <td><a href="{% url 'web:patient_detail' t.patient.id %}">{{ t.patient.full_name|default:t.patient.national_id|default:'—' }}</a></td>
        <td>{{ t.title|default:t.item_key }}</td>
        <td>{{ t.due_date|date:"Y/m/d"|default:'—' }}</td>
        <td style="display:flex;gap:.4rem">
          <form method="post" action="{% url 'web:followup_remind' t.id %}" style="margin:0">
            {% csrf_token %}
            <button type="submit" title="ارسال پیامک یادآوری" style="padding:.25rem .7rem;font-size:.85rem;background:var(--accent2);color:#06231f">📲 یادآوری</button>
          </form>
          <form method="post" action="{% url 'web:followup_done' t.id %}" style="margin:0">
            {% csrf_token %}
            <button type="submit" style="padding:.25rem .7rem;font-size:.85rem">انجام شد</button>
          </form>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<div class="muted">موردی نیست.</div>
{% endif %}
