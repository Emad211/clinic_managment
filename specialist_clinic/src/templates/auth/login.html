<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>ورود — کلینیک تخصصی</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="auth-wrap">
        <form class="auth-card" method="post" autocomplete="on">
            <div class="auth-brand">
                <span class="brand-mark">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>
                    </svg>
                </span>
                <b>کلینیک تخصصی</b>
                <small>مدیریت بیماری‌های مزمن</small>
            </div>

            {% with messages = get_flashed_messages() %}
                {% for msg in messages %}
                <div class="flash" role="alert" style="justify-content:center;">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                    <span>{{ msg }}</span>
                </div>
                {% endfor %}
            {% endwith %}

            <label for="username">نام کاربری</label>
            <input id="username" type="text" name="username" autocomplete="username" autofocus required>

            <label for="password">رمز عبور</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>

            <button class="btn btn-block btn-lg" type="submit" style="margin-top:22px;">ورود</button>
        </form>
    </div>
</body>
</html>
