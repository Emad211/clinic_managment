<link rel="stylesheet" href="{{ url_for('static', filename='css/message-center-automation-v1.css') }}">
<section class="message-center-shell" aria-labelledby="message-center-title">
    <div class="message-center-heading">
        <div>
            <h2 id="message-center-title"><svg class="icon"><use href="#i-megaphone"></use></svg> مرکز پیام‌ها</h2>
            <p class="muted text-sm">پیام‌های نیازمند تصمیم، کمپین‌ها و گزارش ارسال.</p>
        </div>
    </div>
    <nav class="hub-nav" aria-label="بخش‌های مرکز پیام‌ها">
        {% if permissions.get('sms.view') %}<a class="btn btn-sm hub-nav-btn {% if hub_tab=='approvals' %}btn{% else %}btn-ghost{% endif %}"{% if hub_tab=='approvals' %} aria-current="page"{% endif %} href="{{ url_for('sms.approvals') }}"><svg class="icon icon-sm"><use href="#i-check"></use></svg> نیازمند تأیید{% if hub_pending %} <span class="pill pill-danger">{{ hub_pending|fa_num }}</span>{% endif %}</a>{% endif %}
        {% if permissions.get('sms.view') %}<a class="btn btn-sm hub-nav-btn {% if hub_tab=='campaigns' %}btn{% else %}btn-ghost{% endif %}"{% if hub_tab=='campaigns' %} aria-current="page"{% endif %} href="{{ url_for('sms.campaigns') }}"><svg class="icon icon-sm"><use href="#i-megaphone"></use></svg> کمپین‌ها</a>{% endif %}
        {% if permissions.get('sms.view') %}<a class="btn btn-sm hub-nav-btn {% if hub_tab=='messages' %}btn{% else %}btn-ghost{% endif %}"{% if hub_tab=='messages' %} aria-current="page"{% endif %} href="{{ url_for('sms.messages_report') }}"><svg class="icon icon-sm"><use href="#i-activity"></use></svg> گزارش ارسال</a>{% endif %}
    </nav>
</section>
