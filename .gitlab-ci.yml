# Self-hosted GitLab CI (docs/TECH_STACK.md). Runs the platform's checks +
# the RLS isolation proof against a real Postgres on every push.
stages: [test]

platform-test:
  stage: test
  image: python:3.13-slim
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    POSTGRES_DB: clinic_ci
    POSTGRES_PASSWORD: ci
    DATABASE_URL: "postgres://postgres:ci@postgres:5432/clinic_ci"
    DJANGO_SECRET_KEY: ci-only-secret
    DJANGO_DEBUG: "False"
    DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
    PIP_INDEX_URL: "${PIP_INDEX_URL}"  # set an Iranian mirror in CI/CD variables
  before_script:
    - cd platform
    - pip install -r requirements.txt
  script:
    - python manage.py check
    - python manage.py migrate --noinput
    - python manage.py verify_rls          # proves tenant isolation on real Postgres
  rules:
    - if: '$CI_COMMIT_BRANCH'
