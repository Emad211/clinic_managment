name: Temporary FO-6 authorization runner

on:
  push:
    branches:
      - docs/foux-v1-fo5-acceptance-fo6-authorization
    paths:
      - .github/workflows/temp_fo6_runner.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp_fo6_runner.yml
      - .github/workflows/temp_fo6_authorization.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/foux-v1-fo5-acceptance-fo6-authorization
      - name: Extract and apply authorization patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/temp_fo6_authorization.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(
              i for i, line in enumerate(lines)
              if line.strip() == "python - <<'PY'"
          ) + 1
          end = next(
              i for i in range(start, len(lines))
              if lines[i].strip() == 'PY'
          )
          body = []
          for line in lines[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('.tmp_fo6_authorize.py').write_text(
              '\n'.join(body) + '\n', encoding='utf-8'
          )
          PY
          python .tmp_fo6_authorize.py
          rm .tmp_fo6_authorize.py
      - name: Commit canonical state and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_fo6_authorization.yml
          git rm .github/workflows/temp_fo6_runner.yml
          git add PROJECT_STATE.json PROJECT_STATE.md specialist_clinic/AGENTS.md specialist_clinic/docs specialist_clinic/tests
          git commit -m "docs(foux): record FO-5 acceptance and authorize FO-6"
          git push origin HEAD:docs/foux-v1-fo5-acceptance-fo6-authorization
