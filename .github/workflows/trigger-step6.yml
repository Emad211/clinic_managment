name: Dispatch Step 6 Finalizer

on:
  push:
    branches:
      - agent-clinical-operational-security

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch strict finalizer
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: >-
          gh api --method POST
          repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches
          -f ref=${REF_NAME}
