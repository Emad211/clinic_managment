name: Temporary final SLA branch sync with main

on:
  push:
    branches:
      - fix/foux-sla-filter-vocabulary

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foux-sla-filter-vocabulary
          fetch-depth: 0
      - name: Merge final seed repair from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/temp_sync_sla_main_final.yml
          git add -u
          git commit -m "chore: remove temporary final SLA sync workflow"
          git push origin HEAD:fix/foux-sla-filter-vocabulary
