name: Temporary focused FO-5 CI repairs

on:
  push:
    branches:
      - feature/foux-v1-fo5-structured-contact
    paths:
      - .github/workflows/temp_fo5_ci_repairs.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foux-v1-fo5-structured-contact
      - name: Apply focused repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('specialist_clinic/src/adapters/sqlite/followup_operations_repo.py')
          text = repo.read_text(encoding='utf-8')
          text = text.replace(
              '        occurred_at: datetime | str | None = None,\n'
              '        note: str | None = None,',
              '        occurred_at: datetime | str | None = None,\n'
              '        recorded_at: datetime | str | None = None,\n'
              '        note: str | None = None,',
          )
          text = text.replace(
              '        recorded = _text()\n'
              '        occurred = _text(occurred_at or recorded)\n',
              '        recorded = _text(recorded_at)\n'
              '        occurred = _text(occurred_at or recorded)\n'
              '        if datetime.fromisoformat(recorded) < datetime.fromisoformat(occurred):\n'
              '            recorded = occurred\n',
          )
          repo.write_text(text, encoding='utf-8')

          service = Path('specialist_clinic/src/services/followup_orchestration/structured_contact_service.py')
          text = service.read_text(encoding='utf-8')
          needle = '                occurred_at=current_time,\n                note=normalized_note,\n'
          replacement = '                occurred_at=current_time,\n                recorded_at=current_time,\n                note=normalized_note,\n'
          if needle not in text:
              raise SystemExit('service create_contact marker not found')
          service.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          fo3 = Path('specialist_clinic/tests/test_followup_orchestration_fo3.py')
          text = fo3.read_text(encoding='utf-8')
          text = text.replace(
              '    assert route_source.count("@bp.post") == 4\n'
              '    assert "_require_actions_flag()" in route_source\n'
              '    assert "_require_routing_flag()" in route_source\n',
              '    assert route_source.count("@bp.post") == 5\n'
              '    assert "_require_actions_flag()" in route_source\n'
              '    assert "_require_routing_flag()" in route_source\n'
              '    assert "_require_structured_contact_flag()" in route_source\n'
              '    assert "FOLLOWUP_STRUCTURED_CONTACT" in route_source\n'
              '    assert "def record_contact" in route_source\n',
          )
          fo3.write_text(text, encoding='utf-8')

          fo4 = Path('specialist_clinic/tests/test_followup_orchestration_fo4_contract.py')
          text = fo4.read_text(encoding='utf-8')
          text = text.replace(
              '    assert api.count("@bp.post") == 4\n',
              '    assert api.count("@bp.post") == 5\n'
              '    assert "def record_contact" in api\n'
              '    assert "_require_structured_contact_flag()" in api\n'
              '    assert "FOLLOWUP_STRUCTURED_CONTACT" in api\n',
          )
          fo4.write_text(text, encoding='utf-8')
          PY
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_fo5_ci_repairs.yml
          git add specialist_clinic/src specialist_clinic/tests
          git commit -m "fix(foux): align FO-5 timestamps and route guards"
          git push origin HEAD:feature/foux-v1-fo5-structured-contact
