name: Temporary FO-5 authorization governance

on:
  push:
    branches:
      - docs/foux-v1-fo5-authorization
    paths:
      - .github/workflows/temp_fo5_authorize.yml

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/foux-v1-fo5-authorization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize FO-5 authorization
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          runtime_commit = 'cd243424ecbae98892e0dfde1780bb846554942f'

          # Machine-readable project state.
          state_path = root / 'PROJECT_STATE.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['schema_version'] = '2.4'
          state['audited_at'] = '2026-08-04T02:24:00+03:30'
          state['product_authority']['head'] = '51221f9b69371085a7c4c745c2c095b6fff13f8e'
          state['product_authority']['head_note'] = (
              'FOUX-V1 FO-4 owner accepted; FO-5 structured contact implementation authorized'
          )
          stream = state['streams']['followup_orchestration_ux_v1']
          stream['plan_version'] = '1.6.0'
          stream['current_tranche'] = 'FO_5_AUTHORIZED_IMPLEMENTATION_PENDING'
          stream['status'] = (
              'FO_0_VALIDATED_FO_1_VALIDATED_FO_2_VALIDATED_FO_3_OWNER_ACCEPTED_'
              'FO_4_OWNER_ACCEPTED_FO_5_AUTHORIZED_NOT_STARTED_FO_6_AND_LATER_BLOCKED'
          )
          progress = stream['roadmap_progress']
          progress.update({
              'validated_equivalent': 5.0,
              'progress_percent': 45.5,
              'remaining_percent': 54.5,
              'fully_accepted_tranches': 5,
              'current_partial_tranche': None,
              'current_partial_credit': 0.0,
              'next_required_gate': 'FO5_TECHNICAL_IMPLEMENTATION',
          })
          stream['future_tranches']['FO-5'] = 'AUTHORIZED_NOT_STARTED'
          fo4 = stream['fo4_evidence']
          fo4.update({
              'owner_acceptance_issue': 94,
              'local_ux_acceptance': True,
              'reviewer': 'Emad211',
              'reviewed_commit': runtime_commit,
              'reviewed_on_test_data': True,
              'critical_ux_defects': 0,
              'owner_notes': 'بررسی شد و مشکل بحرانی مشاهده نشد',
              'status': 'VALIDATED_WITH_OWNER_ACCEPTANCE',
          })
          stream['fo5_authorization'] = {
              'tracking_issue': 103,
              'governance_pr': 104,
              'scope': 'STRUCTURED_CONTACT_RETRY_ESCALATION_ONLY',
              'feature_flag': 'FOLLOWUP_STRUCTURED_CONTACT',
              'default_enabled': False,
              'status': 'AUTHORIZED',
          }
          stream['fo5_allowed'] = True
          stream['fo6_allowed'] = False
          stream['next_gate'] = 'FO5_IMPLEMENTATION_ISSUE_AND_PR'
          if 'FO4_OWNER_ACCEPTED_BEFORE_FO5_AUTHORIZATION' not in stream['invariants']:
              stream['invariants'].extend([
                  'FO4_OWNER_ACCEPTED_BEFORE_FO5_AUTHORIZATION',
                  'FO5_STRUCTURED_OUTCOMES_DO_NOT_MAKE_CLINICAL_DECISIONS',
                  'FO5_DOES_NOT_SEND_SMS_OR_MUTATE_APPOINTMENTS',
                  'FO5_CALLBACK_RETRY_ESCALATION_IS_APPEND_ONLY_AND_IDEMPOTENT',
              ])
          state['global_freeze']['followup_orchestration_fo4'] = 'VALIDATED_WITH_OWNER_ACCEPTANCE'
          state['global_freeze']['followup_orchestration_fo5'] = (
              'AUTHORIZED_IMPLEMENTATION_ONLY_UNDER_ISSUE_103_AND_SEPARATE_IMPLEMENTATION_PR'
          )
          state['global_freeze']['followup_orchestration_fo6_and_later'] = (
              'BLOCKED_PENDING_FO5_TECHNICAL_VALIDATION_OWNER_ACCEPTANCE_AND_SEPARATE_GOVERNANCE'
          )
          state['next_phases'] = [
              'FO_5_STRUCTURED_CONTACT_RETRY_ESCALATION_IMPLEMENTATION',
              'FO_5_LOCAL_OWNER_UX_ACCEPTANCE',
              'R0_GOVERNANCE_RECONCILIATION',
              'R1_RELEASE_BASELINE_FROM_CURRENT_MAIN',
              'R2_BOUNDED_CLINICAL_CONTENT_FORMALIZATION',
          ]
          ops = state['operational_programs']
          for value in (
              'FOUX_V1_FO_4_VALIDATED_WITH_OWNER_ACCEPTANCE',
              'FOUX_V1_FO_5_AUTHORIZED_NOT_STARTED',
              'FOUX_V1_FO_6_AND_LATER_BLOCKED',
          ):
              if value not in ops:
                  ops.append(value)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Canonical plan: retain history, advance current gate.
          plan_path = root / 'specialist_clinic/docs/FOLLOWUP_ORCHESTRATION_UX_V1_IMPLEMENTATION_PLAN.md'
          plan = plan_path.read_text(encoding='utf-8')
          plan = plan.replace('**نسخه:** `1.5.2`', '**نسخه:** `1.6.0`')
          plan = plan.replace(
              '`FO_0_VALIDATED / FO_1_VALIDATED / FO_2_VALIDATED / FO_3_VALIDATED_WITH_OWNER_ACCEPTANCE / FO_4_TECHNICALLY_VALIDATED_LOCAL_UX_ACCEPTANCE_PENDING / FO_5_AND_LATER_BLOCKED`',
              '`FO_0_VALIDATED / FO_1_VALIDATED / FO_2_VALIDATED / FO_3_VALIDATED_WITH_OWNER_ACCEPTANCE / FO_4_VALIDATED_WITH_OWNER_ACCEPTANCE / FO_5_AUTHORIZED_IMPLEMENTATION_PENDING / FO_6_AND_LATER_BLOCKED`',
          )
          authorization = '''## FO-4 Owner Acceptance and FO-5 Authorization\n\nFO-4 owner acceptance در Issue #94 ثبت شد:\n\n```text\nFO4_UX_ACCEPTED = true\nreviewer = Emad211\nreviewed_commit = cd243424ecbae98892e0dfde1780bb846554942f\nreviewed_on_test_data = true\ncritical_ux_defects = 0\nnotes = بررسی شد و مشکل بحرانی مشاهده نشد\n```\n\nFO-5 با Issue #103 و PR حاکمیتی #104 فقط برای دامنهٔ زیر مجاز است:\n\n- structured contact outcomes؛\n- callback scheduling؛\n- bounded retry/attempt policy؛\n- unreachable escalation؛\n- phone-invalid workflow؛\n- Unified contact UX؛\n- append-only/idempotent audit؛\n- feature flag `FOLLOWUP_STRUCTURED_CONTACT` با پیش‌فرض OFF.\n\nSMS automation، Appointment mutation، Clinical completion/decision، Outbox و FO-6+ همچنان ممنوع‌اند.\n\n---\n\n'''
          if '## FO-4 Owner Acceptance and FO-5 Authorization' not in plan:
              plan = plan.replace('## 10. Roadmap authority and measured progress', authorization + '## 10. Roadmap authority and measured progress')
          plan = plan.replace(
              'Progress                                 = 4.8 / 11 = 43.6%\nRemaining                                = 56.4%',
              'Progress                                 = 5.0 / 11 = 45.5%\nRemaining                                = 54.5%',
          )
          plan = plan.replace(
              'نقطهٔ ادامه همچنان Issue #94 و owner acceptance روی runtime commit `cd243424ecbae98892e0dfde1780bb846554942f` است.',
              'نقطهٔ ادامه Issue #103 و پیاده‌سازی FO-5 در یک Issue/PR مستقل است.',
          )
          plan = plan.replace(
              'FO-4 = TECHNICALLY VALIDATED / LOCAL UX ACCEPTANCE PENDING\nFO-5 AND LATER = BLOCKED',
              'FO-4 = VALIDATED WITH OWNER ACCEPTANCE\nFO-5 = AUTHORIZED / IMPLEMENTATION PENDING\nFO-6 AND LATER = BLOCKED',
          )
          plan_path.write_text(plan, encoding='utf-8')

          # Complete roadmap: advance statuses and gate without erasing future scope.
          roadmap_path = root / 'specialist_clinic/docs/FOLLOWUP_ORCHESTRATION_UX_V1_ROADMAP.md'
          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap = roadmap.replace('**Current gate:** `FO-4 Local Owner UX Acceptance — Issue #94`', '**Current gate:** `FO-5 Structured Contact implementation — Issue #103`')
          roadmap = roadmap.replace('FO-4 = 0.8\nFO-5..FO-10 = 0.0', 'FO-4 = 1.0\nFO-5..FO-10 = 0.0')
          roadmap = roadmap.replace('Total = 4.8 / 11 = 43.6%', 'Total = 5.0 / 11 = 45.5%')
          roadmap = roadmap.replace('**پیشرفت رسمی roadmap gate:** `43.6%`، گرد شده `44%`', '**پیشرفت رسمی roadmap gate:** `45.5%`، گرد شده `46%`')
          roadmap = roadmap.replace('**کار باقی‌مانده:** `6.2 tranche-equivalent = 56.4%`', '**کار باقی‌مانده:** `6.0 tranche-equivalent = 54.5%`')
          roadmap = roadmap.replace('`TECHNICALLY_VALIDATED / OWNER_UX_PENDING` | `FOLLOWUP_AUTO_ROUTING`', '`VALIDATED_WITH_OWNER_ACCEPTANCE` | `FOLLOWUP_AUTO_ROUTING`')
          roadmap = roadmap.replace('`BLOCKED_NOT_STARTED` | `FOLLOWUP_STRUCTURED_CONTACT`', '`AUTHORIZED_NOT_STARTED` | `FOLLOWUP_STRUCTURED_CONTACT`', 1)
          roadmap = roadmap.replace('**Result:** technically validated; local owner acceptance pending.', '**Result:** validated with owner acceptance; FO-5 dependency satisfied.')
          roadmap = roadmap.replace('CURRENT = FO-4 Local Owner UX Acceptance\nISSUE   = #94\nTHEN    = separate governance decision whether FO-5 may start', 'CURRENT = FO-5 Structured Contact implementation\nISSUE   = #103\nTHEN    = FO-5 technical validation and local owner UX acceptance')
          roadmap_path.write_text(roadmap, encoding='utf-8')

          # Nearest agent guard.
          agent_path = root / 'specialist_clinic/AGENTS.md'
          agent = agent_path.read_text(encoding='utf-8')
          agent = agent.replace('FO-4 = TECHNICALLY VALIDATED\nFO-4 LOCAL UX ACCEPTANCE = PENDING\nFO-5 and later = BLOCKED\nCURRENT ISSUE = #94', 'FO-4 = VALIDATED WITH OWNER ACCEPTANCE\nFO-5 = AUTHORIZED / IMPLEMENTATION PENDING\nFO-6 and later = BLOCKED\nCURRENT ISSUE = #103')
          agent = agent.replace('Canonical plan: `v1.5.2`.', 'Canonical plan: `v1.6.0`.')
          agent = agent.replace('ROADMAP PROGRESS = 4.8 / 11 = 43.6%', 'ROADMAP PROGRESS = 5.0 / 11 = 45.5%')
          allowed_marker = '## دامنهٔ مجاز فعلی\n\nفقط:\n'
          allowed = '''\n- طراحی و پیاده‌سازی FO-5 تحت Issue #103 و PR مستقل؛\n- structured outcomes، callback، bounded retry و escalation؛\n- Unified contact form و timeline؛\n- تست‌های idempotency، stale/terminal/permission و flag OFF؛\n'''
          if 'طراحی و پیاده‌سازی FO-5 تحت Issue #103' not in agent:
              agent = agent.replace(allowed_marker, allowed_marker + allowed)
          agent = agent.replace('- شروع FO-5؛\n', '')
          agent = agent.replace('بدون `FO4_UX_ACCEPTED=true`، `critical_ux_defects=0` و governance مستقل وارد FO-5 نشوید.', 'FO-5 فقط تحت Issue #103 مجاز است؛ بدون FO-5 validation و owner acceptance وارد FO-6 نشوید.')
          agent_path.write_text(agent, encoding='utf-8')

          # Human-readable project state: append authoritative gate section.
          md_path = root / 'PROJECT_STATE.md'
          md = md_path.read_text(encoding='utf-8')
          md = md.replace('Version 1.5.2', 'Version 1.6.0')
          md = md.replace('Gate progress = 4.8 / 11 = 43.6% (~44%)\nRemaining = 56.4%', 'Gate progress = 5.0 / 11 = 45.5% (~46%)\nRemaining = 54.5%')
          section = '''\n## FO-4 Owner Acceptance / FO-5 Authorization\n\n```text\nFO4_UX_ACCEPTED = true\nreviewer = Emad211\nreviewed_commit = cd243424ecbae98892e0dfde1780bb846554942f\nreviewed_on_test_data = true\ncritical_ux_defects = 0\nnotes = بررسی شد و مشکل بحرانی مشاهده نشد\n```\n\n```text\nFO-5 authorization issue = #103\nFO-5 scope = Structured Contact, Retry & Escalation only\nFOLLOWUP_STRUCTURED_CONTACT default = OFF\nFO-6 and later = BLOCKED\n```\n\n---\n'''
          if '## FO-4 Owner Acceptance / FO-5 Authorization' not in md:
              md += section
          md_path.write_text(md, encoding='utf-8')

          # Focused governance test.
          test_path = root / 'specialist_clinic/tests/test_followup_orchestration_fo5_authorization.py'
          test_path.write_text('''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\nSPECIALIST = ROOT / "specialist_clinic"\n\n\ndef test_fo4_owner_acceptance_and_fo5_authorization_are_consistent():\n    state = json.loads((ROOT / "PROJECT_STATE.json").read_text(encoding="utf-8"))\n    stream = state["streams"]["followup_orchestration_ux_v1"]\n    assert stream["plan_version"] == "1.6.0"\n    assert stream["current_tranche"] == "FO_5_AUTHORIZED_IMPLEMENTATION_PENDING"\n    assert stream["fo4_evidence"]["local_ux_acceptance"] is True\n    assert stream["fo4_evidence"]["critical_ux_defects"] == 0\n    assert stream["fo4_evidence"]["reviewed_commit"] == "cd243424ecbae98892e0dfde1780bb846554942f"\n    assert stream["fo5_authorization"]["tracking_issue"] == 103\n    assert stream["fo5_authorization"]["scope"] == "STRUCTURED_CONTACT_RETRY_ESCALATION_ONLY"\n    assert stream["fo5_authorization"]["default_enabled"] is False\n    assert stream["fo5_allowed"] is True\n    assert stream["fo6_allowed"] is False\n    assert stream["feature_flags"]["FOLLOWUP_STRUCTURED_CONTACT"] is False\n    progress = stream["roadmap_progress"]\n    assert progress["validated_equivalent"] == 5.0\n    assert progress["progress_percent"] == 45.5\n    assert progress["remaining_percent"] == 54.5\n\n\ndef test_docs_keep_fo5_bounded_and_fo6_blocked():\n    plan = (SPECIALIST / "docs" / "FOLLOWUP_ORCHESTRATION_UX_V1_IMPLEMENTATION_PLAN.md").read_text(encoding="utf-8")\n    roadmap = (SPECIALIST / "docs" / "FOLLOWUP_ORCHESTRATION_UX_V1_ROADMAP.md").read_text(encoding="utf-8")\n    agent = (SPECIALIST / "AGENTS.md").read_text(encoding="utf-8")\n    assert "FO-5_AUTHORIZED_IMPLEMENTATION_PENDING" in plan\n    assert "FO-5 Structured Contact implementation" in roadmap\n    assert "AUTHORIZED_NOT_STARTED" in roadmap\n    assert "FO-5 = AUTHORIZED / IMPLEMENTATION PENDING" in agent\n    assert "FO-6 and later = BLOCKED" in agent\n    assert "FOLLOWUP_STRUCTURED_CONTACT" in plan\n    assert "SMS automation" in plan\n''', encoding='utf-8')
          PY
      - name: Commit governance authorization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_fo5_authorize.yml
          git add PROJECT_STATE.json PROJECT_STATE.md specialist_clinic/AGENTS.md \
            specialist_clinic/docs/FOLLOWUP_ORCHESTRATION_UX_V1_IMPLEMENTATION_PLAN.md \
            specialist_clinic/docs/FOLLOWUP_ORCHESTRATION_UX_V1_ROADMAP.md \
            specialist_clinic/tests/test_followup_orchestration_fo5_authorization.py
          git commit -m "docs(foux): authorize bounded FO-5 implementation"
          git push origin HEAD:docs/foux-v1-fo5-authorization
