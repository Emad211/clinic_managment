name: Temporary FO-4 ownership patch

on:
  push:
    branches:
      - feature/foux-v1-fo4-ownership

permissions:
  contents: write

jobs:
  patch-ownership:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foux-v1-fo4-ownership
          fetch-depth: 0
      - name: Apply transaction and idempotent replay corrections
        shell: python
        run: |
          from pathlib import Path

          path = Path("specialist_clinic/src/services/followup_orchestration/ownership_service.py")
          text = path.read_text(encoding="utf-8")

          old = '''    def _existing_replay(\n        self,\n        *,\n        episode_id: str,\n        event_type: str,\n        idempotency_key: str,\n        payload: dict,\n    ) -> OwnershipState | None:\n        row = self.db.execute(\n            """SELECT episode_id, event_type, payload_json\n               FROM followup_episode_events WHERE idempotency_key=?""",\n            (str(idempotency_key),),\n        ).fetchone()\n        if not row:\n            return None\n        if (\n            str(row["episode_id"]) != str(episode_id)\n            or str(row["event_type"]) != str(event_type)\n            or canonical_json(_payload(row)) != canonical_json(payload)\n        ):\n            raise FollowupOwnershipError(\n                "OWNERSHIP_IDEMPOTENCY_CONFLICT",\n                "شناسهٔ تکرار قبلاً برای اقدام دیگری استفاده شده است.",\n            )\n        return self.state(episode_id)\n'''
          new = '''    def _existing_replay(\n        self,\n        *,\n        episode_id: str,\n        event_type: str,\n        idempotency_key: str,\n        payload: dict | None = None,\n        request_fields: dict | None = None,\n    ) -> OwnershipState | None:\n        row = self.db.execute(\n            """SELECT episode_id, event_type, payload_json\n               FROM followup_episode_events WHERE idempotency_key=?""",\n            (str(idempotency_key),),\n        ).fetchone()\n        if not row:\n            return None\n        existing = _payload(row)\n        mismatch = (\n            str(row["episode_id"]) != str(episode_id)\n            or str(row["event_type"]) != str(event_type)\n        )\n        if payload is not None:\n            mismatch = mismatch or canonical_json(existing) != canonical_json(payload)\n        if request_fields is not None:\n            mismatch = mismatch or any(\n                existing.get(key) != value for key, value in request_fields.items()\n            )\n        if mismatch:\n            raise FollowupOwnershipError(\n                "OWNERSHIP_IDEMPOTENCY_CONFLICT",\n                "شناسهٔ تکرار قبلاً برای اقدام دیگری استفاده شده است.",\n            )\n        return self.state(episode_id)\n'''
          if old not in text:
              raise SystemExit("existing replay block not found")
          text = text.replace(old, new)

          old = '''        expected = _normalize_expected(expected_event_id)\n        try:\n            self.db.execute("BEGIN IMMEDIATE")\n'''
          new = '''        expected = _normalize_expected(expected_event_id)\n        repository = FollowupEpisodeRepository(self.db)\n        try:\n            self.db.execute("BEGIN IMMEDIATE")\n'''
          if old not in text:
              raise SystemExit("transaction block not found")
          text = text.replace(old, new)
          text = text.replace(
              '            FollowupEpisodeRepository(self.db).append_event_once(\n',
              '            repository.append_event_once(\n',
          )

          old = '''        current = self.state(episode_id)\n        if not current.owner_role:\n'''
          new = '''        current = self.state(episode_id)\n        key = str(idempotency_key or "").strip()\n        replay = self._existing_replay(\n            episode_id=episode_id,\n            event_type="CLAIMED",\n            idempotency_key=key,\n            request_fields={"action": "CLAIM", "owner_user_id": int(actor["id"])},\n        )\n        if replay:\n            return replay\n        if not current.owner_role:\n'''
          if old not in text:
              raise SystemExit("claim block not found")
          text = text.replace(old, new, 1)

          old = '''        current = self.state(episode_id)\n        if current.owner_user_id is None:\n'''
          new = '''        current = self.state(episode_id)\n        key = str(idempotency_key or "").strip()\n        replay = self._existing_replay(\n            episode_id=episode_id,\n            event_type="ASSIGNED",\n            idempotency_key=key,\n            request_fields={"action": "RELEASE"},\n        )\n        if replay:\n            return replay\n        if current.owner_user_id is None:\n'''
          if old not in text:
              raise SystemExit("release block not found")
          text = text.replace(old, new, 1)

          old = '''        self._require_admin(actor)\n        role = _normalize_role(owner_role)\n        current = self.state(episode_id)\n        payload = {\n            "action": "ROUTE",\n'''
          new = '''        self._require_admin(actor)\n        role = _normalize_role(owner_role)\n        key = str(idempotency_key or "").strip()\n        replay = self._existing_replay(\n            episode_id=episode_id,\n            event_type="ROUTED",\n            idempotency_key=key,\n            request_fields={"action": "ROUTE", "owner_role": role},\n        )\n        if replay:\n            return replay\n        current = self.state(episode_id)\n        payload = {\n            "action": "ROUTE",\n'''
          if old not in text:
              raise SystemExit("route block not found")
          text = text.replace(old, new, 1)

          old = '''        self._require_admin(actor)\n        current = self.state(episode_id)\n        if not current.owner_role:\n'''
          new = '''        self._require_admin(actor)\n        target_id = int(owner_user_id)\n        key = str(idempotency_key or "").strip()\n        replay = self._existing_replay(\n            episode_id=episode_id,\n            event_type="ASSIGNED",\n            idempotency_key=key,\n            request_fields={"owner_user_id": target_id},\n        )\n        if replay:\n            return replay\n        current = self.state(episode_id)\n        if not current.owner_role:\n'''
          if old not in text:
              raise SystemExit("assign block not found")
          text = text.replace(old, new, 1)
          text = text.replace('        target = self._user(int(owner_user_id))\n', '        target = self._user(target_id)\n', 1)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/temp_patch_fo4_ownership.yml").unlink()
      - name: Commit corrections and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specialist_clinic/src/services/followup_orchestration/ownership_service.py .github/workflows/temp_patch_fo4_ownership.yml
          git commit -m "fix(fo4): preserve atomicity and exact replay semantics"
          git push origin HEAD:feature/foux-v1-fo4-ownership
