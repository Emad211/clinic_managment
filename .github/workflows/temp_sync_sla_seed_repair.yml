name: Temporary SLA branch sync with seed repair

on:
  push:
    branches:
      - fix/foux-sla-filter-vocabulary

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foux-sla-filter-vocabulary
          fetch-depth: 0
      - name: Merge current seed repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/foux-seed-unified-worklist
          git merge --no-edit origin/fix/foux-seed-unified-worklist
          rm .github/workflows/temp_sync_sla_seed_repair.yml
          git add -u
          git commit -m "chore: remove temporary SLA sync workflow"
          git push origin HEAD:fix/foux-sla-filter-vocabulary
