name: Temporary complete FOUX roadmap

on:
  push:
    branches:
      - docs/foux-v1-fo4-seed-sla-attestation
    paths:
      - .github/workflows/temp_complete_foux_roadmap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/foux-v1-fo4-seed-sla-attestation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize roadmap authority
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          roadmap_rel = 'specialist_clinic/docs/FOLLOWUP_ORCHESTRATION_UX_V1_ROADMAP.md'

          plan_path = root / 'specialist_clinic/docs/FOLLOWUP_ORCHESTRATION_UX_V1_IMPLEMENTATION_PLAN.md'
          plan = plan_path.read_text(encoding='utf-8')
          plan = plan.replace('**نسخه:** `1.5.2`', '**نسخه:** `1.5.3`')
          authority = (
              '> **رودمپ کامل:** `specialist_clinic/docs/FOLLOWUP_ORCHESTRATION_UX_V1_ROADMAP.md`\n>\n'
          )
          marker = '> **محیط:** `TEST_ONLY / SYNTHETIC_OR_RESETTABLE_DATA`\n'
          if authority not in plan:
              plan = plan.replace(marker, marker + '>\n' + authority)
          progress_section = '''## 10. Roadmap authority and measured progress

رودمپ کامل FO-0 تا FO-10 در فایل زیر نگهداری می‌شود:

```text
specialist_clinic/docs/FOLLOWUP_ORCHESTRATION_UX_V1_ROADMAP.md
```

مدل رسمی tranche-equivalent:

```text
FO-0..FO-3 validated                     = 4.0
FO-4 technically validated / UX pending = 0.8
FO-5..FO-10 blocked/not started          = 0.0
Progress                                 = 4.8 / 11 = 43.6%
Remaining                                = 56.4%
```

این درصد فقط FOUX-V1 است و production-readiness کل Specialist Clinic نیست. نقطهٔ ادامه همچنان Issue #94 و owner acceptance روی runtime commit `cd243424ecbae98892e0dfde1780bb846554942f` است. حضور FO-5 تا FO-10 در رودمپ به‌معنی authorization نیست.

---

'''
          if '## 10. Roadmap authority and measured progress' not in plan:
              plan = plan.replace('## 10. تصمیم فعلی', progress_section + '## 11. تصمیم فعلی')
          plan_path.write_text(plan, encoding='utf-8')

          agent_path = root / 'specialist_clinic/AGENTS.md'
          agent = agent_path.read_text(encoding='utf-8')
          agent = agent.replace('Canonical plan: `v1.5.2`.', 'Canonical plan: `v1.5.3`.')
          agent_marker = 'Canonical plan: `v1.5.3`.\n'
          agent_roadmap = 'Complete roadmap: `docs/FOLLOWUP_ORCHESTRATION_UX_V1_ROADMAP.md`.\n'
          if agent_roadmap not in agent:
              agent = agent.replace(agent_marker, agent_marker + agent_roadmap)
          agent_path.write_text(agent, encoding='utf-8')

          state_md_path = root / 'PROJECT_STATE.md'
          state_md = state_md_path.read_text(encoding='utf-8')
          state_md = state_md.replace('Version 1.5.2', 'Version 1.5.3')
          state_marker = '''specialist_clinic/docs/FOLLOWUP_ORCHESTRATION_UX_V1_IMPLEMENTATION_PLAN.md
Version 1.5.3
```
'''
          state_progress = '''
Complete roadmap:

```text
specialist_clinic/docs/FOLLOWUP_ORCHESTRATION_UX_V1_ROADMAP.md
FO-0 through FO-10
Gate progress = 4.8 / 11 = 43.6% (~44%)
Remaining = 56.4%
```

این درصد فقط roadmap برنامهٔ FOUX-V1 است. FO-5 تا FO-10 تعریف شده‌اند ولی تا owner acceptance و governance مستقل مجاز نیستند.
'''
          if 'Gate progress = 4.8 / 11 = 43.6%' not in state_md:
              state_md = state_md.replace(state_marker, state_marker + state_progress)
          state_md_path.write_text(state_md, encoding='utf-8')

          state_json_path = root / 'PROJECT_STATE.json'
          state = json.loads(state_json_path.read_text(encoding='utf-8'))
          state['schema_version'] = '2.3'
          state['audited_at'] = '2026-08-04T01:20:00+03:30'
          stream = state['streams']['followup_orchestration_ux_v1']
          stream['plan_version'] = '1.5.3'
          stream['canonical_roadmap'] = roadmap_rel
          stream['roadmap_progress'] = {
              'model': 'TRANCHE_EQUIVALENT',
              'tranche_count': 11,
              'validated_equivalent': 4.8,
              'progress_percent': 43.6,
              'remaining_percent': 56.4,
              'technical_tranches_implemented': 5,
              'fully_accepted_tranches': 4,
              'current_partial_tranche': 'FO-4',
              'current_partial_credit': 0.8,
              'next_required_gate': 'FO4_OWNER_UX_ACCEPTANCE',
              'not_a_product_wide_readiness_metric': True,
          }
          stream['future_tranches'] = {
              'FO-5': 'STRUCTURED_CONTACT_RETRY_ESCALATION_BLOCKED',
              'FO-6': 'GOVERNED_SMS_AUTOMATION_BLOCKED',
              'FO-7': 'CROSS_CHANNEL_OUTBOX_BLOCKED',
              'FO-8': 'CLINICAL_EVIDENCE_ASSIST_BLOCKED',
              'FO-9': 'AUTOMATION_HEALTH_BLOCKED',
              'FO-10': 'CONTROLLED_PILOT_CUTOVER_BLOCKED',
          }
          state_json_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          test_path = root / 'specialist_clinic/tests/test_followup_orchestration_fo0.py'
          test = test_path.read_text(encoding='utf-8')
          const_marker = 'PLAN_PATH = SPECIALIST_ROOT / "docs" / "FOLLOWUP_ORCHESTRATION_UX_V1_IMPLEMENTATION_PLAN.md"\n'
          roadmap_const = 'ROADMAP_PATH = SPECIALIST_ROOT / "docs" / "FOLLOWUP_ORCHESTRATION_UX_V1_ROADMAP.md"\n'
          if roadmap_const not in test:
              test = test.replace(const_marker, const_marker + roadmap_const)
          test = test.replace('assert stream["plan_version"] == "1.5.2"', 'assert stream["plan_version"] == "1.5.3"')
          state_assert_marker = 'assert stream["current_tranche"] == "FO_4_LOCAL_OWNER_UX_ACCEPTANCE"\n'
          state_assertions = '''    assert stream["canonical_roadmap"] == (
        "specialist_clinic/docs/FOLLOWUP_ORCHESTRATION_UX_V1_ROADMAP.md"
    )
    progress = stream["roadmap_progress"]
    assert progress["tranche_count"] == 11
    assert progress["validated_equivalent"] == 4.8
    assert progress["progress_percent"] == 43.6
    assert progress["remaining_percent"] == 56.4
    assert progress["next_required_gate"] == "FO4_OWNER_UX_ACCEPTANCE"
    assert progress["not_a_product_wide_readiness_metric"] is True
    assert list(stream["future_tranches"]) == [
        "FO-5", "FO-6", "FO-7", "FO-8", "FO-9", "FO-10"
    ]
'''
          if 'progress = stream["roadmap_progress"]' not in test:
              test = test.replace(state_assert_marker, state_assert_marker + state_assertions)
          test = test.replace(
              '    baseline = BASELINE_PATH.read_text(encoding="utf-8")\n    agent =',
              '    baseline = BASELINE_PATH.read_text(encoding="utf-8")\n    roadmap = ROADMAP_PATH.read_text(encoding="utf-8")\n    agent =',
          )
          test = test.replace('assert "نسخه:** `1.5.2`" in plan', 'assert "نسخه:** `1.5.3`" in plan')
          roadmap_assert_marker = '    assert "FO_4_TECHNICALLY_VALIDATED_LOCAL_UX_ACCEPTANCE_PENDING" in plan\n'
          roadmap_assertions = '''    assert "FOLLOWUP_ORCHESTRATION_UX_V1_ROADMAP.md" in plan
    assert "FO-5 — Structured Contact, Retry & Escalation" in roadmap
    assert "FO-6 — Governed SMS Automation & Freshness" in roadmap
    assert "FO-7 — Cross-channel Transitions & Operational Outbox" in roadmap
    assert "FO-8 — Clinical Evidence Assist" in roadmap
    assert "FO-9 — Automation Health & Operational Control" in roadmap
    assert "FO-10 — Controlled Pilot, KPI Proof, Cutover & Legacy Retirement" in roadmap
    assert "4.8 / 11 = 43.6%" in roadmap
    assert "CURRENT = FO-4 Local Owner UX Acceptance" in roadmap
'''
          if 'assert "FO-10 — Controlled Pilot' not in test:
              test = test.replace(roadmap_assert_marker, roadmap_assert_marker + roadmap_assertions)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_complete_foux_roadmap.yml
          git add PROJECT_STATE.json PROJECT_STATE.md specialist_clinic/AGENTS.md \
            specialist_clinic/docs/FOLLOWUP_ORCHESTRATION_UX_V1_IMPLEMENTATION_PLAN.md \
            specialist_clinic/tests/test_followup_orchestration_fo0.py
          git commit -m "docs(foux): synchronize complete roadmap and progress"
          git push origin HEAD:docs/foux-v1-fo4-seed-sla-attestation
