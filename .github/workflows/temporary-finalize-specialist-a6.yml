name: Temporary Finalize Specialist A6

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: temporary-finalize-specialist-a6
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/specialist-campaign-economics-a6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/specialist-campaign-economics-a6
          fetch-depth: 0

      - name: Capture exact branch lease
        shell: bash
        run: |
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt

      - name: Apply A6 core integration
        run: python .github/finalize_a6_core.py
      - name: Apply A6 trust guards
        run: python .github/finalize_a6_guards.py
      - name: Apply A6 atomic preparation
        run: python .github/finalize_a6_atomic_prepare.py
      - name: Apply A6 execution integration
        run: python .github/finalize_a6_execution.py
      - name: Apply A6 wallet review lifecycle
        run: python .github/finalize_a6_wallet_review.py
      - name: Apply A6 stale attribution guard
        run: python .github/finalize_a6_attribution_guard.py
      - name: Apply A6 routes and Journey linkage
        run: python .github/finalize_a6_routes.py
      - name: Apply A6 direct cost settings
        run: python .github/finalize_a6_settings.py
      - name: Apply A6 economics visibility
        run: python .github/finalize_a6_visibility.py
      - name: Apply A6 regression contracts
        run: python .github/finalize_a6_regressions.py
      - name: Apply A6 first failure fixes
        run: python .github/finalize_a6_failures.py

      - name: Verify deterministic integration and accounting boundary
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/finalize_a6_core.py \
            .github/finalize_a6_guards.py \
            .github/finalize_a6_atomic_prepare.py \
            .github/finalize_a6_execution.py \
            .github/finalize_a6_wallet_review.py \
            .github/finalize_a6_attribution_guard.py \
            .github/finalize_a6_routes.py \
            .github/finalize_a6_settings.py \
            .github/finalize_a6_visibility.py \
            .github/finalize_a6_regressions.py \
            .github/finalize_a6_failures.py; do
              test ! -e "$file"
          done
          git diff --check
          git diff --quiet origin/main -- webapp

      - name: Compile specialist application
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m compileall -q specialist_clinic/src specialist_clinic/tests

      - name: Install specialist dependencies
        working-directory: specialist_clinic
        run: python -m pip install -r requirements.txt pytest

      - name: Run A6 and specialist regressions
        working-directory: specialist_clinic
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest -q --tb=short \
            --junitxml="${RUNNER_TEMP}/pytest-specialist-a6.xml" \
            tests/test_campaign_economics_a6.py \
            tests/test_sms_governance_a5.py \
            tests/test_sms_delivery_lifecycle.py \
            tests/test_specialist_attendance_collection.py \
            tests/test_specialist_revenue_boundary.py \
            tests/test_visit_invites.py \
            tests/test_invoice_outreach.py \
            tests/test_invoice_outreach_retry.py \
            tests/test_approval_quiet_hours.py \
            tests/test_end_to_end_loops.py \
            tests/test_operational_security_hardening.py \
            tests/test_clinical_alert_lifecycle.py \
            tests/test_clinician_decision_task_gate.py \
            tests/test_clinical_task_contracts.py \
            tests/test_clinical_closed_care_loop.py \
            tests/test_followup_unified_state.py \
            tests/test_clinical_validation_release_gate.py

      - name: Verify zero accounting mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet origin/main -- webapp
          git diff --check
          if find webapp -type f \( -name '*.db-wal' -o -name '*.db-shm' \) -print -quit | grep -q .; then
            echo 'unexpected accounting sidecar generated' >&2
            exit 1
          fi

      - name: Commit exact tested A6 tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'close explicit campaign economics and ROI lineage'
          git push \
            --force-with-lease=refs/heads/agent/specialist-campaign-economics-a6:${START_SHA} \
            origin HEAD:refs/heads/agent/specialist-campaign-economics-a6

      - name: Upload A6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-a6-release-evidence
          path: ${{ runner.temp }}/pytest-specialist-a6.xml
          if-no-files-found: ignore
