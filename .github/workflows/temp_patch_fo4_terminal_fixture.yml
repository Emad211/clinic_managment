name: Temporary FO-4 terminal fixture patch

on:
  push:
    branches:
      - feature/foux-v1-fo4-ownership

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foux-v1-fo4-ownership
          fetch-depth: 0
      - name: Make terminal fixture contract-complete
        shell: python
        run: |
          from pathlib import Path

          path = Path("specialist_clinic/tests/test_followup_orchestration_fo4.py")
          text = path.read_text(encoding="utf-8")
          old = '''    db.execute(\n        "UPDATE followup_work_item_projection SET state_class='TERMINAL' WHERE episode_id=?",\n        (episode_id,),\n    )\n'''
          new = '''    db.execute(\n        """UPDATE followup_work_item_projection\n           SET state_class='TERMINAL',\n               next_action_code=NULL, next_action_label=NULL,\n               waiting_reason_code=NULL, waiting_reason_label=NULL,\n               blocked_reason_code=NULL, blocked_reason_label=NULL,\n               owner_role_proposal=NULL\n           WHERE episode_id=?""",\n        (episode_id,),\n    )\n'''
          if old not in text:
              raise SystemExit("terminal fixture block not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/temp_patch_fo4_terminal_fixture.yml").unlink()
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specialist_clinic/tests/test_followup_orchestration_fo4.py .github/workflows/temp_patch_fo4_terminal_fixture.yml
          git commit -m "test(fo4): make terminal fixture contract-complete"
          git push origin HEAD:feature/foux-v1-fo4-ownership
