name: Temporary Finalize Specialist A5

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: temporary-finalize-specialist-a5
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/specialist-messaging-governance-a5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/specialist-messaging-governance-a5
          fetch-depth: 0

      - name: Capture exact branch lease
        shell: bash
        run: |
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt

      - name: Normalize A5 engagement integration
        run: python .github/finalize_a5_prepare.py

      - name: Apply A5 core integration
        shell: bash
        run: |
          set -o pipefail
          python .github/finalize_a5_core.py 2>"${RUNNER_TEMP}/a5-core-error.log"

      - name: Apply A5 routes integration
        run: python .github/finalize_a5_routes.py

      - name: Apply A5 UX integration
        run: python .github/finalize_a5_ui.py

      - name: Apply A5 regression integration
        run: python .github/finalize_a5_regression.py

      - name: Apply A5 enrollment integration
        run: python .github/finalize_a5_enrollment.py

      - name: Apply A5 test contracts
        run: python .github/finalize_a5_test_contracts.py

      - name: Isolate A5 application accounting configuration
        run: python .github/finalize_a5_accounting_path.py

      - name: Migrate A5 accounting test fixtures
        run: python .github/finalize_a5_fixture_paths.py

      - name: Verify deterministic integration and accounting boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/finalize_a5_prepare.py
          test ! -e .github/finalize_a5_core.py
          test ! -e .github/finalize_a5_routes.py
          test ! -e .github/finalize_a5_ui.py
          test ! -e .github/finalize_a5_regression.py
          test ! -e .github/finalize_a5_enrollment.py
          test ! -e .github/finalize_a5_test_contracts.py
          test ! -e .github/finalize_a5_accounting_path.py
          test ! -e .github/finalize_a5_fixture_paths.py
          git diff --check
          git diff --quiet origin/main -- webapp

      - name: Compile specialist application
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m compileall -q specialist_clinic/src specialist_clinic/tests

      - name: Install specialist dependencies
        working-directory: specialist_clinic
        run: python -m pip install -r requirements.txt pytest

      - name: Run A5 and specialist regressions
        working-directory: specialist_clinic
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short \
            --junitxml="${RUNNER_TEMP}/pytest-specialist-a5.xml" \
            tests/test_sms_governance_a5.py \
            tests/test_sms_delivery_lifecycle.py \
            tests/test_invoice_outreach.py \
            tests/test_invoice_outreach_retry.py \
            tests/test_visit_invites.py \
            tests/test_approval_quiet_hours.py \
            tests/test_end_to_end_loops.py \
            tests/test_operational_security_hardening.py \
            tests/test_specialist_attendance_collection.py \
            tests/test_clinical_alert_lifecycle.py \
            tests/test_clinician_decision_task_gate.py \
            tests/test_clinical_task_contracts.py \
            tests/test_followup_unified_state.py \
            tests/test_specialist_revenue_boundary.py \
            2>&1 | tee "${RUNNER_TEMP}/pytest-specialist-a5.log"

      - name: Verify zero accounting mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet origin/main -- webapp
          git diff --check
          if find webapp -type f \( -name '*.db-wal' -o -name '*.db-shm' \) -print -quit | grep -q .; then
            echo 'unexpected accounting sidecar generated' >&2
            exit 1
          fi

      - name: Commit exact tested A5 tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'govern SMS consent and delivery truth'
          git push \
            --force-with-lease=refs/heads/agent/specialist-messaging-governance-a5:${START_SHA} \
            origin HEAD:refs/heads/agent/specialist-messaging-governance-a5

      - name: Upload A5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-a5-release-evidence
          path: |
            ${{ runner.temp }}/pytest-specialist-a5.xml
            ${{ runner.temp }}/pytest-specialist-a5.log
            ${{ runner.temp }}/a5-core-error.log
          if-no-files-found: ignore
