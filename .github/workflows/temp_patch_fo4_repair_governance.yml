name: Temporary FO-4 repair governance state

on:
  push:
    branches:
      - docs/foux-v1-fo4-seed-sla-attestation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/foux-v1-fo4-seed-sla-attestation
          fetch-depth: 0
      - name: Patch JSON state and governance tests
        shell: python
        run: |
          from pathlib import Path
          import json

          state_path = Path("PROJECT_STATE.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state["schema_version"] = "2.2"
          state["audited_at"] = "2026-08-04T00:45:00+03:30"
          state["product_authority"].update(
              {
                  "head": "cd243424ecbae98892e0dfde1780bb846554942f",
                  "head_note": (
                      "FOUX-V1 FO-4 seeded Worklist and effective SLA repairs "
                      "validated; local owner UX acceptance pending"
                  ),
              }
          )
          stream = state["streams"]["followup_orchestration_ux_v1"]
          stream["plan_version"] = "1.5.2"
          stream["next_gate"] = (
              "ISSUE_94_FO4_LOCAL_OWNER_UX_ACCEPTANCE_ON_CD243424"
          )
          fo4 = stream["fo4_evidence"]
          fo4["runtime_ui_review_commit"] = (
              "cd243424ecbae98892e0dfde1780bb846554942f"
          )
          fo4["seeded_worklist_repair"] = {
              "tracking_issue": 97,
              "implementation_pr": 98,
              "final_head": "452b7c6eb89eb0b19da1e0de0167860fff8f6c71",
              "merge_commit": "24119671b8b93fdb20db3064a59d416e02d81ef6",
              "final_ci_run": 30851594179,
              "specialist_tests_passed": 781,
              "accounting_tests_passed": 54,
              "explicit_seed_preparation": True,
              "request_time_rebuild": False,
              "stable_fixture_task_ids": True,
              "manual_test_followups_preserved": True,
              "duplicate_episode_link_event_count": 0,
              "controlled_empty_projection_state": (
                  "PROJECTION_EMPTY_WITH_SOURCE_DATA"
              ),
              "status": "COMPLETED",
          }
          fo4["effective_sla_repair"] = {
              "tracking_issue": 99,
              "implementation_pr": 100,
              "final_head": "3c11ef590581b60a140c27f4924adc4ad9f67c41",
              "merge_commit": "cd243424ecbae98892e0dfde1780bb846554942f",
              "final_ci_run": 30852909213,
              "specialist_tests_passed": 784,
              "accounting_tests_passed": 54,
              "canonical_states": [
                  "FUTURE",
                  "DUE_TODAY",
                  "OVERDUE",
                  "DUE_UNKNOWN",
                  "WAITING",
                  "BLOCKED",
                  "TERMINAL",
              ],
              "request_time_effective_filtering": True,
              "read_time_write": False,
              "status": "COMPLETED",
          }
          contracts = stream["implemented_contracts"]
          contracts["seed_preparation_mode"] = "EXPLICIT_AFTER_SOURCE_COMMIT"
          contracts["seeded_view_recovery_command"] = (
              "scripts/prepare_seeded_followup_view.py"
          )
          contracts["canonical_sla_states"] = [
              "FUTURE",
              "DUE_TODAY",
              "OVERDUE",
              "DUE_UNKNOWN",
              "WAITING",
              "BLOCKED",
              "TERMINAL",
          ]
          contracts["effective_sla_evaluated_at_read_time"] = True
          for invariant in (
              "NO_REQUEST_OR_STARTUP_TIME_BACKFILL_OR_PROJECTION_REBUILD",
              "REPEATED_SEED_PRESERVES_USER_CREATED_TEST_FOLLOWUPS",
              "REPEATED_SEED_DOES_NOT_DUPLICATE_EPISODE_LINK_OR_EVENT",
              "EFFECTIVE_SLA_FILTERING_DOES_NOT_WRITE_PROJECTION_OR_SOURCE_TRUTH",
          ):
              if invariant not in stream["invariants"]:
                  stream["invariants"].append(invariant)
          for program in (
              "FOUX_V1_FO_4_SEEDED_WORKLIST_REPAIR_COMPLETED",
              "FOUX_V1_FO_4_EFFECTIVE_SLA_REPAIR_COMPLETED",
          ):
              if program not in state["operational_programs"]:
                  state["operational_programs"].append(program)
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          test_path = Path(
              "specialist_clinic/tests/test_followup_orchestration_fo0.py"
          )
          source = test_path.read_text(encoding="utf-8")
          source = source.replace(
              'assert stream["plan_version"] == "1.5.1"',
              'assert stream["plan_version"] == "1.5.2"',
              1,
          )
          source = source.replace(
              '"ISSUE_94_FO4_LOCAL_OWNER_UX_ACCEPTANCE_ON_27CCB992"',
              '"ISSUE_94_FO4_LOCAL_OWNER_UX_ACCEPTANCE_ON_CD243424"',
              1,
          )
          source = source.replace(
              'assert "نسخه:** `1.5.1`" in plan',
              'assert "نسخه:** `1.5.2`" in plan',
              1,
          )
          source = source.replace(
              'assert "reviewed_commit = 27ccb992f2cb43c78bfe98549c3f0414b88fd1d8" in plan',
              'assert "reviewed_commit = cd243424ecbae98892e0dfde1780bb846554942f" in plan',
              1,
          )
          source = source.replace(
              'assert "27ccb992f2cb43c78bfe98549c3f0414b88fd1d8" in agent',
              'assert "cd243424ecbae98892e0dfde1780bb846554942f" in agent',
              1,
          )
          marker = '''    assert fo4["status"] == "TECHNICALLY_VALIDATED"\n'''
          extra = '''    assert fo4["runtime_ui_review_commit"] == (\n        "cd243424ecbae98892e0dfde1780bb846554942f"\n    )\n    seeded = fo4["seeded_worklist_repair"]\n    assert seeded["tracking_issue"] == 97\n    assert seeded["implementation_pr"] == 98\n    assert seeded["final_ci_run"] == 30851594179\n    assert seeded["specialist_tests_passed"] == 781\n    assert seeded["accounting_tests_passed"] == 54\n    assert seeded["request_time_rebuild"] is False\n    assert seeded["manual_test_followups_preserved"] is True\n    assert seeded["duplicate_episode_link_event_count"] == 0\n    assert seeded["status"] == "COMPLETED"\n\n    sla = fo4["effective_sla_repair"]\n    assert sla["tracking_issue"] == 99\n    assert sla["implementation_pr"] == 100\n    assert sla["final_ci_run"] == 30852909213\n    assert sla["specialist_tests_passed"] == 784\n    assert sla["accounting_tests_passed"] == 54\n    assert sla["canonical_states"] == [\n        "FUTURE", "DUE_TODAY", "OVERDUE", "DUE_UNKNOWN",\n        "WAITING", "BLOCKED", "TERMINAL",\n    ]\n    assert sla["request_time_effective_filtering"] is True\n    assert sla["read_time_write"] is False\n    assert sla["status"] == "COMPLETED"\n'''
          if marker not in source:
              raise SystemExit("FO-4 state assertion marker not found")
          source = source.replace(marker, marker + extra, 1)

          doc_marker = '''    assert "773 Specialist + 54 Accounting" in plan\n'''
          doc_extra = '''    assert "Issue #97 / PR #98" in plan\n    assert "CI 30851594179" in plan\n    assert "781 Specialist + 54 Accounting" in plan\n    assert "Issue #99 / PR #100" in plan\n    assert "CI 30852909213" in plan\n    assert "784 Specialist + 54 Accounting" in plan\n    assert "PROJECTION_EMPTY_WITH_SOURCE_DATA" in plan\n    assert "DUE_UNKNOWN" in plan\n'''
          if doc_marker not in source:
              raise SystemExit("FO-4 docs assertion marker not found")
          source = source.replace(doc_marker, doc_marker + doc_extra, 1)

          agent_marker = '''    assert "773 Specialist + 54 Accounting" in agent\n'''
          agent_extra = '''    assert "Issue #97 / PR #98" in agent\n    assert "781 Specialist + 54 Accounting" in agent\n    assert "Issue #99 / PR #100" in agent\n    assert "784 Specialist + 54 Accounting" in agent\n    assert "prepare_seeded_followup_view.py" in agent\n'''
          if agent_marker not in source:
              raise SystemExit("agent assertion marker not found")
          source = source.replace(agent_marker, agent_marker + agent_extra, 1)
          test_path.write_text(source, encoding="utf-8")

          Path(
              ".github/workflows/temp_patch_fo4_repair_governance.yml"
          ).unlink()
      - name: Commit governance state and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.json \
                  specialist_clinic/tests/test_followup_orchestration_fo0.py \
                  .github/workflows/temp_patch_fo4_repair_governance.yml
          git commit -m "test(foux): attest FO-4 seed and SLA repair evidence"
          git push origin HEAD:docs/foux-v1-fo4-seed-sla-attestation
