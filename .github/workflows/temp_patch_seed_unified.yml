name: Temporary seeded Unified Worklist repair

on:
  push:
    branches:
      - fix/foux-seed-unified-worklist

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foux-seed-unified-worklist
          fetch-depth: 0
      - name: Patch stable demo followups and empty-projection readiness
        shell: python
        run: |
          from pathlib import Path
          import re

          repo = Path("specialist_clinic/src/adapters/sqlite/demo_cohort_repo.py")
          text = repo.read_text(encoding="utf-8")
          old_clear = '''            "medical_history",\n            "followup_tasks",\n            "appointments",'''
          new_clear = '''            "medical_history",\n            "appointments",'''
          if old_clear not in text:
              raise SystemExit("demo clear block not found")
          text = text.replace(old_clear, new_clear, 1)

          loop_tail = '''        for table in tables:\n            db.execute(\n                f"DELETE FROM {table} WHERE patient_link_id=?",\n                (patient_id,),\n            )\n'''
          loop_replacement = loop_tail + '''        # Preserve administrative demo follow-up row IDs so immutable Episode links\n        # remain valid across repeated canonical seed runs. Governed clinical/plan\n        # tasks are still reset with the rest of the synthetic clinical source set.\n        db.execute(\n            """DELETE FROM followup_tasks\n               WHERE patient_link_id=?\n                 AND COALESCE(source_engine,'') IN ('clinical_v2','encounter_plan')""",\n            (patient_id,),\n        )\n'''
          if loop_tail not in text:
              raise SystemExit("demo clear loop tail not found")
          text = text.replace(loop_tail, loop_replacement, 1)

          pattern = re.compile(
              r'''        db\.executemany\(\n            """INSERT INTO followup_tasks.*?\n        \)\n(?=        db\.executemany\(\n            """INSERT INTO prescriptions)''',
              re.DOTALL,
          )
          replacement = '''        DemoCohortRepository._sync_followups(\n            db, patient_id, patient, actor=actor, now=now\n        )\n'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"followup insert block replacements={count}")

          marker = '''    def summary(self, *, expected_version: str) -> dict:\n'''
          method = '''    @staticmethod\n    def _sync_followups(\n        db, patient_id: int, patient: dict, *, actor: str, now: str\n    ) -> None:\n        """Refresh synthetic follow-ups without changing their stable row IDs.\n\n        FO-1 links include the authoritative task ID. Deleting and reinserting the\n        same fixture rows would therefore orphan immutable Episode links. The demo\n        seed owns administrative follow-ups for TEST patients and updates them by\n        deterministic fixture order instead.\n        """\n        desired = list(patient["followups"])\n        existing = db.execute(\n            """SELECT * FROM followup_tasks\n               WHERE patient_link_id=?\n                 AND COALESCE(source_engine,'') NOT IN ('clinical_v2','encounter_plan')\n               ORDER BY id""",\n            (patient_id,),\n        ).fetchall()\n        if len(existing) > len(desired):\n            raise RuntimeError(\n                "synthetic follow-up fixture shape changed; explicit test-data reset required"\n            )\n\n        for index, row in enumerate(desired):\n            fulfillment = "remote" if row["reason"] == "refill" else "in_person"\n            values = (\n                row["due_date"],\n                row["reason"],\n                row["detail"],\n                row["status"],\n                "تیم درمان",\n                fulfillment,\n                row.get("resolved_at"),\n            )\n            if index < len(existing):\n                db.execute(\n                    """UPDATE followup_tasks\n                       SET due_date=?, reason=?, detail=?, status=?, assigned_to=?,\n                           fulfillment=?, resolved_at=?\n                       WHERE id=? AND patient_link_id=?""",\n                    (*values, int(existing[index]["id"]), patient_id),\n                )\n            else:\n                db.execute(\n                    """INSERT INTO followup_tasks\n                       (patient_link_id, due_date, reason, detail, status,\n                        assigned_to, fulfillment, resolved_at, created_at)\n                       VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)""",\n                    (patient_id, *values, now),\n                )\n\n'''
          if marker not in text:
              raise SystemExit("summary marker not found")
          text = text.replace(marker, method + marker, 1)
          repo.write_text(text, encoding="utf-8")

          read_model = Path(
              "specialist_clinic/src/services/followup_orchestration/read_model_service.py"
          )
          source = read_model.read_text(encoding="utf-8")
          copy_marker = '''    "PROJECTION_SCHEMA_INCOMPATIBLE": {\n'''
          copy_block = '''    "PROJECTION_EMPTY_WITH_SOURCE_DATA": {\n        "label": "دادهٔ پیگیری وجود دارد اما نمای یکپارچه هنوز آماده نشده است",\n        "help": "پس از ساخت دادهٔ نمونه، seed_demo_data.py را دوباره اجرا کنید؛ یا دستور prepare_seeded_followup_view.py را اجرا کنید. هیچ داده‌ای در این صفحه حدس زده یا خودکار بازسازی نمی‌شود.",\n    },\n'''
          if copy_marker not in source:
              raise SystemExit("readiness copy marker not found")
          source = source.replace(copy_marker, copy_block + copy_marker, 1)

          columns_marker = '''    def readiness(self) -> dict:\n'''
          helper = '''    def _count_rows(self, name: str) -> int:\n        try:\n            return int(self.db.execute(f"SELECT COUNT(*) FROM {name}").fetchone()[0])\n        except sqlite3.Error:\n            return 0\n\n'''
          if columns_marker not in source:
              raise SystemExit("readiness method marker not found")
          source = source.replace(columns_marker, helper + columns_marker, 1)

          ready_tail = '''        links = self._columns("followup_episode_links")\n        if not _LINK_REQUIRED_COLUMNS <= links:\n            return _readiness_payload("EPISODE_LINK_SCHEMA_INCOMPATIBLE")\n        return _readiness_payload("READY")\n'''
          ready_replacement = '''        links = self._columns("followup_episode_links")\n        if not _LINK_REQUIRED_COLUMNS <= links:\n            return _readiness_payload("EPISODE_LINK_SCHEMA_INCOMPATIBLE")\n\n        if self._count_rows("followup_work_item_projection") == 0:\n            operational_sources = sum(\n                self._count_rows(table)\n                for table in (\n                    "followup_tasks",\n                    "care_plan_commitments",\n                    "engagement_approvals",\n                )\n            )\n            if operational_sources or self._count_rows("followup_episodes"):\n                return _readiness_payload("PROJECTION_EMPTY_WITH_SOURCE_DATA")\n        return _readiness_payload("READY")\n'''
          if ready_tail not in source:
              raise SystemExit("readiness tail not found")
          source = source.replace(ready_tail, ready_replacement, 1)
          read_model.write_text(source, encoding="utf-8")

          Path(".github/workflows/temp_patch_seed_unified.yml").unlink()
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specialist_clinic/src/adapters/sqlite/demo_cohort_repo.py \
                  specialist_clinic/src/services/followup_orchestration/read_model_service.py \
                  .github/workflows/temp_patch_seed_unified.yml
          git commit -m "fix(foux): keep seeded task identities and detect unprepared projection"
          git push origin HEAD:fix/foux-seed-unified-worklist
