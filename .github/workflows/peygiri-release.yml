name: Peygiri Panel Windows Build

# Builds PeygiriPanel.exe on Windows (PyInstaller cannot cross-compile from Linux),
# runs the test suite and a smoke test of the frozen exe against a SYNTHETIC
# accounting DB, then publishes the exe as an artifact and on the
# `peygiri-exe-build` branch (single commit, force-pushed) for easy download.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/loving-lovelace-dvwvc9"
    paths:
      - "پنل پیگیری/**"
      - ".github/workflows/peygiri-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "پنل پیگیری"
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests -q --tb=short -p no:cacheprovider

      - name: Build PeygiriPanel.exe
        run: python -m PyInstaller PeygiriPanel.spec --noconfirm --clean

      - name: Smoke test the frozen exe (synthetic accounting DB only)
        run: |
          python scripts/dev_env.py --doctors          # build/dev/clinic_new.db (fake) + config.ini on port 18091
          $smoke = Join-Path $env:RUNNER_TEMP "پنل تست"
          New-Item -ItemType Directory -Path $smoke -Force | Out-Null
          Copy-Item dist\PeygiriPanel.exe $smoke
          Copy-Item config.ini $smoke
          $p = Start-Process -FilePath (Join-Path $smoke "PeygiriPanel.exe") -WorkingDirectory $smoke -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:18091/healthz" -UseBasicParsing -TimeoutSec 2
              if ($r.Content -match "peygiri-panel") { $ok = $true; Write-Host "healthz: $($r.Content)" }
            } catch { }
          }
          $login = Invoke-WebRequest -Uri "http://127.0.0.1:18091/login" -UseBasicParsing -TimeoutSec 5
          Write-Host "login page: $($login.StatusCode)"
          Get-Process PeygiriPanel -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-ChildItem $smoke | Format-Table Name, Length
          if (Test-Path (Join-Path $smoke "logs\peygiri_panel.log")) { Get-Content (Join-Path $smoke "logs\peygiri_panel.log") -Tail 20 }
          if (-not $ok -or $login.StatusCode -ne 200) { throw "frozen exe did not answer /healthz and /login" }

      - name: Package and hash
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist\PeygiriPanel.exe release\
          Compress-Archive -LiteralPath dist\PeygiriPanel.exe -DestinationPath release\PeygiriPanel-win-x64.zip
          foreach ($f in "PeygiriPanel.exe", "PeygiriPanel-win-x64.zip") {
            $hash = (Get-FileHash "release\$f" -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content -LiteralPath release\SHA256SUMS.txt -Encoding ascii -Value "$hash  $f"
          }
          $v = (Select-String -Path src\version.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          Set-Content -LiteralPath release\BUILD.txt -Encoding utf8 -Value "PeygiriPanel $v`nsource commit: $env:GITHUB_SHA`nbuilt: $(Get-Date -AsUTC -Format o)"
          Get-Content release\SHA256SUMS.txt, release\BUILD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PeygiriPanel-win-x64
          path: "پنل پیگیری/release/"
          if-no-files-found: error
          retention-days: 14

      - name: Publish to the peygiri-exe-build branch
        run: |
          $out = Join-Path $env:RUNNER_TEMP "exe-branch"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item release\* $out
          Set-Location $out
          git init -q -b peygiri-exe-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "PeygiriPanel.exe build of $env:GITHUB_SHA"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" peygiri-exe-build
