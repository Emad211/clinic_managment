name: Context Source Snapshot

on:
  push:
    branches:
      - agent-clinical-evaluation-context

permissions:
  contents: read

concurrency:
  group: context-source-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source without databases or environments
        run: >-
          tar
          --exclude=.git
          --exclude='*.db'
          --exclude='.venv'
          --exclude='__pycache__'
          --exclude='.pytest_cache'
          -czf source-snapshot.tar.gz .
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: context-source-snapshot
          path: source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
