- تغییر Appointment؛
- clinical inference/decision/completion؛
- SMS delivery → Episode transition؛
- Outbox/dead-letter/cross-channel state machine؛
- retry worker جدید؛
- Rule/Hypoglycemia Shadow؛
- Write به `clinic_new.db`؛
- شروع FO-7 تا FO-10.

