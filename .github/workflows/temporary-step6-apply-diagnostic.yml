name: Temporary Step 6 Apply Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 34 &&
      github.event.comment.user.login == 'Emad211' &&
      github.event.comment.body == '/diagnose-step6-apply-20260725'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-clinical-operational-security
          fetch-depth: 0

      - name: Run deterministic finalizer and capture traceback
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python .github/finalize_step6_product.py
            python .github/finalize_step6_migration_order.py
          } 2>&1 | tee /tmp/step6-apply.log

      - name: Publish exact traceback to issue 36
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OUTCOME: ${{ steps.apply.outcome }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          {
            echo "Step 6 apply diagnostic · run ${RUN_ID} · outcome=${OUTCOME}"
            echo
            echo '```text'
            tail -n 120 /tmp/step6-apply.log
            echo '```'
          } > /tmp/body.txt
          gh api --method POST repos/${REPOSITORY}/issues/36/comments \
            --raw-field body="$(cat /tmp/body.txt)"
