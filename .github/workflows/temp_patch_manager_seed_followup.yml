name: Temporary manager seed follow-up integration

on:
  push:
    branches:
      - fix/foux-seed-unified-worklist

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foux-seed-unified-worklist
          fetch-depth: 0
      - name: Patch manager explicit seed action
        shell: python
        run: |
          from pathlib import Path

          path = Path("specialist_clinic/src/api/manager.py")
          text = path.read_text(encoding="utf-8")
          old = '''        elif action == "prepare-demo-cohort":\n            from src.services.clinical_engine.demo_cohort import DemoCohortService\n            cohort = DemoCohortService().ensure(actor=actor)\n            totals = cohort["totals"]\n            flash(\n                f"۱۰ پروندهٔ طولی آماده شد: {totals['vitals']} مشاهده، "\n                f"{totals['labs']} آزمایش و {totals['medication_events']} رویداد دارویی.",\n                "success",\n            )\n'''
          new = '''        elif action == "prepare-demo-cohort":\n            from src.services.clinical_engine.demo_cohort import DemoCohortService\n            from src.services.followup_orchestration.demo_seed_preparation import (\n                DemoSeedFollowupPreparationService,\n            )\n\n            cohort_service = DemoCohortService()\n            cohort = cohort_service.ensure(actor=actor)\n            followup = DemoSeedFollowupPreparationService(get_db()).run(\n                as_of_at=cohort_service.reference_at(),\n                actor_username=actor,\n            )\n            totals = cohort["totals"]\n            flash(\n                f"۱۰ پروندهٔ طولی آماده شد: {totals['vitals']} مشاهده، "\n                f"{totals['labs']} آزمایش، "\n                f"{totals['medication_events']} رویداد دارویی و "\n                f"{followup['demo_projection_count']} مسیر در نمای یکپارچه.",\n                "success",\n            )\n'''
          if old not in text:
              raise SystemExit("prepare-demo-cohort block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/temp_patch_manager_seed_followup.yml").unlink()
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specialist_clinic/src/api/manager.py \
                  .github/workflows/temp_patch_manager_seed_followup.yml
          git commit -m "fix(seed): prepare Unified follow-ups from manager action"
          git push origin HEAD:fix/foux-seed-unified-worklist
