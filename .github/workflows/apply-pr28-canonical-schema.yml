name: Apply reviewed PR28 canonical schema

on:
  push:
    branches:
      - agent-clinical-canonical-schema
  pull_request:
    branches:
      - agent-clinical-schema-cutover

permissions:
  contents: write

concurrency:
  group: apply-pr28-canonical-schema
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct and apply reviewed patch
        run: |
          set -euo pipefail
          cat .github/pr28.patch.part* > /tmp/pr28.patch
          git apply --check /tmp/pr28.patch
          git apply /tmp/pr28.patch
          rm -f .github/pr28.patch.part*
          rm -f .github/workflows/apply-pr28-canonical-schema.yml
          git add -A
          git diff --cached --check

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r specialist_clinic/requirements.txt pytest

      - name: Verify canonical schema and focused cutover suite
        run: |
          set -euo pipefail
          python -m py_compile \
            specialist_clinic/src/adapters/sqlite/clinical_engine_rule_projection_repo.py \
            specialist_clinic/src/adapters/sqlite/clinical_engine_rules_repo.py \
            specialist_clinic/src/adapters/sqlite/clinical_engine_v1_cutover.py \
            specialist_clinic/src/adapters/sqlite/core.py \
            specialist_clinic/src/api/clinical_reconciliation.py \
            specialist_clinic/src/api/manager.py \
            specialist_clinic/src/app.py
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          schema = Path(
              "specialist_clinic/src/adapters/sqlite/schema.sql"
          ).read_text(encoding="utf-8")
          db = sqlite3.connect(":memory:")
          db.row_factory = sqlite3.Row
          db.execute("PRAGMA foreign_keys=ON")
          db.executescript(schema)
          tables = {
              row["name"]
              for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              ).fetchall()
          }
          assert "clinical_rules" not in tables
          assert "suggestion_log" not in tables
          rule_columns = {
              row["name"]
              for row in db.execute(
                  "PRAGMA table_info(clinical_rule_versions)"
              ).fetchall()
          }
          decision_columns = {
              row["name"]
              for row in db.execute(
                  "PRAGMA table_info(clinical_decision_events)"
              ).fetchall()
          }
          assert "source_legacy_rule_id" not in rule_columns
          assert "legacy_source_suggestion_log_id" not in decision_columns
          assert db.execute("PRAGMA foreign_key_check").fetchall() == []
          PY
          cd specialist_clinic
          python -m pytest -q --tb=short \
            tests/test_clinical_engine_v1_request_cutover.py \
            tests/test_clinical_engine_cutover_boundary.py \
            tests/test_clinical_engine_rule_projection.py \
            tests/test_v1_runtime_retired.py \
            tests/test_clinical_engine_v2_storage.py

      - name: Commit canonical schema cutover
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "remove Clinical Engine v1 from the canonical schema"
          git push origin "HEAD:${branch}"

# This workflow self-deletes in the commit that applies the reviewed patch.
