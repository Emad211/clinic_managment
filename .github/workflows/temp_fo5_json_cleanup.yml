name: Temporary FO-5 JSON cleanup

on:
  push:
    branches:
      - docs/foux-v1-fo5-authorization
    paths:
      - .github/workflows/temp_fo5_json_cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/foux-v1-fo5-authorization
      - name: Remove superseded aggregate gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('PROJECT_STATE.json')
          state = json.loads(path.read_text(encoding='utf-8'))
          freeze = state['global_freeze']
          freeze.pop('followup_orchestration_fo5_and_later', None)
          programs = state['operational_programs']
          for stale in (
              'FOUX_V1_FO_4_TECHNICALLY_VALIDATED_LOCAL_UX_PENDING',
              'FOUX_V1_FO_5_AND_LATER_BLOCKED',
          ):
              while stale in programs:
                  programs.remove(stale)
          path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_fo5_json_cleanup.yml
          git add PROJECT_STATE.json
          git commit -m "docs(state): remove superseded FO-5 freeze markers"
          git push origin HEAD:docs/foux-v1-fo5-authorization
