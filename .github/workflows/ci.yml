# ---------------------------------------------------------------------------
# CI — unified Halqe migration gate
# Temporary branch-scoped materialization permission. Removed immediately after
# docs/openapi.json and the colliding test identity are committed to the audit
# branch; no production branch uses an auto-commit step.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: "halqe backend (pytest)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: validate_only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_HOST: localhost
      PG_PORT: "55432"
      PG_USER: postgres
      PG_PASSWORD: validate_only
      PG_APP_USER: platform_login_test
      PG_APP_PASSWORD: test_pw
      PG_ACCOUNTING_USER: accounting_login_test
      PG_ACCOUNTING_PASSWORD: accounting_test_pw
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: "ci-dummy-secret-not-for-production"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: halqe/requirements.txt
      - name: Install Python dependencies
        run: pip install -r halqe/requirements.txt
      - name: Materialize unified contract and collision-free fixture
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/halqe-unified-migration-audit'
        working-directory: halqe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_patient_record_structured.py")
          text = path.read_text(encoding="utf-8")
          old = "VALUES (1, %s, 'بیمار', 'دوم', '0013546759', '09120000009')"
          new = "VALUES (1, %s, 'بیمار', 'دوم', NULL, '09120000009')"
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("expected structured-record fixture identity not found")
          PY
          python manage.py dump_openapi
          git config user.name "halqe-integration-bot"
          git config user.email "halqe-integration-bot@users.noreply.github.com"
          git add docs/openapi.json tests/test_patient_record_structured.py
          if ! git diff --cached --quiet; then
            git commit -m "chore(integration): lock unified OpenAPI and isolate test patient"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Verify committed OpenAPI contract
        working-directory: halqe
        run: |
          python manage.py dump_openapi --check
          cp docs/openapi.json generated-openapi.json
      - name: Run full Halqe backend suite
        working-directory: halqe
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee backend-test.log
      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: halqe/backend-test.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload generated OpenAPI contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-openapi-contract
          path: halqe/generated-openapi.json
          if-no-files-found: warn
          retention-days: 14

  legacy-oracles:
    name: "legacy Flask behavioural oracles"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            webapp/requirements.txt
            specialist_clinic/requirements.txt
      - name: Install both legacy app dependencies
        run: pip install -r webapp/requirements.txt -r specialist_clinic/requirements.txt
      - name: Run accounting money oracle
        working-directory: webapp
        run: >-
          python -m pytest
          tests/test_harness_smoke.py
          tests/test_billing_characterization.py
          -q --tb=short
      - name: Run complete specialist-clinic suite
        working-directory: specialist_clinic
        run: python -m pytest -q --tb=short

  schema-guard:
    name: "schema-guard (pg slice tests)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_pw
          POSTGRES_DB: halqe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_DSN: "postgresql://postgres:ci_postgres_pw@localhost:5432/halqe"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt
      - name: Install schema test dependencies
        run: pip install "psycopg[binary]" pytest bcrypt
      - name: Run schema-guard tests
        working-directory: specialist_clinic
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_pg_schema.py -q --tb=short 2>&1 | tee schema-guard.log
      - name: Upload schema-guard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-guard-log
          path: specialist_clinic/schema-guard.log
          if-no-files-found: warn
          retention-days: 14

  web:
    name: "halqe web (jest + typecheck + lint + build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: halqe/web/package-lock.json
      - name: Install npm dependencies
        working-directory: halqe/web
        run: npm ci
      - name: Run Jest tests
        working-directory: halqe/web
        run: npm test
      - name: Type-check TypeScript
        working-directory: halqe/web
        run: npx tsc --noEmit
      - name: Lint web source
        working-directory: halqe/web
        run: npx eslint .
      - name: Build production web bundle
        working-directory: halqe/web
        run: npm run build
