name: Finalize Operational Security Hardening

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: finalize-step6-security
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent-clinical-operational-security' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-clinical-operational-security
          fetch-depth: 0

      - name: Apply reviewed operational wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path('specialist_clinic/src/adapters/sqlite/core.py')
          text = core.read_text(encoding='utf-8')
          text = text.replace(
              'db = g._database = sqlite3.connect(db_path)',
              'db = g._database = sqlite3.connect(db_path, timeout=10)',
          )
          text = text.replace(
              'db.execute("PRAGMA busy_timeout = 3000")',
              '''db.execute("PRAGMA busy_timeout = 10000")
        if db_path != ":memory:":
            db.execute("PRAGMA journal_mode = WAL")
            db.execute("PRAGMA synchronous = NORMAL")
            db.execute("PRAGMA wal_autocheckpoint = 1000")''',
          )
          old = '''    ensure_clinical_reconciliation_storage(db)
    ensure_clinical_data_conflict_storage(db)
    _ensure_clinical_engine_v2_storage(db)
'''
          new = '''    ensure_clinical_reconciliation_storage(db)
    ensure_clinical_data_conflict_storage(db)
    from src.adapters.sqlite.clinical_care_loop_strict_guards import (
        ensure_strict_clinical_care_loop_guards,
    )
    from src.adapters.sqlite.security_permission_schema import (
        ensure_security_permission_storage,
    )
    from src.adapters.sqlite.operational_lease_schema import (
        ensure_operational_lease_storage,
    )
    from src.adapters.sqlite.clinical_audit_integrity_schema import (
        ensure_clinical_audit_integrity_storage,
    )
    ensure_strict_clinical_care_loop_guards(db)
    ensure_security_permission_storage(db)
    ensure_operational_lease_storage(db)
    ensure_clinical_audit_integrity_storage(db)
    _ensure_clinical_engine_v2_storage(db)
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise AssertionError('canonical operational migrations are missing')
          core.write_text(text, encoding='utf-8')

          scheduler = Path('specialist_clinic/src/services/scheduler.py')
          text = scheduler.read_text(encoding='utf-8')
          old = '''            if self._run_once(
                job_name="clinical-followups",
                period_key=today,
                lease=lease,
                callback=self._run_clinical_followups,
            ):
                self._last_followup_day = today

            period = self._bucket(now)
'''
          new = '''            if self._run_once(
                job_name="clinical-followups",
                period_key=today,
                lease=lease,
                callback=self._run_clinical_followups,
            ):
                self._last_followup_day = today
            self._run_once(
                job_name="clinical-audit-checkpoint",
                period_key=today,
                lease=lease,
                callback=self._seal_clinical_audit,
            )

            period = self._bucket(now)
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise AssertionError('daily audit job wiring is missing')
          old = '''    def _run_engagement(self):
'''
          new = '''    def _seal_clinical_audit(self):
        from src.services.clinical_audit_integrity import (
            ClinicalAuditIntegrityService,
        )

        checkpoint = ClinicalAuditIntegrityService().seal(
            created_by=f"scheduler:{self.owner_id}"
        )
        logger.info(
            "[scheduler] clinical audit checkpoint id=%s hash=%s",
            checkpoint["id"],
            checkpoint["checkpoint_hash"][:12],
        )
        return True

    def _run_engagement(self):
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise AssertionError('audit checkpoint callback is missing')
          scheduler.write_text(text, encoding='utf-8')

          activation = Path('specialist_clinic/src/adapters/sqlite/clinical_engine_activation_repo.py')
          text = activation.read_text(encoding='utf-8')
          old = '''            verification = ClinicalAuditIntegrityService().verify_checkpoint(
                int(checkpoint_id),
                expected_hash=str(checkpoint_hash),
            )
            return verification.ok
'''
          new = '''            service = ClinicalAuditIntegrityService()
            verification = service.verify_checkpoint(
                int(checkpoint_id),
                expected_hash=str(checkpoint_hash),
            )
            latest = service.verify_latest(require_checkpoint=True)
            return verification.ok and latest.ok
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise AssertionError('latest audit checkpoint verification is missing')
          activation.write_text(text, encoding='utf-8')

          health = Path('specialist_clinic/src/api/health.py')
          text = health.read_text(encoding='utf-8')
          text = text.replace(
              "datetime(lease.expires_at)>datetime('now')",
              "datetime(lease.expires_at)>datetime('now','+3 hours','+30 minutes')",
          )
          health.write_text(text, encoding='utf-8')

          worklist = Path('specialist_clinic/src/templates/followups/worklist.html')
          text = worklist.read_text(encoding='utf-8')
          text = text.replace(
              "{% elif g.user and g.user['role'] == 'manager' %}",
              "{% elif permissions.get('clinical.task.transition') or permissions.get('clinical.outcome.record') %}",
          )
          text = text.replace(
              'style="align-self:flex-end;"><button class="btn',
              'style="align-self:flex-end;">\n                                                    <button class="btn',
          )
          worklist.write_text(text, encoding='utf-8')

          base = Path('specialist_clinic/src/templates/base.html')
          text = base.read_text(encoding='utf-8')
          text = text.replace(
              "{% if g.user['role']=='manager' %}",
              "{% if permissions.get('rule.review.clinical') or permissions.get('rule.activate') or permissions.get('security.grant.manage') %}",
              1,
          )
          base.write_text(text, encoding='utf-8')
          PY

      - name: Restore canonical CI before product commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent-clinical-closed-care-loop
          git show origin/agent-clinical-closed-care-loop:.github/workflows/ci.yml > .github/workflows/ci.yml
          python -m compileall -q specialist_clinic/src specialist_clinic/tests
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt

      - name: Install dependencies
        working-directory: specialist_clinic
        run: python -m pip install -r requirements.txt pytest

      - name: Run operational security safety gate
        working-directory: specialist_clinic
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONIOENCODING: utf-8
        run: >-
          python -m pytest -q --tb=short
          tests/test_operational_security_hardening.py
          tests/test_backup_and_logging.py
          tests/test_clinical_closed_care_loop.py
          tests/test_clinical_engine_v2_action_contract.py
          tests/test_clinical_engine_v2_activation.py
          tests/test_clinical_engine_v2_decisions.py
          tests/test_clinical_engine_v2_followups.py
          tests/test_clinical_engine_v2_manager_ui.py
          tests/test_clinical_engine_v2_readonly_ui.py
          tests/test_clinical_engine_v2_runtime_freshness.py
          tests/test_clinical_reconciliation_engine_identity.py
          tests/test_end_to_end_loops.py
          tests/test_patient_mutation_ownership.py
          tests/test_ui_information_architecture.py

      - name: Commit clean security implementation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'complete clinical operational security hardening'
          git push \
            --force-with-lease=refs/heads/agent-clinical-operational-security:${GITHUB_SHA} \
            origin HEAD:refs/heads/agent-clinical-operational-security
