# ---------------------------------------------------------------------------
# CI — Clinic Management Platform
# Four suites that must all be green before any merge to main:
#   1. halqe backend       (pytest, Django+Postgres)
#   2. webapp money oracle (isolated SQLite characterization tests)
#   3. schema-guard        (Postgres slice tests)
#   4. halqe web           (jest + typecheck + lint + production build)
#
# clinic_new.db is never mutated; webapp's guard hashes it before/after tests.
# No real SMS is sent — NullProvider is active when no real key is set.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: "halqe backend (pytest)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: ci_postgres_pw
      PG_APP_USER: platform_login_test
      PG_APP_PASSWORD: test_pw
      PG_ACCOUNTING_USER: accounting_login_test
      PG_ACCOUNTING_PASSWORD: accounting_test_pw
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: "ci-dummy-secret-not-for-production"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: halqe/requirements.txt
      - name: Install Python dependencies
        run: pip install -r halqe/requirements.txt
      - name: Run halqe backend tests
        working-directory: halqe
        run: >-
          python -m pytest -q --tb=short
          2>&1 | tee backend.log
      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: halqe/backend.log
          if-no-files-found: error
          retention-days: 7

  webapp-accounting-oracle:
    name: "webapp accounting oracle"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - name: Install webapp dependencies
        run: pip install -r webapp/requirements.txt
      - name: Run isolated accounting characterization tests
        working-directory: webapp
        run: >-
          python -m pytest
          tests/test_harness_smoke.py
          tests/test_billing_characterization.py
          -q --tb=short

  schema-guard:
    name: "schema-guard (pg slice tests)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_pw
          POSTGRES_DB: halqe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_DSN: "postgresql://postgres:ci_postgres_pw@localhost:5432/halqe"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt
      - name: Install Python dependencies
        run: pip install "psycopg[binary]" pytest
      - name: Run schema-guard tests
        working-directory: specialist_clinic
        run: >-
          python -m pytest tests/test_pg_schema.py -q --tb=short
          2>&1 | tee schema-guard.log
      - name: Upload schema-guard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-guard-log
          path: specialist_clinic/schema-guard.log
          if-no-files-found: error
          retention-days: 7

  web:
    name: "halqe web (jest + build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: halqe/web/package-lock.json
      - name: Install npm dependencies
        working-directory: halqe/web
        run: npm ci
      - name: Run Jest tests
        working-directory: halqe/web
        run: npm test
      - name: Type-check TypeScript
        working-directory: halqe/web
        run: npx tsc --noEmit
      - name: Lint web source
        working-directory: halqe/web
        run: npx eslint .
      - name: Build production web bundle
        working-directory: halqe/web
        run: npm run build
