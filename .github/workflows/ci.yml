name: Finalize Closed Clinical Care Loop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-step5-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name == 'push' && github.ref_name == 'agent-clinical-closed-care-loop' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-clinical-closed-care-loop
          fetch-depth: 0

      - name: Capture exact branch lease
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply final focused corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          repo = Path('specialist_clinic/src/adapters/sqlite/clinical_care_loop_repo.py')
          text = repo.read_text(encoding='utf-8')
          old = '        effective = _now_text(effective_at or recorded_at)\n'
          new = '        effective = _datetime_text(effective_at) or recorded\n'
          assert old in text
          repo.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('specialist_clinic/tests/test_clinical_engine_v2_followups.py')
          text = test.read_text(encoding='utf-8')
          old = '''    db.execute(
        """UPDATE followup_tasks
           SET status='done', resolved_at='2026-07-22 12:00:00'"""
    )
    db.commit()
'''
          new = '''    from src.adapters.sqlite.clinical_care_loop_repo import (
        ClinicalCareLoopRepository,
    )

    task_id = int(
        db.execute(
            "SELECT id FROM followup_tasks WHERE source_engine='clinical_v2'"
        ).fetchone()["id"]
    )
    care = ClinicalCareLoopRepository()
    outcome = care.record_outcome(
        task_id,
        outcome_type="LAB_COMPLETED",
        actor_username="pytest",
        note="دورهٔ اول تکمیل شد",
    )
    care.append_task_event(
        task_id,
        event_type="COMPLETED",
        expected_current_event_id=care.current_task(task_id)["current_event_id"],
        actor_username="pytest",
        outcome_event_id=int(outcome["id"]),
    )
'''
          assert old in text
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

          template = Path('specialist_clinic/src/templates/followups/worklist.html')
          text = template.read_text(encoding='utf-8')
          text = text.replace(
              'style="align-self:flex-end;"><button class="btn',
              'style="align-self:flex-end;">\n                                                    <button class="btn',
          )
          template.write_text(text, encoding='utf-8')

          api = Path('specialist_clinic/src/api/followups.py')
          text = api.read_text(encoding='utf-8')
          if 'import sqlite3\n' not in text:
              text = text.replace(
                  'from datetime import datetime\n',
                  'from datetime import datetime\nimport sqlite3\n',
                  1,
              )
          text = text.replace(
              'except (LookupError, ClinicalCareLoopValidationError, ValueError) as exc:',
              'except (LookupError, ClinicalCareLoopValidationError, ValueError, sqlite3.IntegrityError) as exc:',
          )
          api.write_text(text, encoding='utf-8')
          PY

      - name: Restore canonical CI before commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent-clinical-data-conflict-completeness
          git show origin/agent-clinical-data-conflict-completeness:.github/workflows/ci.yml > .github/workflows/ci.yml
          python -m compileall -q specialist_clinic/src specialist_clinic/tests
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt

      - name: Install test dependencies
        working-directory: specialist_clinic
        run: python -m pip install -r requirements.txt pytest

      - name: Run closed-care-loop safety gate
        working-directory: specialist_clinic
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONIOENCODING: utf-8
        run: >-
          python -m pytest -q --tb=short
          tests/test_clinical_closed_care_loop.py
          tests/test_clinical_engine_v2_followups.py
          tests/test_administrative_surfaces_descriptive_only.py
          tests/test_canonical_consistency.py
          tests/test_ui_information_architecture.py
          tests/test_datetime_controls.py
          tests/test_patient_cockpit_service.py

      - name: Commit and replace branch atomically
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'complete append-only clinical care loop'
          git push \
            --force-with-lease=refs/heads/agent-clinical-closed-care-loop:${START_SHA} \
            origin HEAD:refs/heads/agent-clinical-closed-care-loop
