# ---------------------------------------------------------------------------
# CI — Clinic Management Platform
# Required before merge:
#   1. Halqe backend (Django + real PostgreSQL + full pytest)
#   2. PostgreSQL schema guard
#   3. Halqe web (Jest + TypeScript + ESLint + production build)
# Test logs and the generated OpenAPI contract are retained for diagnosis/review.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: "halqe backend (pytest)"
    runs-on: ubuntu-latest
    permissions:
      # Temporary branch-local permission: the next step materializes one reviewed
      # compressed source payload and removes its staging files. It is removed as
      # soon as the bot commit lands.
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: validate_only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_HOST: localhost
      PG_PORT: "55432"
      PG_USER: postgres
      PG_PASSWORD: validate_only
      PG_APP_USER: platform_login_test
      PG_APP_PASSWORD: test_pw
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: "ci-dummy-secret-not-for-production"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: halqe/requirements.txt
      - name: Install Python dependencies
        run: pip install -r halqe/requirements.txt
      - name: Materialize reviewed specialist-record importer payload
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/patient-record-migration-phase-1'
        working-directory: halqe
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import py_compile
          import zlib

          parts = sorted(
              Path("clinical").glob(
                  "_specialist_record_import.py.zlib.b64.part*"
              )
          )
          if not parts:
              print("Importer source is already materialized.")
              raise SystemExit(0)
          encoded = b"".join(part.read_bytes() for part in parts)
          target = Path("clinical/specialist_record_import.py")
          target.write_bytes(zlib.decompress(base64.b64decode(encoded)))
          py_compile.compile(str(target), doraise=True)
          for part in parts:
              part.unlink()
          print(f"Materialized {target} ({target.stat().st_size} bytes).")
          PY
      - name: Generate live OpenAPI contract
        working-directory: halqe
        run: python manage.py dump_openapi --output generated-openapi.json
      - name: Commit generated source and OpenAPI snapshot once
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/patient-record-migration-phase-1'
        working-directory: halqe
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          cp generated-openapi.json docs/openapi.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.json clinical/specialist_record_import.py 2>/dev/null || true
          git add -u clinical
          if git diff --cached --quiet; then
            echo "Generated sources and OpenAPI snapshot are current."
            exit 0
          fi
          git commit -m "feat(record-etl): materialize importer and refresh API contract"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Run Halqe backend tests
        working-directory: halqe
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee backend-test.log
      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: halqe/backend-test.log
          if-no-files-found: error
          retention-days: 14
      - name: Upload generated OpenAPI contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-openapi-contract
          path: halqe/generated-openapi.json
          if-no-files-found: error
          retention-days: 14

  schema-guard:
    name: "schema-guard (pg slice tests)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_pw
          POSTGRES_DB: halqe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_DSN: "postgresql://postgres:ci_postgres_pw@localhost:5432/halqe"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt
      - name: Install Python dependencies
        run: pip install "psycopg[binary]" pytest bcrypt
      - name: Run schema-guard tests
        working-directory: specialist_clinic
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_pg_schema.py -q --tb=short 2>&1 | tee schema-guard.log
      - name: Upload schema-guard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-guard-log
          path: specialist_clinic/schema-guard.log
          if-no-files-found: error
          retention-days: 14

  web:
    name: "halqe web (jest + build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: halqe/web/package-lock.json
      - name: Install npm dependencies
        working-directory: halqe/web
        run: npm ci
      - name: Run Jest tests
        working-directory: halqe/web
        run: npm test
      - name: Type-check TypeScript
        working-directory: halqe/web
        run: npx tsc --noEmit
      - name: Lint web source
        working-directory: halqe/web
        run: npx eslint .
      - name: Build production web bundle
        working-directory: halqe/web
        run: npm run build
