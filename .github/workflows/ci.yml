          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise AssertionError(f"required pattern missing in {path}: {old[:120]!r}")
              target.write_text(text, encoding="utf-8")

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              left = text.find(start)
              right = text.find(end, left + len(start)) if left >= 0 else -1
              if left < 0 or right < 0:
                  if replacement.strip() not in text:
                      raise AssertionError(f"section markers missing in {path}")
                  return
