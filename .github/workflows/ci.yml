name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  diagnose-transfer:
    name: "diagnose step3 payloads"
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-clinical-parallel-logic-consolidation
          fetch-depth: 0

      - name: Decode analytics
        run: python .github/step3-batch/decode_one.py .github/step3-batch/analytics_service.py.b64 /tmp/analytics.py plain
        continue-on-error: true
      - name: Decode patients
        run: python .github/step3-batch/decode_one.py .github/step3-batch/patients.py.gz.b64 /tmp/patients.py gzip
        continue-on-error: true
      - name: Decode detail
        run: |
          cat .github/step3-batch/detail.part-* > /tmp/detail.b64
          python .github/step3-batch/decode_one.py /tmp/detail.b64 /tmp/detail.html gzip
        continue-on-error: true
      - name: Decode canonical test
        run: python .github/step3-batch/decode_one.py .github/step3-batch/test_canonical_consistency.py.gz.b64 /tmp/canonical.py gzip
        continue-on-error: true
      - name: Decode card test
        run: python .github/step3-batch/decode_one.py .github/step3-batch/test_patient_card.py.gz.b64 /tmp/card.py gzip
        continue-on-error: true
      - name: Decode guard test
        run: python .github/step3-batch/decode_one.py .github/step3-batch/test_parallel_clinical_logic_retired.py.gz.b64 /tmp/guard.py gzip
        continue-on-error: true
      - name: Decode second patch
        run: |
          cat .github/step3-full/part-* > /tmp/second.b64
          python .github/step3-batch/decode_one.py /tmp/second.b64 /tmp/second.patch gzip
        continue-on-error: true
