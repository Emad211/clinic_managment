name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  export-consolidation:
    name: "export complete clinical logic consolidation bundle"
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-clinical-parallel-logic-consolidation
          fetch-depth: 0
      - name: Pack complete reviewed staging bundle
        run: tar -czf /tmp/step3-transfer-bundle.tar.gz .github/step3-batch .github/step3-full
      - name: Upload complete staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: step3-transfer-bundle
          path: /tmp/step3-transfer-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1
