name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  export-consolidation:
    name: "export current clinical logic consolidation source"
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-clinical-parallel-logic-consolidation
          fetch-depth: 0
      - name: Pack reviewed staging bundle
        run: tar -czf /tmp/step3-transfer-bundle.tar.gz .github/step3-batch .github/step3-full
      - name: Upload reviewed staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: step3-transfer-bundle
          path: /tmp/step3-transfer-bundle.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Pack current branch source
        run: >-
          tar
          --exclude=.git
          --exclude='*.db'
          --exclude='.venv'
          --exclude='__pycache__'
          --exclude='.pytest_cache'
          --exclude='webapp/build'
          --exclude='webapp/dist'
          --exclude='specialist_clinic/dist'
          -czf /tmp/step3-source-snapshot.tar.gz .
      - name: Upload current branch source
        uses: actions/upload-artifact@v4
        with:
          name: step3-source-snapshot
          path: /tmp/step3-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
