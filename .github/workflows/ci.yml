# CI for the two production Flask + SQLite desktop applications.
# All tests use temporary databases; the committed accounting database is never
# mutated and no real SMS provider is configured.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-evaluation-context:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]' && hashFiles('.github/context-final.patch.gz.b64') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify and apply reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '47ffc43f1c77a2ed399671a0fc4a34a352e21412347a3e23f2e40f5ef2a8fbf9  .github/context-final.patch.gz.b64' | sha256sum -c -
          base64 --decode .github/context-final.patch.gz.b64 | gzip --decompress > /tmp/context-final.patch
          echo 'b98045eb7a4963e4a2e5fb5017daba1a0006cab95426e61fcfcb32f2b3f5808c  /tmp/context-final.patch' | sha256sum -c -
          git apply --check /tmp/context-final.patch
          git apply /tmp/context-final.patch
          rm -f .github/context-final.patch.gz.b64
          rm -rf .github/context-final
          rm -f .github/workflows/apply-context-final.yml
          rm -f .github/workflows/context-source-snapshot.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'complete explicit clinical evaluation context'
          git push origin HEAD:${GITHUB_REF_NAME}

  specialist-clinic:
    name: "specialist clinic (pytest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: specialist_clinic
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run specialist clinic tests
        run: >-
          python -m pytest tests -q --tb=short
          --junitxml=pytest-specialist.xml
      - name: Upload specialist pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-pytest-results
          path: specialist_clinic/pytest-specialist.xml
          if-no-files-found: warn
          retention-days: 7

  accounting:
    name: "accounting (pytest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run accounting tests
        run: >-
          python -m pytest tests -q --tb=short
          --junitxml=pytest-accounting.xml
      - name: Upload accounting pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounting-pytest-results
          path: webapp/pytest-accounting.xml
          if-no-files-found: warn
          retention-days: 7
