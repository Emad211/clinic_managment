name: Specialist A12 Diabetes Rule Tranche Gate

on:
  push:
    branches:
      - agent/specialist-rule-library-tranche-a12
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: specialist-a12-diabetes-rule-tranche
  cancel-in-progress: true

jobs:
  exact-head-gate:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'agent/specialist-rule-library-tranche-a12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/specialist-rule-library-tranche-a12
          fetch-depth: 0

      - name: Capture branch lease
        shell: bash
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            specialist_clinic/requirements.txt
            webapp/requirements.txt

      - name: Apply deterministic A12 tranche finalizer
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/finalize_a12.py
          python .github/finalize_a12.py
          python -m compileall -q specialist_clinic/src specialist_clinic/tests
          git diff --check

      - name: Install specialist dependencies
        working-directory: specialist_clinic
        run: python -m pip install -r requirements.txt pytest

      - name: Run A12 clinical-engine release gate
        working-directory: specialist_clinic
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            --junitxml=pytest-specialist-a12.xml \
            tests/test_clinical_engine*.py \
            tests/test_clinical_validation*.py \
            tests/test_clinical_rule_package_contract.py \
            tests/test_clinical_rule_library_tranche_a12.py \
            tests/test_end_to_end_loops.py

      - name: Install accounting dependencies
        working-directory: webapp
        run: python -m pip install -r requirements.txt

      - name: Run accounting regression suite
        working-directory: webapp
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONIOENCODING: utf-8
        run: >-
          python -m pytest tests -q --tb=short
          --junitxml=pytest-accounting-a12.xml

      - name: Upload A12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-a12-diabetes-rule-tranche-evidence
          path: |
            specialist_clinic/pytest-specialist-a12.xml
            webapp/pytest-accounting-a12.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish clean exact-tested product tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- webapp/src
          rm -f specialist_clinic/pytest-specialist-a12.xml
          rm -f webapp/pytest-accounting-a12.xml
          rm -f .github/finalize_a12.py
          rm -f .github/workflows/specialist-a12-gate.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "add first governed diabetes rule-library tranche"
          git push \
            --force-with-lease=refs/heads/agent/specialist-rule-library-tranche-a12:${START_SHA} \
            origin HEAD:refs/heads/agent/specialist-rule-library-tranche-a12
