name: Apply PR30 Context Contract Tests

on:
  push:
    branches:
      - agent-clinical-evaluation-context

permissions:
  contents: write

concurrency:
  group: apply-pr30-context-tests
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply focused test corrections
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/pr30-contract-tests.patch
          git apply .github/pr30-contract-tests.patch
          rm -f .github/pr30-contract-tests.patch
          rm -f .github/workflows/apply-pr30-contract-tests.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'align tests with evaluation context contract'
          git push origin HEAD:${GITHUB_REF_NAME}
