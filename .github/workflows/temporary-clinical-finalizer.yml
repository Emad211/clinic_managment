name: Temporary Guarded Clinical Finalizer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temporary-clinical-finalizer
  cancel-in-progress: false

jobs:
  finalize-step6:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 34 &&
      github.event.comment.user.login == 'Emad211' &&
      github.event.comment.body == '/finalize-step6-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Report gate start
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: >-
          gh api --method POST repos/${REPOSITORY}/issues/34/comments
          -f body="Step 6 targeted gate started · run ${RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: agent-clinical-operational-security
          fetch-depth: 0

      - name: Capture exact feature branch lease
        shell: bash
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply deterministic product finalizer
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python .github/finalize_step6_product.py
          git show 599ce4d52ce725c38e3b85a436e23764f6a30a36:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f \
            .github/finalize_step6_product.py \
            .github/step6-gate-result.json \
            .github/canonical-ci-step6.yml \
            .github/workflows/trigger-step6.yml
          python -m compileall -q specialist_clinic/src specialist_clinic/tests
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt

      - name: Install specialist dependencies
        id: install
        working-directory: specialist_clinic
        run: python -m pip install -r requirements.txt pytest

      - name: Run step 6 targeted safety gate
        id: specialist
        working-directory: specialist_clinic
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONIOENCODING: utf-8
        run: >-
          python -m pytest -q --tb=short
          --junitxml=pytest-step6.xml
          tests/test_operational_security_release_gate.py
          tests/test_operational_security_hardening.py
          tests/test_backup_and_logging.py
          tests/test_clinical_closed_care_loop.py
          tests/test_clinical_engine_v2_action_contract.py
          tests/test_clinical_engine_v2_activation.py
          tests/test_clinical_engine_v2_decisions.py
          tests/test_clinical_engine_v2_followups.py
          tests/test_clinical_engine_v2_manager_ui.py
          tests/test_clinical_engine_v2_readonly_ui.py
          tests/test_clinical_engine_v2_runtime_freshness.py
          tests/test_clinical_reconciliation_engine_identity.py
          tests/test_end_to_end_loops.py
          tests/test_patient_mutation_ownership.py
          tests/test_ui_information_architecture.py

      - name: Run accounting regression suite
        id: accounting
        working-directory: webapp
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests -q --tb=short --junitxml=pytest-accounting-step6.xml

      - name: Commit exact tested product tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'complete clinical operational security hardening'
          git push \
            --force-with-lease=refs/heads/agent-clinical-operational-security:${START_SHA} \
            origin HEAD:refs/heads/agent-clinical-operational-security

      - name: Report gate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          APPLY: ${{ steps.apply.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          SPECIALIST: ${{ steps.specialist.outcome }}
          ACCOUNTING: ${{ steps.accounting.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          body="Step 6 targeted gate finished · run ${RUN_ID}\n\napply=${APPLY}\ninstall=${INSTALL}\nspecialist=${SPECIALIST}\naccounting=${ACCOUNTING}\npublish=${PUBLISH}"
          gh api --method POST repos/${REPOSITORY}/issues/34/comments -f body="$body"
