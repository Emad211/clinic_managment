name: Specialist Clinic Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "specialist-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: specialist_clinic
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            specialist_clinic/requirements.lock
            specialist_clinic/requirements-build.lock

      - name: Install locked build dependencies
        run: python -m pip install -r requirements-build.lock

      - name: Run regression suite
        run: python -m pytest tests -q --tb=short

      - name: Run source self-test
        run: python start.py self-test

      - name: Build frozen executable
        run: pyinstaller --noconfirm --clean SpecialistClinic.spec

      - name: Run frozen self-test
        run: .\dist\SpecialistClinic.exe self-test

      - name: Package and hash
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Compress-Archive -LiteralPath dist\SpecialistClinic.exe `
            -DestinationPath release\SpecialistClinic-win-x64.zip
          $hash = (Get-FileHash release\SpecialistClinic-win-x64.zip `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath release\SpecialistClinic-win-x64.zip.sha256 `
            -Encoding ascii -NoNewline `
            -Value "$hash  SpecialistClinic-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SpecialistClinic-win-x64
          path: |
            specialist_clinic/release/SpecialistClinic-win-x64.zip
            specialist_clinic/release/SpecialistClinic-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
