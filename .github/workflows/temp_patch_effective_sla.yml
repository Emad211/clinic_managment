name: Temporary effective SLA read-time repair

on:
  push:
    branches:
      - fix/foux-sla-filter-vocabulary

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foux-sla-filter-vocabulary
          fetch-depth: 0
      - name: Derive time-sensitive SLA at read time
        shell: python
        run: |
          from pathlib import Path

          path = Path(
              "specialist_clinic/src/services/followup_orchestration/read_model_service.py"
          )
          text = path.read_text(encoding="utf-8")

          import_marker = '''from src.adapters.sqlite.followup_projection_schema import (\n    PROJECTION_REQUIRED_COLUMNS,\n)\n'''
          import_replacement = import_marker + '''from src.common.utils import iran_now\n'''
          if import_marker not in text:
              raise SystemExit("projection schema import marker not found")
          text = text.replace(import_marker, import_replacement, 1)

          allowed_marker = '''_ALLOWED_SLA = frozenset(SLA_LABELS)\n'''
          sql_block = '''_EFFECTIVE_SLA_SQL = """\nCASE\n  WHEN projection.state_class='TERMINAL' THEN 'TERMINAL'\n  WHEN projection.state_class='BLOCKED' THEN 'BLOCKED'\n  WHEN projection.state_class='WAITING' THEN 'WAITING'\n  WHEN projection.action_due_at IS NULL THEN 'DUE_UNKNOWN'\n  WHEN datetime(projection.action_due_at) < datetime(?) THEN 'OVERDUE'\n  WHEN date(projection.action_due_at) = date(?) THEN 'DUE_TODAY'\n  ELSE 'FUTURE'\nEND\n"""\n'''
          if allowed_marker not in text:
              raise SystemExit("SLA allowlist marker not found")
          text = text.replace(allowed_marker, allowed_marker + sql_block, 1)

          datetime_marker = '''def _masked_national_id(value: object) -> str:\n'''
          helper = '''def _effective_sla_state(\n    state_class: object, action_due_at: object, now: datetime\n) -> str:\n    state = str(state_class or "").strip().upper()\n    if state == "TERMINAL":\n        return "TERMINAL"\n    if state == "BLOCKED":\n        return "BLOCKED"\n    if state == "WAITING":\n        return "WAITING"\n\n    due_at = _as_datetime(action_due_at)\n    if due_at is None:\n        return "DUE_UNKNOWN"\n    compare_now = now\n    if due_at.tzinfo and compare_now.tzinfo is None:\n        compare_now = compare_now.replace(tzinfo=due_at.tzinfo)\n    if due_at.tzinfo is None and compare_now.tzinfo:\n        due_at = due_at.replace(tzinfo=compare_now.tzinfo)\n    if due_at < compare_now:\n        return "OVERDUE"\n    if due_at.date() == compare_now.date():\n        return "DUE_TODAY"\n    return "FUTURE"\n\n\n'''
          if datetime_marker not in text:
              raise SystemExit("masked ID marker not found")
          text = text.replace(datetime_marker, helper + datetime_marker, 1)

          decorate_marker = '''        item.update(\n            {\n'''
          decorate_replacement = '''        effective_sla = _effective_sla_state(\n            item.get("state_class"), item.get("action_due_at"), now\n        )\n        item["sla_state"] = effective_sla\n        item.update(\n            {\n'''
          if decorate_marker not in text:
              raise SystemExit("decorate update marker not found")
          text = text.replace(decorate_marker, decorate_replacement, 1)

          current_old = '''        current = now or datetime.now().replace(microsecond=0)\n'''
          current_new = '''        current = now or iran_now().replace(microsecond=0)\n'''
          if text.count(current_old) < 1:
              raise SystemExit("list current-time marker not found")
          text = text.replace(current_old, current_new, 1)

          filter_old = '''        if filters["sla"]:\n            clauses.append("projection.sla_state=?")\n            params.append(filters["sla"])\n'''
          filter_new = '''        if filters["sla"]:\n            current_text = current.isoformat(sep=" ", timespec="seconds")\n            clauses.append(f"({_EFFECTIVE_SLA_SQL})=?")\n            params.extend((current_text, current_text, filters["sla"]))\n'''
          if filter_old not in text:
              raise SystemExit("persisted SLA filter block not found")
          text = text.replace(filter_old, filter_new, 1)

          detail_old = '''                now=now or datetime.now().replace(microsecond=0),\n'''
          detail_new = '''                now=now or iran_now().replace(microsecond=0),\n'''
          if detail_old not in text:
              raise SystemExit("detail current-time marker not found")
          text = text.replace(detail_old, detail_new, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path(
              "specialist_clinic/tests/test_followup_orchestration_fo4_sla.py"
          )
          source = test_path.read_text(encoding="utf-8")
          import_marker = '''from pathlib import Path\n'''
          import_replacement = '''from pathlib import Path\nimport importlib.util\nimport sys\n'''
          if import_marker not in source:
              raise SystemExit("SLA test import marker not found")
          source = source.replace(import_marker, import_replacement, 1)

          append = '''\n\ndef _fo3_fixture_module():\n    path = Path(__file__).with_name("test_followup_orchestration_fo3.py")\n    spec = importlib.util.spec_from_file_location(\n        "fo3_fixture_module_for_effective_sla", path\n    )\n    assert spec and spec.loader\n    module = importlib.util.module_from_spec(spec)\n    sys.modules[spec.name] = module\n    spec.loader.exec_module(module)\n    return module\n\n\ndef test_overdue_filter_uses_request_time_not_stale_persisted_state():\n    module = _fo3_fixture_module()\n    db = module._db()\n    row = db.execute(\n        """SELECT episode_id FROM followup_work_item_projection\n           WHERE state_class='ACTION_REQUIRED' ORDER BY episode_id LIMIT 1"""\n    ).fetchone()\n    assert row\n    episode_id = str(row[0])\n    db.execute(\n        """UPDATE followup_work_item_projection\n           SET action_due_at='2026-08-03 11:00:00', sla_state='FUTURE'\n           WHERE episode_id=?""",\n        (episode_id,),\n    )\n    db.commit()\n\n    service = FollowupUnifiedReadModelService(db)\n    overdue = service.list_items(\n        sla_state="OVERDUE", now=datetime(2026, 8, 3, 12, 30, 0)\n    )\n    assert overdue["total"] >= 1\n    selected = next(\n        item for item in overdue["items"] if item["episode_id"] == episode_id\n    )\n    assert selected["sla_state"] == "OVERDUE"\n    assert selected["sla_label"] == "موعدگذشته"\n    assert selected["is_overdue"] is True\n\n    future = service.list_items(\n        sla_state="FUTURE", now=datetime(2026, 8, 3, 12, 30, 0), per_page=50\n    )\n    assert episode_id not in {item["episode_id"] for item in future["items"]}\n'''
          if "test_overdue_filter_uses_request_time_not_stale_persisted_state" in source:
              raise SystemExit("effective SLA regression already present")
          test_path.write_text(source + append, encoding="utf-8")

          Path(".github/workflows/temp_patch_effective_sla.yml").unlink()
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specialist_clinic/src/services/followup_orchestration/read_model_service.py \
                  specialist_clinic/tests/test_followup_orchestration_fo4_sla.py \
                  .github/workflows/temp_patch_effective_sla.yml
          git commit -m "fix(fo4): derive effective SLA state at read time"
          git push origin HEAD:fix/foux-sla-filter-vocabulary
