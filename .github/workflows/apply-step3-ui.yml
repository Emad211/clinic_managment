name: Apply Step3 Patient UI Retirement

on:
  push:
    branches:
      - agent-clinical-parallel-logic-consolidation

permissions:
  contents: write

concurrency:
  group: apply-step3-patient-ui
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply reviewed UI consolidation
        run: |
          set -euo pipefail
          python .github/apply_step3_ui.py
          rm -f .github/apply_step3_ui.py
          rm -f .github/workflows/apply-step3-ui.yml
          git add -A
          git diff --cached --check
          python -m compileall -q specialist_clinic/src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'remove parallel targets and dosing guidance from patient UI'
          git push origin HEAD:${GITHUB_REF_NAME}
