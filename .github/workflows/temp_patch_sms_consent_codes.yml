name: Temporary SMS consent provenance patch

on:
  push:
    branches:
      - fix/sms-consent-ux-clarity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sms-consent-ux-clarity
          fetch-depth: 0
      - name: Add current and legacy provenance labels
        shell: python
        run: |
          from pathlib import Path

          path = Path("specialist_clinic/src/services/sms/governance_service.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '        "LEGACY_CARE_RELATIONSHIP": "رابطهٔ مراقبتی موجود با درمانگاه",\n',
              '        "LEGACY_CARE_RELATIONSHIP": "رابطهٔ مراقبتی موجود با درمانگاه",\n        "CARE_RELATIONSHIP_DEFAULT": "رابطهٔ مراقبتی موجود با درمانگاه",\n',
          )
          text = text.replace(
              '        "LEGACY_NO_MARKETING_OPT_IN": "رضایت تبلیغاتی صریح ثبت نشده است",\n',
              '        "LEGACY_NO_MARKETING_OPT_IN": "رضایت تبلیغاتی صریح ثبت نشده است",\n        "NO_MARKETING_OPT_IN": "رضایت تبلیغاتی صریح ثبت نشده است",\n        "LEGACY_GLOBAL_OPT_OUT": "انصراف کلی ثبت‌شده در پروندهٔ قبلی",\n',
          )
          text = text.replace(
              '        "LEGACY_CARE_RELATIONSHIP": "رابطهٔ مراقبتی موجود",\n',
              '        "LEGACY_CARE_RELATIONSHIP": "رابطهٔ مراقبتی موجود",\n        "CARE_RELATIONSHIP_DEFAULT": "رابطهٔ مراقبتی موجود",\n',
          )
          text = text.replace(
              '        "LEGACY_NO_MARKETING_OPT_IN": "نبود رضایت صریح تبلیغاتی",\n',
              '        "LEGACY_NO_MARKETING_OPT_IN": "نبود رضایت صریح تبلیغاتی",\n        "NO_MARKETING_OPT_IN": "نبود رضایت صریح تبلیغاتی",\n        "LEGACY_GLOBAL_OPT_OUT": "انصراف کلی قبلی",\n',
          )
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/temp_patch_sms_consent_codes.yml").unlink()
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specialist_clinic/src/services/sms/governance_service.py .github/workflows/temp_patch_sms_consent_codes.yml
          git commit -m "fix(sms): map canonical consent provenance to plain language"
          git push origin HEAD:fix/sms-consent-ux-clarity
