name: Specialist A15 Release Readiness Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: specialist-a15-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-linux-gate:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'agent/specialist-release-readiness-a15'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/specialist-release-readiness-a15
          fetch-depth: 0

      - name: Capture branch lease
        shell: bash
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            specialist_clinic/requirements.txt
            webapp/requirements.txt

      - name: Apply deterministic A15 finalizer
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/finalize_a15.py
          python .github/finalize_a15.py
          python -m compileall -q specialist_clinic/src specialist_clinic/tests
          git diff --check

      - name: Install specialist dependencies
        working-directory: specialist_clinic
        run: python -m pip install -r requirements.txt pytest

      - name: Run source self-test
        working-directory: specialist_clinic
        run: python start.py self-test

      - name: Run complete specialist suite
        working-directory: specialist_clinic
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONIOENCODING: utf-8
        run: >-
          python -m pytest tests -q --tb=short
          --junitxml=pytest-specialist-a15.xml

      - name: Install accounting dependencies
        working-directory: webapp
        run: python -m pip install -r requirements.txt

      - name: Run complete accounting suite
        working-directory: webapp
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONIOENCODING: utf-8
        run: >-
          python -m pytest tests -q --tb=short
          --junitxml=pytest-accounting-a15.xml

      - name: Upload Linux A15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-a15-linux-evidence
          path: |
            specialist_clinic/pytest-specialist-a15.xml
            webapp/pytest-accounting-a15.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Publish clean exact-tested product tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- webapp/src
          find specialist_clinic -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f specialist_clinic/pytest-specialist-a15.xml
          rm -f webapp/pytest-accounting-a15.xml
          rm -f .github/finalize_a15.py
          rm -f .github/workflows/specialist-a15-gate.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "complete specialist release readiness"
          git push \
            --force-with-lease=refs/heads/agent/specialist-release-readiness-a15:${START_SHA} \
            origin HEAD:refs/heads/agent/specialist-release-readiness-a15
