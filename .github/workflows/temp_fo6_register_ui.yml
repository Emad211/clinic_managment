name: Temporary FO-6 manager surface registration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp_fo6_register_ui.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foux-v1-fo6-governed-sms
      - name: Register blueprint and navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('specialist_clinic/src/app.py')
          text = app.read_text(encoding='utf-8')
          import_marker = '    from src.api.sms import bp as sms_bp\n'
          import_line = (
              '    from src.api.sms_auto_guard import bp as sms_auto_guard_bp\n'
          )
          if import_line not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit('sms blueprint import marker not found')
              text = text.replace(
                  import_marker,
                  import_marker + import_line,
                  1,
              )
          tuple_marker = '        sms_bp,\n        manager_bp,\n'
          tuple_value = '        sms_bp,\n        sms_auto_guard_bp,\n        manager_bp,\n'
          if '        sms_auto_guard_bp,\n' not in text:
              if text.count(tuple_marker) != 1:
                  raise SystemExit('sms blueprint tuple marker not found')
              text = text.replace(tuple_marker, tuple_value, 1)
          app.write_text(text, encoding='utf-8')

          campaigns = Path(
              'specialist_clinic/src/templates/sms/campaigns.html'
          )
          text = campaigns.read_text(encoding='utf-8')
          old = '''    <div>
        <h1><svg class="icon icon-lg"><use href="#i-megaphone"></use></svg> کمپین‌های پیامکی</h1>
        <p class="page-intro">کمپین را به‌صورت پیش‌نویس بسازید، گیرندگان را بررسی کنید و سپس ارسال و تحویل را از جزئیات همان کمپین دنبال کنید.</p>
    </div>
</div>
'''
          new = '''    <div>
        <h1><svg class="icon icon-lg"><use href="#i-megaphone"></use></svg> کمپین‌های پیامکی</h1>
        <p class="page-intro">کمپین را به‌صورت پیش‌نویس بسازید، گیرندگان را بررسی کنید و سپس ارسال و تحویل را از جزئیات همان کمپین دنبال کنید.</p>
    </div>
    {% if permissions['sms.approval.review'] %}
    <a class="btn btn-secondary" href="{{ url_for('sms_auto_guard.index') }}">
        <svg class="icon"><use href="#i-shield"></use></svg>
        ارسال محافظت‌شدهٔ CARE
    </a>
    {% endif %}
</div>
'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('campaign navigation marker not found')
              text = text.replace(old, new, 1)
          campaigns.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_fo6_register_ui.yml
          git add specialist_clinic/src/app.py specialist_clinic/src/templates/sms/campaigns.html
          git commit -m "feat(foux): register FO-6 manager control surface"
          git push origin HEAD:feature/foux-v1-fo6-governed-sms
