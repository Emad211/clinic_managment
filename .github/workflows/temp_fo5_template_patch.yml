name: Temporary FO-5 template integration

on:
  push:
    branches:
      - feature/foux-v1-fo5-structured-contact
    paths:
      - .github/workflows/temp_fo5_template_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foux-v1-fo5-structured-contact
      - name: Insert bounded FO-5 partials
        run: |
          python - <<'PY'
          from pathlib import Path

          detail = Path('specialist_clinic/src/templates/followups/unified_detail.html')
          text = detail.read_text(encoding='utf-8')
          include = '{% include "followups/_structured_contact_detail.html" %}\n\n'
          marker = '<section class="card">\n    <div class="section-title">\n        <svg class="icon"><use href="#i-calendar"></use></svg>'
          if include not in text:
              if marker not in text:
                  raise SystemExit('detail insertion marker not found')
              text = text.replace(marker, include + marker, 1)
          detail.write_text(text, encoding='utf-8')

          worklist = Path('specialist_clinic/src/templates/followups/unified_worklist.html')
          text = worklist.read_text(encoding='utf-8')
          include = '                        {% include "followups/_structured_contact_list.html" %}\n'
          marker = "                        <div class=\"muted text-xs\">آخرین وضعیت منبع: {{ item.last_source_event_at|jalali if item.last_source_event_at else 'نامشخص' }}</div>\n"
          if include not in text:
              if marker not in text:
                  raise SystemExit('list insertion marker not found')
              text = text.replace(marker, marker + include, 1)
          worklist.write_text(text, encoding='utf-8')
          PY
      - name: Commit template integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_fo5_template_patch.yml
          git add specialist_clinic/src/templates/followups
          git commit -m "feat(foux): integrate structured contact panels"
          git push origin HEAD:feature/foux-v1-fo5-structured-contact
