name: Apply PR29 Test Harness Correction

on:
  push:
    branches:
      - agent-clinical-flag-history

permissions:
  contents: write

concurrency:
  group: apply-pr29-test-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify and apply the focused correction
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/pr29-test-fix.patch
          git apply .github/pr29-test-fix.patch
          rm -f .github/pr29-test-fix.patch
          rm -f .github/workflows/apply-pr29-test-fix.yml
          git add -A
          git diff --cached --check

      - name: Commit the corrected regression test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'stabilize orphan flag migration regression test'
          git push origin HEAD:${GITHUB_REF_NAME}
