name: Temporary FO-4 SLA vocabulary alignment

on:
  push:
    branches:
      - fix/foux-sla-filter-vocabulary

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foux-sla-filter-vocabulary
          fetch-depth: 0
      - name: Align policy, filter and visible due state
        shell: python
        run: |
          from pathlib import Path

          read_model = Path(
              "specialist_clinic/src/services/followup_orchestration/read_model_service.py"
          )
          text = read_model.read_text(encoding="utf-8")
          role_block = '''ROLE_LABELS = {\n    "RECEPTION": "صف پیشنهادی پذیرش",\n    "NURSING": "صف پیشنهادی پرستاری",\n    "PHYSICIAN": "نیازمند بررسی پزشک",\n    "MANAGER": "نیازمند بررسی مدیر عملیات",\n}\n'''
          sla_block = '''SLA_LABELS = {\n    "FUTURE": "در مهلت آینده",\n    "DUE_TODAY": "موعد امروز",\n    "OVERDUE": "موعدگذشته",\n    "DUE_UNKNOWN": "موعد نامشخص",\n    "WAITING": "در انتظار رویداد بعدی",\n    "BLOCKED": "مسدود",\n    "TERMINAL": "پایان‌یافته",\n}\n'''
          if role_block not in text:
              raise SystemExit("role label block not found")
          text = text.replace(role_block, role_block + sla_block, 1)
          old_allowed = '''_ALLOWED_SLA = frozenset({"ON_TIME", "DUE_SOON", "OVERDUE", "BLOCKED", "NONE"})'''
          if old_allowed not in text:
              raise SystemExit("legacy SLA allowlist not found")
          text = text.replace(old_allowed, "_ALLOWED_SLA = frozenset(SLA_LABELS)", 1)
          state_label = '''                "state_label": STATE_LABELS.get(\n                    str(item.get("state_class") or ""), "وضعیت نامشخص"\n                ),\n'''
          sla_labels = state_label + '''                "sla_label": SLA_LABELS.get(\n                    str(item.get("sla_state") or ""), "وضعیت موعد نامشخص"\n                ),\n                "sla_tone": (\n                    "danger"\n                    if item.get("sla_state") in {"OVERDUE", "BLOCKED"}\n                    else "warn"\n                    if item.get("sla_state") in {"DUE_TODAY", "DUE_UNKNOWN"}\n                    else "info"\n                    if item.get("sla_state") in {"FUTURE", "WAITING"}\n                    else "muted"\n                ),\n'''
          if state_label not in text:
              raise SystemExit("state decoration not found")
          text = text.replace(state_label, sla_labels, 1)
          export_marker = '''    "ROLE_LABELS",\n    "STATE_LABELS",\n'''
          if export_marker in text:
              text = text.replace(
                  export_marker,
                  '''    "ROLE_LABELS",\n    "SLA_LABELS",\n    "STATE_LABELS",\n''',
                  1,
              )
          read_model.write_text(text, encoding="utf-8")

          api = Path("specialist_clinic/src/api/unified_followups.py")
          text = api.read_text(encoding="utf-8")
          import_old = '''    READINESS_COPY,\n    ROLE_LABELS,\n    STATE_LABELS,\n'''
          import_new = '''    READINESS_COPY,\n    ROLE_LABELS,\n    SLA_LABELS,\n    STATE_LABELS,\n'''
          if import_old not in text:
              raise SystemExit("read model import block not found")
          text = text.replace(import_old, import_new, 1)
          map_old = '''        sla_labels={\n            "ON_TIME": "در مهلت",\n            "DUE_SOON": "نزدیک موعد",\n            "OVERDUE": "موعدگذشته",\n            "BLOCKED": "مسدود",\n            "NONE": "بدون SLA",\n        },\n'''
          if map_old not in text:
              raise SystemExit("legacy SLA template map not found")
          text = text.replace(map_old, "        sla_labels=SLA_LABELS,\n", 1)
          api.write_text(text, encoding="utf-8")

          template = Path(
              "specialist_clinic/src/templates/followups/unified_worklist.html"
          )
          text = template.read_text(encoding="utf-8")
          overdue = '''                        {% if item.is_overdue %}<span class="badge badge-danger">موعدگذشته</span>{% endif %}\n'''
          replacement = '''                        <span class="badge badge-{{ item.sla_tone }}">{{ item.sla_label }}</span>\n'''
          if overdue not in text:
              raise SystemExit("overdue badge not found")
          template.write_text(text.replace(overdue, replacement, 1), encoding="utf-8")

          Path(".github/workflows/temp_patch_fo4_sla_vocab.yml").unlink()
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specialist_clinic/src/services/followup_orchestration/read_model_service.py \
                  specialist_clinic/src/api/unified_followups.py \
                  specialist_clinic/src/templates/followups/unified_worklist.html \
                  .github/workflows/temp_patch_fo4_sla_vocab.yml
          git commit -m "fix(fo4): align due filters with canonical SLA states"
          git push origin HEAD:fix/foux-sla-filter-vocabulary
