name: Apply Final Clinical Logic Consolidation

on:
  push:
    branches:
      - agent-clinical-parallel-logic-consolidation

permissions:
  contents: write

concurrency:
  group: apply-final-step3
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decode verified foundation files
        shell: bash
        run: |
          set -euo pipefail
          python .github/step3-batch/decode_one.py \
            .github/step3-batch/analytics_service.py.b64 \
            specialist_clinic/src/services/analytics_service.py plain
          python .github/step3-batch/decode_one.py \
            .github/step3-batch/patients.py.gz.b64 \
            specialist_clinic/src/api/patients.py gzip
          python .github/step3-batch/decode_one.py \
            .github/step3-batch/test_canonical_consistency.py.gz.b64 \
            specialist_clinic/tests/test_canonical_consistency.py gzip
          python .github/step3-batch/decode_one.py \
            .github/step3-batch/test_parallel_clinical_logic_retired.py.gz.b64 \
            specialist_clinic/tests/test_parallel_clinical_logic_retired.py gzip

      - name: Reassemble, verify and apply final patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/final-step3-inc/part-* | tr -d '\r\n\t ' \
            > /tmp/final-step3.patch.gz.b64
          base64 --decode /tmp/final-step3.patch.gz.b64 \
            | gzip --decompress > /tmp/final-step3.patch
          echo 'f777d9fa42fae4547a18998e283bc060ade54d488316324bccec19965d92a0c9  /tmp/final-step3.patch' \
            | sha256sum --check
          git apply --check /tmp/final-step3.patch
          git apply /tmp/final-step3.patch

      - name: Restore canonical repository tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/step3-batch/ci.yml /tmp/canonical-ci.yml
          rm -rf \
            .github/step3-batch \
            .github/step3-full \
            .github/final-step3 \
            .github/final-step3-inc
          rm -f \
            .github/workflows/apply-step3-descriptive-batch.yml \
            .github/workflows/apply-final-step3.yml
          mv /tmp/canonical-ci.yml .github/workflows/ci.yml
          python -m compileall -q specialist_clinic/src specialist_clinic/tests
          git add -A
          git diff --cached --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt

      - name: Install Specialist Clinic test dependencies
        working-directory: specialist_clinic
        run: python -m pip install -r requirements.txt pytest

      - name: Run minimum clinical-safety consolidation gate
        working-directory: specialist_clinic
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONIOENCODING: utf-8
        run: >-
          python -m pytest -q --tb=short
          tests/test_parallel_clinical_logic_retired.py
          tests/test_administrative_surfaces_descriptive_only.py
          tests/test_public_card_descriptive_only.py
          tests/test_patient_card.py
          tests/test_canonical_consistency.py
          tests/test_patient_cockpit_service.py
          tests/test_clinical_engine_v2_manager_ui.py
          tests/test_visit_invites.py::TestFAutomaticEngagementRegression::test_high_reading_does_not_create_administrative_event
          tests/test_visit_invites.py::TestFAutomaticEngagementRegression::test_high_reading_does_not_create_admin_worklist_or_sms

      - name: Commit and push clean product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'consolidate parallel clinical logic into governed v2'
          git push origin HEAD:${GITHUB_REF_NAME}
