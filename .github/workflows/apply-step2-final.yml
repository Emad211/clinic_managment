name: Apply Final Evaluation Context Patch

on:
  push:
    branches:
      - agent-clinical-evaluation-context

permissions:
  contents: write

concurrency:
  group: apply-step2-final
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reassemble and verify the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/step2-final/part-* | tr -d '\r\n' \
            > /tmp/step2-final.patch.gz.b64
          base64 --decode /tmp/step2-final.patch.gz.b64 \
            | gzip --decompress > /tmp/step2-final.patch
          echo '8b805d99b57ff894642272f307885abdfd97d86b5564018536f0829540606087  /tmp/step2-final.patch' \
            | sha256sum -c -
          git apply --check /tmp/step2-final.patch

      - name: Apply product changes and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/step2-final.patch
          rm -rf .github/step2-final .github/context-final
          rm -f .github/context-final.patch.gz.b64
          rm -f .github/workflows/context-source-snapshot.yml
          rm -f .github/workflows/apply-context-final.yml
          rm -f .github/workflows/apply-step2-final.yml
          git add -A
          git diff --cached --check
          python -m compileall -q specialist_clinic/src specialist_clinic/tests

      - name: Commit the clean evaluation-context implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'complete explicit clinical evaluation context'
          git push origin HEAD:${GITHUB_REF_NAME}
