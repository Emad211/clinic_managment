name: Temporary FO-4 batch ownership patch

on:
  push:
    branches:
      - feature/foux-v1-fo4-ownership

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foux-v1-fo4-ownership
          fetch-depth: 0
      - name: Batch ownership reads and harden fixtures
        shell: python
        run: |
          from pathlib import Path

          service_path = Path("specialist_clinic/src/services/followup_orchestration/ownership_service.py")
          text = service_path.read_text(encoding="utf-8")
          start = text.index("    def state(self, episode_id: str) -> OwnershipState:\n")
          end = text.index("    @staticmethod\n    def _permissions", start)
          replacement = '''    def state(self, episode_id: str) -> OwnershipState:\n        states = self.states([str(episode_id)])\n        try:\n            return states[str(episode_id)]\n        except KeyError as exc:\n            raise FollowupOwnershipError(\n                "OWNERSHIP_PROJECTION_UNAVAILABLE",\n                "این مسیر در نمای جاری موجود نیست؛ ابتدا نمای یکپارچه را بازسازی کنید.",\n            ) from exc\n\n    def states(self, episode_ids: Iterable[str]) -> dict[str, OwnershipState]:\n        ids = list(dict.fromkeys(str(value) for value in episode_ids if str(value)))\n        if not ids:\n            return {}\n        placeholders = ",".join("?" for _ in ids)\n        projections = self.db.execute(\n            f"""SELECT episode_id, owner_role_proposal\n                FROM followup_work_item_projection\n                WHERE episode_id IN ({placeholders})""",\n            ids,\n        ).fetchall()\n        role_by_episode = {\n            str(row["episode_id"]): (\n                str(row["owner_role_proposal"] or "").strip() or None\n            )\n            for row in projections\n        }\n        missing = [episode_id for episode_id in ids if episode_id not in role_by_episode]\n        if missing:\n            raise FollowupOwnershipError(\n                "OWNERSHIP_PROJECTION_UNAVAILABLE",\n                "یکی از مسیرها در نمای جاری موجود نیست؛ ابتدا نمای یکپارچه را بازسازی کنید.",\n            )\n\n        working = {\n            episode_id: {\n                "owner_role": role_by_episode[episode_id],\n                "owner_user_id": None,\n                "event_id": None,\n                "event_type": None,\n            }\n            for episode_id in ids\n        }\n        events = self.db.execute(\n            f"""SELECT episode_id, id, event_type, payload_json\n                FROM followup_episode_events\n                WHERE episode_id IN ({placeholders})\n                  AND event_type IN ('ROUTED','CLAIMED','ASSIGNED')\n                ORDER BY episode_id, id""",\n            ids,\n        ).fetchall()\n        for row in events:\n            episode_id = str(row["episode_id"])\n            current = working[episode_id]\n            data = _payload(row)\n            kind = str(row["event_type"])\n            if data.get("owner_role") in ROLE_LABELS:\n                current["owner_role"] = str(data["owner_role"])\n            if kind == "ROUTED":\n                current["owner_user_id"] = None\n            elif kind in {"CLAIMED", "ASSIGNED"}:\n                action = str(data.get("action") or "").upper()\n                raw_user = data.get("owner_user_id")\n                current["owner_user_id"] = (\n                    int(raw_user)\n                    if raw_user not in (None, "") and action != "RELEASE"\n                    else None\n                )\n            current["event_id"] = int(row["id"])\n            current["event_type"] = kind\n\n        user_ids = sorted(\n            {\n                int(current["owner_user_id"])\n                for current in working.values()\n                if current["owner_user_id"] is not None\n            }\n        )\n        users = {}\n        if user_ids:\n            user_placeholders = ",".join("?" for _ in user_ids)\n            users = {\n                int(row["id"]): row\n                for row in self.db.execute(\n                    f"""SELECT id, username, full_name, role, is_active\n                        FROM users WHERE id IN ({user_placeholders})""",\n                    user_ids,\n                ).fetchall()\n            }\n\n        result: dict[str, OwnershipState] = {}\n        for episode_id, current in working.items():\n            owner_user_id = current["owner_user_id"]\n            user = users.get(int(owner_user_id)) if owner_user_id is not None else None\n            owner_name = self._user_label(user)\n            if owner_user_id is not None and not owner_name:\n                owner_name = "کاربر غیرفعال یا ناموجود"\n            result[episode_id] = OwnershipState(\n                episode_id=episode_id,\n                owner_role=current["owner_role"],\n                owner_user_id=owner_user_id,\n                owner_name=owner_name,\n                ownership_event_id=current["event_id"],\n                ownership_event_type=current["event_type"],\n            )\n        return result\n\n    def decorate_items(self, items: list[dict]) -> list[dict]:\n        states = self.states([str(item["episode_id"]) for item in items])\n        for item in items:\n            item["ownership"] = states[str(item["episode_id"])].as_dict()\n        return items\n\n'''
          text = text[:start] + replacement + text[end:]
          service_path.write_text(text, encoding="utf-8")

          test_path = Path("specialist_clinic/tests/test_followup_orchestration_fo4.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace("VALUES (?, '2026-08-04', 'manual', 'پیگیری فعال FO-4', 'open',", "VALUES (?, '2026-08-02', 'manual', 'پیگیری فعال FO-4', 'open',")
          old = '''def test_terminal_item_rejects_ownership_mutation(fo4_app):\n    from src.adapters.sqlite.core import get_db\n\n    db = get_db()\n    episode_id = _episode(db, "TERMINAL")\n    manager = _row(db, "admin")\n\n    with pytest.raises(FollowupOwnershipError) as error:\n'''
          new = '''def test_terminal_item_rejects_ownership_mutation(fo4_app):\n    from src.adapters.sqlite.core import get_db\n\n    db = get_db()\n    episode_id = _episode(db, "ACTION_REQUIRED")\n    db.execute(\n        "UPDATE followup_work_item_projection SET state_class='TERMINAL' WHERE episode_id=?",\n        (episode_id,),\n    )\n    db.commit()\n    manager = _row(db, "admin")\n\n    with pytest.raises(FollowupOwnershipError) as error:\n'''
          if old not in tests:
              raise SystemExit("terminal test block not found")
          tests = tests.replace(old, new)

          insertion = '''\n\ndef test_list_ownership_overlay_has_bounded_query_count(fo4_app):\n    from src.adapters.sqlite.core import get_db\n    from src.services.followup_orchestration.read_model_service import (\n        FollowupUnifiedReadModelService,\n    )\n\n    db = get_db()\n    model = FollowupUnifiedReadModelService(db).list_items(per_page=50)\n    statements: list[str] = []\n    db.set_trace_callback(\n        lambda sql: statements.append(sql)\n        if sql.lstrip().upper().startswith("SELECT")\n        else None\n    )\n    FollowupOwnershipService(db).decorate_items(model["items"])\n    db.set_trace_callback(None)\n    assert len(statements) <= 3\n    assert sum("followup_episode_events" in sql for sql in statements) == 1\n    assert sum("FROM users" in sql for sql in statements) <= 1\n'''
          tests += insertion
          test_path.write_text(tests, encoding="utf-8")

          Path(".github/workflows/temp_patch_fo4_batch.yml").unlink()
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specialist_clinic/src/services/followup_orchestration/ownership_service.py specialist_clinic/tests/test_followup_orchestration_fo4.py .github/workflows/temp_patch_fo4_batch.yml
          git commit -m "fix(fo4): keep ownership overlay bounded and fail closed"
          git push origin HEAD:feature/foux-v1-fo4-ownership
