              ('"AUTHORIZED_NOT_STARTED" in roadmap', '"TECHNICALLY_VALIDATED_OWNER_UX_PENDING" in roadmap'),
              ('"5.0 / 11 = 45.5%" in roadmap', '"5.8 / 11 = 52.7%" in roadmap'),
