              ('"CURRENT ISSUE = #103" in agent', '"CURRENT ISSUE = #107" in agent'),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"fo0 test missing: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

          path = Path(
              "specialist_clinic/tests/test_followup_orchestration_fo4_repair_attestation.py"
