              ('progress["current_partial_credit"] == 0.0', 'progress["current_partial_credit"] == 0.8'),
              ('progress["next_required_gate"] == "FO5_TECHNICAL_IMPLEMENTATION"', 'progress["next_required_gate"] == "FO5_OWNER_UX_ACCEPTANCE"'),
              ('stream["future_tranches"]["FO-5"] == "AUTHORIZED_NOT_STARTED"', 'stream["future_tranches"]["FO-5"] == "TECHNICALLY_VALIDATED_OWNER_UX_PENDING"'),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"roadmap test missing: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

          path = Path("specialist_clinic/tests/test_followup_orchestration_fo0.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              ('stream["plan_version"] == "1.6.0"', 'stream["plan_version"] == "1.7.0"'),
              ('"FO_5_AUTHORIZED_IMPLEMENTATION_PENDING"', '"FO_5_LOCAL_OWNER_UX_ACCEPTANCE"'),
              ('"FO_5_AUTHORIZED_NOT_STARTED" in stream["status"]', '"FO_5_TECHNICALLY_VALIDATED_OWNER_UX_PENDING" in stream["status"]'),
              ('authorization["status"] == "AUTHORIZED"', 'authorization["status"] == "VALIDATED"'),
              ('stream["next_gate"] == "FO5_IMPLEMENTATION_ISSUE_AND_PR"', 'stream["next_gate"] == "ISSUE_107_FO5_LOCAL_OWNER_UX_ACCEPTANCE_ON_94AA2C3E"'),
              ('"AUTHORIZED_IMPLEMENTATION_ONLY"', '"TECHNICALLY_VALIDATED_OWNER_UX_REVIEW_OR_FOCUSED_DEFECT_FIX_ONLY"'),
              ('"نسخه:** `1.6.0`"', '"نسخه:** `1.7.0`"'),
              ('"FO_5_AUTHORIZED_IMPLEMENTATION_PENDING" in plan', '"FO_5_TECHNICALLY_VALIDATED_OWNER_UX_PENDING" in plan'),
              ('"Issue #103" in plan', '"Issue = #105 / PR #106" in plan'),
