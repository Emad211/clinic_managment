name: Temporary FO-5 consistency repair

on:
  push:
    branches:
      - docs/foux-v1-fo5-technical-validation
    paths:
      - .github/workflows/temp_fo5_consistency_repair.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp_fo5_consistency_repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/foux-v1-fo5-technical-validation
      - name: Repair machine state and progress guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path('PROJECT_STATE.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          programs = [
              value for value in state.get('operational_programs', [])
              if value != 'FOUX_V1_FO_5_AUTHORIZED_NOT_STARTED'
          ]
          for value in (
              'FOUX_V1_FO_5_TECHNICALLY_VALIDATED_OWNER_UX_PENDING',
              'FOUX_V1_FO_6_AND_LATER_BLOCKED',
          ):
              if value not in programs:
                  programs.append(value)
          state['operational_programs'] = programs
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          test_path = Path(
              'specialist_clinic/tests/test_followup_orchestration_roadmap.py'
          )
          text = test_path.read_text(encoding='utf-8')
          old = 'assert progress["technical_implementation_percent"] == 45.5'
          new = 'assert progress["technical_implementation_percent"] == 54.5'
          if text.count(old) != 1:
              raise SystemExit(
                  'expected one stale technical implementation assertion'
              )
          test_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_fo5_consistency_repair.yml
          git add PROJECT_STATE.json specialist_clinic/tests/test_followup_orchestration_roadmap.py
          git commit -m "fix(foux): remove stale FO-5 program tag"
          git push origin HEAD:docs/foux-v1-fo5-technical-validation
