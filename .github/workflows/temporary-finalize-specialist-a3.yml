name: Temporary Finalize Specialist A3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: temporary-finalize-specialist-a3
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/specialist-alert-lifecycle-a3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/specialist-alert-lifecycle-a3
          fetch-depth: 0

      - name: Capture exact branch lease
        shell: bash
        run: |
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt

      - name: Apply deterministic A3 integration
        run: |
          python .github/finalize_a3.py
          python .github/finalize_a3_regression.py

      - name: Verify deterministic integration and accounting boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/finalize_a3.py
          test ! -e .github/finalize_a3_regression.py
          git diff --check
          git diff --quiet origin/main -- webapp

      - name: Compile specialist application
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m compileall -q specialist_clinic/src specialist_clinic/tests

      - name: Install specialist dependencies
        working-directory: specialist_clinic
        run: python -m pip install -r requirements.txt pytest

      - name: Run A3 and specialist regressions
        working-directory: specialist_clinic
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest -q --tb=short \
            --junitxml="${RUNNER_TEMP}/pytest-specialist-a3.xml" \
            tests/test_clinical_alert_lifecycle.py \
            tests/test_clinician_decision_task_gate.py \
            tests/test_clinical_task_contracts.py \
            tests/test_clinical_closed_care_loop.py \
            tests/test_clinical_engine_v2_followups.py \
            tests/test_clinical_engine_v2_decisions.py \
            tests/test_clinical_engine_v2_action_contract.py \
            tests/test_followup_unified_state.py \
            tests/test_operational_security_hardening.py \
            tests/test_clinical_validation_release_gate.py \
            tests/test_specialist_revenue_boundary.py \
            tests/test_end_to_end_loops.py \
            tests/test_sms_delivery_lifecycle.py

      - name: Verify zero accounting mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet origin/main -- webapp
          git diff --check
          if find webapp -type f \( -name '*.db-wal' -o -name '*.db-shm' \) -print -quit | grep -q .; then
            echo 'unexpected accounting sidecar generated' >&2
            exit 1
          fi

      - name: Commit exact tested A3 tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'add governed clinical alert lifecycle'
          git push \
            --force-with-lease=refs/heads/agent/specialist-alert-lifecycle-a3:${START_SHA} \
            origin HEAD:refs/heads/agent/specialist-alert-lifecycle-a3

      - name: Upload A3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-a3-release-evidence
          path: ${{ runner.temp }}/pytest-specialist-a3.xml
          if-no-files-found: ignore
