name: Temporary Finalize Specialist A7

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: temporary-finalize-specialist-a7
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/specialist-payer-adjustments-a7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/specialist-payer-adjustments-a7
          fetch-depth: 0

      - name: Capture exact branch lease
        shell: bash
        run: |
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt

      - name: Apply A7 core integration
        run: python .github/finalize_a7_core.py
      - name: Apply A7 review and legacy fixes
        run: python .github/finalize_a7_review_fixes.py
      - name: Apply A7 routes and ROI integration
        run: python .github/finalize_a7_routes_roi.py
      - name: Apply A7 regression contracts
        run: python .github/finalize_a7_regressions.py
      - name: Apply A7 deterministic test times
        run: python .github/finalize_a7_test_times.py

      - name: Verify deterministic integration and accounting boundary
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/finalize_a7_core.py \
            .github/finalize_a7_review_fixes.py \
            .github/finalize_a7_routes_roi.py \
            .github/finalize_a7_regressions.py \
            .github/finalize_a7_test_times.py; do
              test ! -e "$file"
          done
          git diff --check
          git diff --quiet origin/main -- webapp

      - name: Compile specialist application
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m compileall -q specialist_clinic/src specialist_clinic/tests

      - name: Install specialist dependencies
        working-directory: specialist_clinic
        run: python -m pip install -r requirements.txt pytest

      - name: Run A7 and specialist regressions
        working-directory: specialist_clinic
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest -q --tb=short \
            --junitxml="${RUNNER_TEMP}/pytest-specialist-a7.xml" \
            tests/test_specialist_payer_adjustments_a7.py \
            tests/test_campaign_economics_a6.py \
            tests/test_sms_governance_a5.py \
            tests/test_sms_delivery_lifecycle.py \
            tests/test_specialist_attendance_collection.py \
            tests/test_specialist_revenue_boundary.py \
            tests/test_visit_invites.py \
            tests/test_invoice_outreach.py \
            tests/test_invoice_outreach_retry.py \
            tests/test_approval_quiet_hours.py \
            tests/test_end_to_end_loops.py \
            tests/test_operational_security_hardening.py \
            tests/test_clinical_alert_lifecycle.py \
            tests/test_clinician_decision_task_gate.py \
            tests/test_clinical_task_contracts.py \
            tests/test_clinical_closed_care_loop.py \
            tests/test_followup_unified_state.py \
            tests/test_clinical_validation_release_gate.py

      - name: Verify zero accounting mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet origin/main -- webapp
          git diff --check
          if find webapp -type f \( -name '*.db-wal' -o -name '*.db-shm' \) -print -quit | grep -q .; then
            echo 'unexpected accounting sidecar generated' >&2
            exit 1
          fi

      - name: Commit exact tested A7 tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'add reviewed payer adjustments and adjusted collection'
          git push \
            --force-with-lease=refs/heads/agent/specialist-payer-adjustments-a7:${START_SHA} \
            origin HEAD:refs/heads/agent/specialist-payer-adjustments-a7

      - name: Upload A7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialist-a7-release-evidence
          path: ${{ runner.temp }}/pytest-specialist-a7.xml
          if-no-files-found: ignore
