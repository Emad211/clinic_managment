    assert sla["read_time_write"] is False

    authorization = stream["fo5_authorization"]
    assert authorization["tracking_issue"] == 103
    assert authorization["governance_pr"] == 104
    assert authorization["scope"] == "STRUCTURED_CONTACT_RETRY_ESCALATION_ONLY"
    assert authorization["feature_flag"] == "FOLLOWUP_STRUCTURED_CONTACT"
    assert authorization["default_enabled"] is False
    assert authorization["status"] == "AUTHORIZED"
    assert stream["fo5_allowed"] is True
    assert stream["fo6_allowed"] is False
    assert stream["next_gate"] == "FO5_IMPLEMENTATION_ISSUE_AND_PR"
    assert stream["feature_flags"] == {name: False for name in EXPECTED_FLAGS}
    assert state["global_freeze"]["followup_orchestration_fo5"].startswith(
        "AUTHORIZED_IMPLEMENTATION_ONLY"
    )
    assert state["global_freeze"]["followup_orchestration_fo6_and_later"].startswith(
        "BLOCKED"
    )


