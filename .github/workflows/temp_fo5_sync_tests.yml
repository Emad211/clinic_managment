name: Temporary FO-5 authorization guard sync

on:
  push:
    branches:
      - docs/foux-v1-fo5-authorization
    paths:
      - .github/workflows/temp_fo5_sync_tests.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/foux-v1-fo5-authorization
      - name: Update governance guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          tests = Path('specialist_clinic/tests')

          fo0 = tests / 'test_followup_orchestration_fo0.py'
          text = fo0.read_text(encoding='utf-8')
          start = text.index('def test_project_state_attests_fo4_and_blocks_fo5_pending_owner_review():')
          end = text.index('\ndef test_read_only_baseline_capture_remains_non_mutating_and_phi_free', start)
          replacement = '''def test_project_state_attests_fo4_acceptance_and_authorizes_bounded_fo5():
