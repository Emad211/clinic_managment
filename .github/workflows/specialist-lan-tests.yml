name: Specialist LAN tests

on:
  pull_request:
    branches: [main]
    paths:
      - "specialist_clinic/**"
      - "run_clinic_lan.bat"
      - ".github/workflows/specialist-lan-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specialist-lan:
    name: "specialist LAN (pytest)"
    runs-on: ubuntu-latest

    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt

      - name: Install dependencies
        run: pip install -r specialist_clinic/requirements.txt pytest

      - name: Run LAN access tests
        working-directory: specialist_clinic
        run: python -m pytest tests/test_network_access.py -q --tb=short
