name: Temporary Finalize Clinical Step 7

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: temporary-finalize-clinical-step7
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.issue.number == 39 &&
      github.event.comment.user.login == 'Emad211' &&
      github.event.comment.body == '/finalize-clinical-step7-20260725'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-clinical-validation-release-gate
          fetch-depth: 0

      - name: Capture branch lease
        shell: bash
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt

      - name: Apply deterministic final product tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          target = Path('.github/finalize_step7.py')
          text = target.read_text(encoding='utf-8')
          text = text.replace('{{ loop.index + 1|fa_num }}', '{{ (loop.index + 1)|fa_num }}')
          target.write_text(text, encoding='utf-8')
          PY
          python .github/finalize_step7.py
          python .github/fix_step7_regressions.py
          python -m compileall -q specialist_clinic/src specialist_clinic/tests specialist_clinic/run_step7_review.py
          git diff --check

      - name: Install dependencies
        working-directory: specialist_clinic
        run: python -m pip install -r requirements.txt pytest

      - name: Run focused clinical release gate
        working-directory: specialist_clinic
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest -q --tb=short \
            --junitxml=pytest-step7-final.xml \
            tests/test_clinical_validation_release_gate.py \
            tests/test_clinical_validation_ui.py \
            tests/test_clinical_engine_v2_activation.py \
            tests/test_clinical_engine_v2_manager_ui.py \
            tests/test_clinical_engine_v2_runtime_freshness.py \
            tests/test_operational_security_release_gate.py \
            tests/test_operational_security_hardening.py

      - name: Run accounting regression suite
        working-directory: webapp
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests -q --tb=short --junitxml=pytest-accounting-step7.xml

      - name: Commit exact tested product tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'complete clinical validation release gate'
          git push \
            --force-with-lease=refs/heads/agent-clinical-validation-release-gate:${START_SHA} \
            origin HEAD:refs/heads/agent-clinical-validation-release-gate

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinical-step7-release-evidence
          path: |
            specialist_clinic/pytest-step7-final.xml
            webapp/pytest-accounting-step7.xml
          if-no-files-found: ignore

      - name: Report outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          gh api --method POST repos/${REPOSITORY}/issues/39/comments \
            -f body="Step 7 finalizer run ${RUN_ID}: ${STATUS}"
