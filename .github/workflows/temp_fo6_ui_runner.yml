name: Temporary FO-6 UI runner

on:
  push:
    branches:
      - feature/foux-v1-fo6-governed-sms
    paths:
      - .github/workflows/temp_fo6_ui_runner.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp_fo6_ui_runner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/foux-v1-fo6-governed-sms
      - name: Apply final FO-6 hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path('specialist_clinic/src/adapters/sqlite/sms_auto_guard_schema.py')
          text = schema.read_text(encoding='utf-8')
          policy_block = '    UNIQUE(policy_key, version),\n    UNIQUE(policy_key, content_hash)\n'
          template_block = '    UNIQUE(event_key, version),\n    UNIQUE(event_key, content_hash)\n'
          if policy_block not in text or template_block not in text:
              raise SystemExit('expected historical hash uniqueness blocks not found')
          text = text.replace(policy_block, '    UNIQUE(policy_key, version)\n', 1)
          text = text.replace(template_block, '    UNIQUE(event_key, version)\n', 1)
          schema.write_text(text, encoding='utf-8')

          repo = Path('specialist_clinic/src/adapters/sqlite/sms_auto_guard_repo.py')
          text = repo.read_text(encoding='utf-8')
          begin = text.index('        except sqlite3.IntegrityError:\n', text.index('def publish_policy'))
          end = text.index('        row = self.db.execute(\n', begin)
          if 'sms_auto_guard_policy_versions' not in text[begin:end]:
              raise SystemExit('policy conflict block mismatch')
          text = text[:begin] + '''        except sqlite3.IntegrityError:
            self.db.rollback()
            current = self.latest_policy(policy_key)
            if current and str(current["content_hash"]) == digest:
                return current, False
            raise
''' + text[end:]
          begin = text.index('        except sqlite3.IntegrityError:\n', text.index('def publish_template'))
          end = text.index('        row = self.db.execute(\n', begin)
          if 'sms_auto_guard_template_versions' not in text[begin:end]:
              raise SystemExit('template conflict block mismatch')
          text = text[:begin] + '''        except sqlite3.IntegrityError:
            self.db.rollback()
            current = self.latest_template(event_key)
            if current and str(current["content_hash"]) == digest:
                return current, False
            raise
''' + text[end:]
          repo.write_text(text, encoding='utf-8')

          service = Path('specialist_clinic/src/services/sms/auto_guard_service.py')
          text = service.read_text(encoding='utf-8')
          old = '''        current = _now(now)
        repo = SmsAutoGuardRepository(self.db, ensure=True)
        candidate = repo.get_candidate(candidate_id)
'''
          new = '''        current = _now(now)
        repo = SmsAutoGuardRepository(self.db)
        if not repo.ready():
            if not _flag_enabled():
                return {
                    "ok": False,
                    "candidate_id": int(candidate_id),
                    "reason": "FEATURE_DISABLED",
                }
            repo = SmsAutoGuardRepository(self.db, ensure=True)
        candidate = repo.get_candidate(candidate_id)
'''
          if text.count(old) != 1:
              raise SystemExit(f'safe-off execution marker count={text.count(old)}')
          service.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('specialist_clinic/tests/test_followup_orchestration_fo6_sms_auto_guard.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              '    assert "scheduler" not in service.lower()\n',
              '    assert "apscheduler" not in service.lower()\n',
              1,
          )
          regression = '''

def test_policy_reversion_creates_a_new_immutable_version(fo6_app):
    from src.adapters.sqlite.core import get_db
    from src.services.sms.auto_guard_service import SmsAutoGuardService

    db = get_db()
    _seed_due_patient(db)
    service = SmsAutoGuardService(db)
    first = service.publish_current_contract(
        actor_username="pytest", ttl_hours=24
    )
    second = service.publish_current_contract(
        actor_username="pytest", ttl_hours=25
    )
    third = service.publish_current_contract(
        actor_username="pytest", ttl_hours=24
    )
    assert [
        first["policy_version"],
        second["policy_version"],
        third["policy_version"],
    ] == [1, 2, 3]
    assert db.execute(
        "SELECT COUNT(*) FROM sms_auto_guard_policy_versions"
    ).fetchone()[0] == 3
'''
          if 'test_policy_reversion_creates_a_new_immutable_version' not in text:
              text += regression
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp_fo6_ui_runner.yml
          git add specialist_clinic/src specialist_clinic/tests
          git commit -m "fix(foux): harden FO-6 versioning and safe-off execution"
          git push origin HEAD:feature/foux-v1-fo6-governed-sms
