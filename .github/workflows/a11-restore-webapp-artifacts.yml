name: A11 Restore Tracked Webapp Artifacts

on:
  push:
    branches:
      - agent/specialist-rule-library-intake-a11

permissions:
  contents: write

concurrency:
  group: a11-restore-webapp-artifacts
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/specialist-rule-library-intake-a11
          fetch-depth: 0

      - name: Restore webapp source exactly from main and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          START_SHA=$(git rev-parse HEAD)
          git fetch origin main
          git checkout origin/main -- webapp/src
          rm -f .github/workflows/a11-restore-webapp-artifacts.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "restore tracked webapp artifacts after A11 gate"
          git push \
            --force-with-lease=refs/heads/agent/specialist-rule-library-intake-a11:${START_SHA} \
            origin HEAD:refs/heads/agent/specialist-rule-library-intake-a11
