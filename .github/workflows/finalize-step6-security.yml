name: Finalize Operational Security Hardening

on:
  push:
    branches:
      - agent-clinical-operational-security

permissions:
  contents: write

concurrency:
  group: finalize-step6-security
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-clinical-operational-security
          fetch-depth: 0

      - name: Apply reviewed security wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, *, count=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise AssertionError(f'pattern missing in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          # Keep fencing tokens monotonic while making release effective as soon as
          # the persisted heartbeat/check constraint permits.
          path = Path('specialist_clinic/src/adapters/sqlite/operational_lease_repo.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def release(')
          end = text.index('\n    def assert_current(', start)
          release = '''    def release(self, lease: Lease, *, now: datetime | None = None) -> bool:
        """Expire the lease without deleting its monotonic fencing-token row."""
        current = _local_naive(now)
        db = self._db()
        db.execute("BEGIN IMMEDIATE")
        try:
            row = db.execute(
                """SELECT heartbeat_at FROM operational_leases
                   WHERE lease_name=? AND owner_id=? AND fencing_token=?""",
                (lease.lease_name, lease.owner_id, lease.fencing_token),
            ).fetchone()
            if not row:
                db.rollback()
                return False
            heartbeat = datetime.fromisoformat(row["heartbeat_at"])
            expiry = current
            if expiry <= heartbeat:
                expiry = heartbeat + timedelta(seconds=1)
            cursor = db.execute(
                """UPDATE operational_leases SET expires_at=?
                   WHERE lease_name=? AND owner_id=? AND fencing_token=?""",
                (
                    _text(expiry),
                    lease.lease_name,
                    lease.owner_id,
                    lease.fencing_token,
                ),
            )
            db.commit()
            return cursor.rowcount == 1
        except Exception:
            db.rollback()
            raise
'''
          path.write_text(text[:start] + release + text[end:], encoding='utf-8')

          # Install all step-5/6 operational schemas in the canonical migration and
          # increase contention tolerance for request/scheduler coexistence.
          replace(
              'specialist_clinic/src/adapters/sqlite/core.py',
              'db = g._database = sqlite3.connect(db_path)',
              'db = g._database = sqlite3.connect(db_path, timeout=10)',
          )
          replace(
              'specialist_clinic/src/adapters/sqlite/core.py',
              'db.execute("PRAGMA busy_timeout = 3000")',
              '''db.execute("PRAGMA busy_timeout = 10000")
        if db_path != ":memory:":
            db.execute("PRAGMA journal_mode = WAL")
            db.execute("PRAGMA synchronous = NORMAL")
            db.execute("PRAGMA wal_autocheckpoint = 1000")''',
          )
          replace(
              'specialist_clinic/src/adapters/sqlite/core.py',
              '''    ensure_clinical_reconciliation_storage(db)
    ensure_clinical_data_conflict_storage(db)
    _ensure_clinical_engine_v2_storage(db)
''',
              '''    ensure_clinical_reconciliation_storage(db)
    ensure_clinical_data_conflict_storage(db)
    from src.adapters.sqlite.clinical_care_loop_schema import (
        ensure_clinical_care_loop_storage,
    )
    from src.adapters.sqlite.security_permission_schema import (
        ensure_security_permission_storage,
    )
    from src.adapters.sqlite.operational_lease_schema import (
        ensure_operational_lease_storage,
    )
    from src.adapters.sqlite.clinical_audit_integrity_schema import (
        ensure_clinical_audit_integrity_storage,
    )
    ensure_clinical_care_loop_storage(db)
    ensure_security_permission_storage(db)
    ensure_operational_lease_storage(db)
    ensure_clinical_audit_integrity_storage(db)
    _ensure_clinical_engine_v2_storage(db)
''',
          )

          # Cover post-activation events with a daily checkpoint under the same
          # scheduler lease and durable idempotency ledger.
          replace(
              'specialist_clinic/src/services/scheduler.py',
              '''            if self._run_once(
                job_name="clinical-followups",
                period_key=today,
                lease=lease,
                callback=self._run_clinical_followups,
            ):
                self._last_followup_day = today

            period = self._bucket(now)
''',
              '''            if self._run_once(
                job_name="clinical-followups",
                period_key=today,
                lease=lease,
                callback=self._run_clinical_followups,
            ):
                self._last_followup_day = today
            self._run_once(
                job_name="clinical-audit-checkpoint",
                period_key=today,
                lease=lease,
                callback=self._seal_clinical_audit,
            )

            period = self._bucket(now)
''',
          )
          replace(
              'specialist_clinic/src/services/scheduler.py',
              '''    def _run_engagement(self):
''',
              '''    def _seal_clinical_audit(self):
        from src.services.clinical_audit_integrity import (
            ClinicalAuditIntegrityService,
        )

        checkpoint = ClinicalAuditIntegrityService().seal(
            created_by=f"scheduler:{self.owner_id}"
        )
        logger.info(
            "[scheduler] clinical audit checkpoint id=%s hash=%s",
            checkpoint["id"],
            checkpoint["checkpoint_hash"][:12],
        )
        return True

    def _run_engagement(self):
''',
          )

          # A visible activation must satisfy both its referenced checkpoint and the
          # latest chained checkpoint.
          replace(
              'specialist_clinic/src/adapters/sqlite/clinical_engine_activation_repo.py',
              '''            verification = ClinicalAuditIntegrityService().verify_checkpoint(
                int(checkpoint_id),
                expected_hash=str(checkpoint_hash),
            )
            return verification.ok
''',
              '''            service = ClinicalAuditIntegrityService()
            verification = service.verify_checkpoint(
                int(checkpoint_id),
                expected_hash=str(checkpoint_hash),
            )
            latest = service.verify_latest(require_checkpoint=True)
            return verification.ok and latest.ok
''',
          )

          # Tehran-local operational timestamps are compared against Tehran-local rows.
          replace(
              'specialist_clinic/src/api/health.py',
              "datetime(lease.expires_at)>datetime('now')",
              "datetime(lease.expires_at)>datetime('now','+3 hours','+30 minutes')",
          )

          # Safety-critical patient mutations use stable permission keys.
          path = Path('specialist_clinic/src/api/patients.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from src.api.auth import login_required\n',
              'from src.api.auth import login_required\nfrom src.security.permissions import Permission, permission_required\n',
              1,
          )
          route_permissions = {
              '@bp.route("/<int:pid>/clinical-v2/decision", methods=["POST"])\n@login_required':
                  '@bp.route("/<int:pid>/clinical-v2/decision", methods=["POST"])\n@permission_required(Permission.CLINICAL_DECISION_RECORD)',
              '@bp.route("/<int:pid>/flags", methods=["POST"])\n@login_required':
                  '@bp.route("/<int:pid>/flags", methods=["POST"])\n@permission_required(Permission.CLINICAL_DATA_RECORD)',
              '@bp.route("/<int:pid>/condition/add", methods=["POST"])\n@login_required':
                  '@bp.route("/<int:pid>/condition/add", methods=["POST"])\n@permission_required(Permission.CLINICAL_DATA_RECORD)',
              '@bp.route("/<int:pid>/condition/<int:pc_id>/remove", methods=["POST"])\n@login_required':
                  '@bp.route("/<int:pid>/condition/<int:pc_id>/remove", methods=["POST"])\n@permission_required(Permission.CLINICAL_DATA_RECORD)',
              '@bp.route("/<int:pid>/medication/add", methods=["POST"])\n@login_required':
                  '@bp.route("/<int:pid>/medication/add", methods=["POST"])\n@permission_required(Permission.CLINICAL_DATA_RECORD)',
              '@bp.route("/<int:pid>/medication/<int:med_id>/stop", methods=["POST"])\n@login_required':
                  '@bp.route("/<int:pid>/medication/<int:med_id>/stop", methods=["POST"])\n@permission_required(Permission.CLINICAL_DATA_RECORD)',
              '@bp.route("/<int:pid>/medication/<int:med_id>/dose", methods=["POST"])\n@login_required':
                  '@bp.route("/<int:pid>/medication/<int:med_id>/dose", methods=["POST"])\n@permission_required(Permission.CLINICAL_DATA_RECORD)',
              '@bp.route("/<int:pid>/allergy/add", methods=["POST"])\n@login_required':
                  '@bp.route("/<int:pid>/allergy/add", methods=["POST"])\n@permission_required(Permission.CLINICAL_DATA_RECORD)',
              '@bp.route("/<int:pid>/allergy/<int:allergy_id>/delete", methods=["POST"])\n@login_required':
                  '@bp.route("/<int:pid>/allergy/<int:allergy_id>/delete", methods=["POST"])\n@permission_required(Permission.CLINICAL_DATA_RECORD)',
              '@bp.route("/<int:pid>/followups/generate", methods=["POST"])\n@login_required':
                  '@bp.route("/<int:pid>/followups/generate", methods=["POST"])\n@permission_required(Permission.CLINICAL_TASK_TRANSITION)',
          }
          for old, new in route_permissions.items():
              if old not in text:
                  raise AssertionError(f'patient permission pattern missing: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Dynamic rule-governance actions require the permission that matches the
          # action rather than the broad manager role.
          path = Path('specialist_clinic/src/api/manager.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from src.api.auth import login_required, manager_required\n',
              'from src.api.auth import login_required, manager_required\nfrom src.security.permissions import Permission, has_permission, permission_required\n',
              1,
          )
          text = text.replace(
              '@bp.route("/clinical-engine")\n@manager_required',
              '@bp.route("/clinical-engine")\n@permission_required(Permission.RULE_REVIEW_CLINICAL)',
              1,
          )
          old = '''def clinical_engine_action(action):
    """One guarded manager seam; the service remains the sole policy owner."""
    service = ClinicalEngineActivationService()
'''
          new = '''def clinical_engine_action(action):
    """One governed seam; service remains the sole clinical policy owner."""
    if action in {
        "activate-selected", "verify-selected", "promote-ruleset",
        "activate-global", "rollback", "reset-workflow",
    }:
        required = Permission.RULE_ACTIVATE
    elif action == "approve" and request.form.get("role") == "technical":
        required = Permission.RULE_REVIEW_TECHNICAL
    elif action in {"prepare-rules", "compare", "prepare-demo-cohort"}:
        required = Permission.RULE_REVIEW_TECHNICAL
    else:
        required = Permission.RULE_REVIEW_CLINICAL
    if not has_permission(required):
        flash("مجوز governشدهٔ لازم برای این عملیات ثبت نشده است.", "error")
        return redirect(url_for("manager.clinical_engine") + "#engine-actions")
    service = ClinicalEngineActivationService()
'''
          if old not in text:
              raise AssertionError('manager clinical action seam missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Template affordances follow effective permissions, including per-user
          # grants/revocations.
          path = Path('specialist_clinic/src/templates/followups/worklist.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "{% elif g.user and g.user['role'] == 'manager' %}",
              "{% elif permissions.get('clinical.task.transition') or permissions.get('clinical.outcome.record') %}",
          )
          path.write_text(text, encoding='utf-8')

          path = Path('specialist_clinic/src/templates/base.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "{% if g.user['role']=='manager' %}",
              "{% if permissions.get('rule.review.clinical') or permissions.get('rule.activate') or permissions.get('security.grant.manage') %}",
              1,
          )
          text = text.replace(
              '''<a class="nav-item {% if active_page=='manager' %}active{% endif %}" href="{{ url_for('manager.index') }}"{% if active_page=='manager' %} aria-current="page"{% endif %}><svg class="icon"><use href="#i-settings"></use></svg> تنظیمات سیستم</a>''',
              '''{% if permissions.get('security.grant.manage') %}<a class="nav-item {% if active_page=='manager' %}active{% endif %}" href="{{ url_for('manager.index') }}"{% if active_page=='manager' %} aria-current="page"{% endif %}><svg class="icon"><use href="#i-settings"></use></svg> تنظیمات سیستم</a>{% endif %}''',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and validate source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-step6-security.yml
          python -m compileall -q specialist_clinic/src specialist_clinic/tests
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: specialist_clinic/requirements.txt

      - name: Install dependencies
        working-directory: specialist_clinic
        run: python -m pip install -r requirements.txt pytest

      - name: Run operational security gate
        working-directory: specialist_clinic
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONIOENCODING: utf-8
        run: >-
          python -m pytest -q --tb=short
          tests/test_operational_security_hardening.py
          tests/test_backup_and_logging.py
          tests/test_clinical_closed_care_loop.py
          tests/test_clinical_reconciliation_ui.py
          tests/test_clinical_engine_v2_activation.py
          tests/test_clinical_engine_v2_runtime_freshness.py
          tests/test_patient_mutation_ownership.py

      - name: Commit clean security implementation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'complete clinical operational security hardening'
          git push origin HEAD:agent-clinical-operational-security
