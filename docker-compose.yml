# docker-compose.yml — root of repo (hesabdari_darmangah/)
#
# Services:
#   postgres  — Postgres 16, throwaway dev/CI DB (no production data here)
#   halqe     — Django backend built from halqe/Dockerfile (context = repo root)
#
# Build context is the repo root so the Dockerfile can COPY:
#   halqe/           (the Django app)
#   halqe/db/schema/ (SQL schema slices, copied into /slices)
#
# OWNER GATE (Step 55): when deploying to a real VPS in Iran, replace the
# dummy SECRET_KEY below with a real secret (min 50 random chars), set
# PG_PASSWORD/PG_APP_PASSWORD to strong values, and point ALLOWED_HOSTS at
# your domain. Web (Next.js) + Nginx are NOT in this compose — add them in
# the Step-55 runbook alongside this file.
#
# Local usage:
#   docker compose up -d --build
#   curl http://localhost:8010/healthz   # {"status": "ok"}
#   curl http://localhost:8010/readyz    # {"status": "ready"}
#   docker compose down

services:

  # ── Postgres 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       halqe_app
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: pg_local_dev_pw_changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port NOT exposed to host by default (internal only).
    # Uncomment the line below only for local DB inspection:
    # ports: ["55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d halqe_app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── halqe Django backend ─────────────────────────────────────────────────────
  halqe:
    build:
      context: .
      dockerfile: halqe/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ── Postgres coordinates ────────────────────────────────────────────────
      PG_HOST:           postgres
      PG_PORT:           "5432"
      PG_DB:             halqe_app

      # Superuser — used only by apply_schema + ensure_app_role at startup.
      PG_USER:           postgres
      PG_PASSWORD:       pg_local_dev_pw_changeme

      # Least-privilege app LOGIN role — used by all Django ORM connections.
      PG_APP_USER:       halqe_app_role
      PG_APP_PASSWORD:   app_role_local_pw_changeme

      # ── Django production hardening ─────────────────────────────────────────
      # PRODUCTION=1 activates the fail-fast checks in config/env.py:
      #   - SECRET_KEY must be non-empty and not the dev placeholder
      #   - DEBUG is forced to False
      #   - ALLOWED_HOSTS must be explicit (no wildcard)
      PRODUCTION:        "1"

      # Use a strong random key in real deployments (min 50 chars, no spaces).
      # This dummy key is only for local docker compose smoke testing.
      SECRET_KEY:        "local-compose-dummy-key-do-not-use-in-production-abc123xyz"

      ALLOWED_HOSTS:     "localhost,127.0.0.1,halqe"
      DEBUG:             "False"

      # CONN_MAX_AGE invariant — must stay 0 (ADR-0008, GUC lifecycle).
      CONN_MAX_AGE:      "0"

      # Gunicorn worker count (3 is sensible for a single-VPS deploy).
      GUNICORN_WORKERS:  "3"

    ports:
      # Map to host port 8010 to avoid conflict with existing apps (8080/8090)
      # and with the halqe_pg_validate container (which uses 55432/55433).
      - "8010:8000"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
